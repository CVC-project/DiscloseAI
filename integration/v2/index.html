<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no" />
  <title>DiscloseAI · Corporate Galaxy Atlas (v2)</title>
  <link rel="icon" href="data:," />
  <!-- FN-004/FN-009: CSS도 캐시버스트 대상 — 버전 없이 두면 브라우저가 구버전 스타일시트를
       계속 써서 "고쳤는데 안 고쳐짐"이 된다(EgoView 캔버스 붕괴로 실제 발생). 수정 시 함께 올릴 것. -->
  <link rel="stylesheet" href="../dossier/tokens.css?v=k1a" /><!-- 층1 공유 프리미티브(간격·radius·타입 스케일) — DESIGN.md 단일 토큰 체계 -->
  <link rel="stylesheet" href="./styles.css?v=k1c" />
  <style>
    /* Cross-env layout normalization — prevents zoom/scale differences on GitHub Pages */
    html {
      box-sizing: border-box;
      font-size: 16px;          /* explicit base prevents browser-default variance */
      text-size-adjust: 100%;   /* disables iOS auto-text-size on orientation change */
      -webkit-text-size-adjust: 100%;
    }
    *, *::before, *::after { box-sizing: inherit; }
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;          /* no scrollbar affecting layout */
    }
    /* Fix 1: PNG is dark-themed — invert to get white suit (alpha channel preserved) */
    .mascot-img { filter: invert(0.88) brightness(1.15) saturate(0.6) !important; }
    /* Fix 2: TL panel width matches BL legend-panel (320px) */
    .panel-tl { width: 320px !important; }
    /* Fix panel-head text overflow — prevent wrapping */
    .panel-head { flex-wrap: nowrap !important; gap: 4px !important; }
    .panel-head-l { flex-shrink: 1; min-width: 0; display: flex; align-items: center; gap: 6px; overflow: hidden; }
    .panel-title, .panel-sub, .panel-count { white-space: nowrap !important; overflow: hidden; text-overflow: ellipsis; }
    .panel-count { flex-shrink: 0; }
    /* Sector chip: single row — EN text | KO badge | cap
       4-column grid: dot | EN (flex-grow) | KO badge | cap */
    .sector-chip {
      grid-template-columns: 8px 1fr auto auto !important;
      grid-template-rows: auto !important;
    }
    .sector-chip .sector-en {
      grid-column: 2 !important; grid-row: 1 !important;
      align-self: center !important;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .sector-chip .sector-ko {
      grid-column: 3 !important; grid-row: 1 !important;
      margin-left: 6px !important; margin-top: 0 !important;
      align-self: center !important;
      font-size: 10px !important;
      padding: 1px 5px !important;
      background: color-mix(in oklab, var(--c, #5eead4) 14%, transparent) !important;
      border: 1px solid color-mix(in oklab, var(--c, #5eead4) 40%, transparent) !important;
      border-radius: 2px !important;
      white-space: nowrap !important;
    }
    .sector-chip .sector-cap {
      grid-column: 4 !important; grid-row: 1 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <!-- React 18 + Babel in-browser CDN. v2 standalone과 동일 스택. -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>

  <!-- Static asset paths (standalone JSX expects window.__resources for mascot etc.) -->
  <script>
    window.__resources = {
      astronaut: "./assets/astronaut.png",
    };
  </script>

  <!-- Data layer: mock + valuation + narration + loader (J3 산출물). -->
  <script src="./data/mock.js?v=k3a"></script>
  <script src="./data/valuation.js?v=k3a"></script>
  <script src="./data/narration.js?v=k3a"></script>
  <script src="./data/loader.js?v=k3a"></script>

  <!-- 로컬 AI 키 설정 — config.local.js 는 .gitignore에 포함 (커밋 안 됨)
       config.local.js.example 을 복사하여 Gemini API 키를 입력하세요. -->
  <script src="./config.local.js" onerror="window.GEMINI_API_KEY=null;"></script>

  <!-- Adapter: fetches via DiscloseAI.loadAll, builds standalone-shaped globals
       (window.__realData), then dynamically injects src/bundle.jsx. -->
  <script src="./src/adapter.js?v=k4m"></script>
</body>
</html>
