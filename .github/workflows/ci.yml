name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Black formatting check
        # 보수적 확대: 정리 완료된 폴더만. financial/price/relation/tests/scripts는
        # 별도 포맷 협의 PR 후 추가 (현재 미통과 → 일괄 재포맷은 타 모듈 코드 변경이라 보류)
        run: python -m black --check modules/disclosure/ integration/ shared/
      - name: Pytest
        run: python -m pytest tests/ -v
