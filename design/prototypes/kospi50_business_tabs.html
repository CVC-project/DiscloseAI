<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>국내상장기업 사업보고서 reader</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:#060914;
      --panel:#0c1222;
      --panel2:#11182b;
      --line:rgba(148,163,184,.18);
      --text:#edf6ff;
      --soft:#b8c6d9;
      --muted:#7d8ba3;
      --cyan:#41dcff;
      --teal:#36e5bd;
      --pink:#ff4f7e;
      --gold:#f7d56f;
      --violet:#9d81ff;
      font-family: Inter, Pretendard, "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin:0;
      min-height:100vh;
      background:
        radial-gradient(circle at 15% 4%, rgba(65,220,255,.18), transparent 28%),
        radial-gradient(circle at 86% 0%, rgba(255,79,126,.18), transparent 30%),
        radial-gradient(circle at 54% 74%, rgba(157,129,255,.14), transparent 38%),
        var(--bg);
      color:var(--text);
    }
    body::before {
      content:"";
      position:fixed;
      inset:0;
      pointer-events:none;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.35) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(65,220,255,.25) 0 1px, transparent 1.5px);
      background-size: 92px 92px, 137px 137px;
      background-position: 0 0, 42px 24px;
      opacity:.16;
    }
    a { color: inherit; }
    button, input { font: inherit; }
    .page { position:relative; z-index:1; width:min(1440px, calc(100% - 32px)); margin:0 auto; padding:22px 0 30px; }
    .hero {
      display:grid;
      grid-template-columns:minmax(0, 1fr) auto;
      gap:16px;
      align-items:start;
      margin-bottom:18px;
    }
    .eyebrow { color:var(--cyan); font-size:11px; font-weight:950; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:5px 0 8px; font-size:clamp(32px, 4.2vw, 54px); line-height:1.04; letter-spacing:0; white-space:nowrap; }
    .subtitle { display:flex; flex-wrap:wrap; gap:8px; color:var(--soft); font-size:12px; line-height:1.55; }
    .subtitle span, .hero-badge {
      border:1px solid rgba(255,255,255,.10);
      border-radius:999px;
      background:rgba(6,10,20,.62);
      padding:6px 10px;
    }
    .hero-actions { display:flex; flex-wrap:wrap; gap:8px; justify-content:flex-end; }
    .hero-badge { color:var(--soft); font-size:12px; font-weight:850; white-space:nowrap; }
    .tabs { display:flex; gap:8px; border:1px solid var(--line); border-radius:18px; background:rgba(6,10,20,.74); padding:8px; margin-bottom:16px; }
    .tab { border:0; border-radius:999px; padding:10px 16px; background:transparent; color:var(--muted); font-size:12px; font-weight:950; }
    .tab.active { background:linear-gradient(135deg, var(--cyan), var(--teal)); color:#031018; box-shadow:0 0 28px rgba(65,220,255,.25); }
    .tab[disabled] { opacity:.48; }
    .workspace { display:grid; grid-template-columns:320px minmax(0,1fr); gap:16px; align-items:start; }
    .rail, .panel {
      border:1px solid var(--line);
      border-radius:16px;
      background:rgba(8,13,27,.78);
      box-shadow:0 18px 50px rgba(0,0,0,.26);
    }
    .rail { position:sticky; top:14px; max-height:calc(100vh - 28px); overflow:hidden; }
    .rail-head { padding:15px; border-bottom:1px solid var(--line); }
    .rail-head h2 { margin:0 0 10px; font-size:17px; }
    .search { width:100%; border:1px solid rgba(255,255,255,.12); border-radius:12px; background:rgba(255,255,255,.05); color:var(--text); padding:10px 11px; outline:0; }
    .sorts { display:grid; grid-template-columns:repeat(2, 1fr); gap:6px; margin-top:9px; }
    .sort-btn { border:1px solid rgba(255,255,255,.10); border-radius:10px; background:rgba(255,255,255,.04); color:var(--soft); padding:7px 6px; font-size:11px; font-weight:900; cursor:pointer; }
    .sort-btn.active { border-color:rgba(65,220,255,.58); color:var(--cyan); background:rgba(65,220,255,.10); }
    .company-list { max-height:calc(100vh - 166px); overflow:auto; padding:8px; }
    .company-btn {
      width:100%;
      border:1px solid transparent;
      border-radius:12px;
      background:transparent;
      color:var(--soft);
      text-align:left;
      padding:10px;
      cursor:pointer;
      display:grid;
      grid-template-columns:34px minmax(0,1fr) auto;
      gap:9px;
      align-items:center;
    }
    .company-btn:hover, .company-btn.active { border-color:rgba(65,220,255,.28); background:rgba(65,220,255,.08); }
    .rank { color:var(--muted); font-size:11px; font-weight:950; }
    .cname { color:var(--text); font-size:13px; font-weight:950; overflow:visible; white-space:normal; text-overflow:clip; line-height:1.3; }
    .cticker { color:var(--muted); font-size:10px; margin-top:2px; }
    .sector-pill {
      max-width:92px;
      overflow:visible;
      text-overflow:clip;
      white-space:normal;
      border:1px solid rgba(65,220,255,.18);
      border-radius:999px;
      background:rgba(65,220,255,.08);
      color:var(--cyan);
      padding:5px 8px;
      font-size:10px;
      font-weight:950;
      line-height:1.25;
    }
    .panel { overflow:hidden; }
    .company-hero {
      position:relative;
      min-height:430px;
      border-bottom:1px solid var(--line);
      background:
        radial-gradient(ellipse at 50% 46%, rgba(65,220,255,.14), transparent 40%),
        radial-gradient(ellipse at 74% 72%, rgba(255,79,126,.11), transparent 36%),
        linear-gradient(135deg, rgba(8,15,34,.96), rgba(18,11,32,.92));
      padding:28px 32px;
      overflow:hidden;
    }
    .orbit-lines, .planet, .planet-ring { position:absolute; left:50%; top:50%; transform:translate(-50%, -50%); }
    .orbit-lines { width:720px; height:300px; border:1px solid rgba(65,220,255,.10); border-radius:50%; transform:translate(-50%, -50%) rotate(-9deg); }
    .orbit-lines::before, .orbit-lines::after {
      content:""; position:absolute; inset:38px 70px; border:1px solid rgba(157,129,255,.10); border-radius:50%;
    }
    .orbit-lines::after { inset:76px 130px; border-color:rgba(247,213,111,.10); }
    .planet {
      width:178px; height:178px; border-radius:50%;
      display:grid; place-items:center; text-align:center; padding:26px;
      background:
        radial-gradient(circle at 34% 26%, rgba(255,255,255,.86) 0 5px, transparent 8px),
        radial-gradient(circle at 36% 30%, rgba(255,255,255,.16), transparent 18%),
        radial-gradient(circle at 62% 65%, rgba(3,8,16,.92), rgba(16,79,96,.75) 45%, rgba(65,220,255,.22) 100%);
      border:1px solid rgba(65,220,255,.42);
      box-shadow:0 0 42px rgba(65,220,255,.18), inset -34px -36px 45px rgba(0,0,0,.46);
      z-index:3;
    }
    .planet-ring {
      width:310px; height:80px; border-radius:50%; border:13px solid rgba(247,213,111,.32); border-left-color:rgba(65,220,255,.22); border-right-color:rgba(255,79,126,.26); transform:translate(-50%, -50%) rotate(-10deg); z-index:2;
      mask-image:linear-gradient(to bottom, transparent 0 42%, #000 43% 100%);
    }
    .planet strong { display:block; font-size:23px; line-height:1.1; }
    .planet span { display:block; margin-top:8px; color:var(--soft); font-size:11px; line-height:1.4; }
    .hero-grid { position:relative; z-index:4; display:grid; grid-template-columns:260px 260px; gap:18px; justify-content:space-between; height:100%; }
    .hero-grid.cards-3 .orbit-card:nth-child(3) { grid-column:1 / -1; justify-self:center; }
    .hero-grid.cards-2 { align-content:center; }
    .hero-grid.cards-2 .orbit-card:nth-child(2) { grid-column:2; }
    .orbit-card {
      width:260px; min-height:205px;
      border:1px solid rgba(65,220,255,.20);
      border-radius:16px;
      background:rgba(5,10,22,.75);
      padding:12px;
      box-shadow:0 12px 36px rgba(0,0,0,.28);
    }
    .orbit-card:nth-child(2), .orbit-card:nth-child(4) { border-color:rgba(255,79,126,.22); }
    .orbit-card h3 { margin:12px 2px 7px; font-size:14px; }
    .orbit-card p { margin:0 2px; color:var(--soft); font-size:12px; line-height:1.5; }
    .product-visual {
      position:relative;
      height:112px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.10);
      border-radius:11px;
      background:
        radial-gradient(circle at 72% 24%, rgba(65,220,255,.22), transparent 22%),
        linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.02));
    }
    .product-visual.has-image {
      background:rgba(2,6,15,.90);
    }
    .product-visual.has-image::before {
      z-index:1;
      inset:0;
      background:
        linear-gradient(90deg, rgba(2,6,15,.62), transparent 44%, rgba(2,6,15,.16)),
        linear-gradient(180deg, transparent 52%, rgba(2,6,15,.72));
      transform:none;
    }
    .product-visual.has-image::after,
    .product-visual.has-image .art { display:none; }
    .segment-image {
      position:absolute;
      inset:0;
      width:100%;
      height:100%;
      object-fit:cover;
      filter:saturate(1.05) contrast(1.05);
    }
    .photo-source {
      position:absolute;
      right:8px;
      top:8px;
      z-index:2;
      border:1px solid rgba(255,255,255,.18);
      border-radius:999px;
      background:rgba(0,0,0,.46);
      color:rgba(255,255,255,.78);
      padding:3px 7px;
      font-size:9px;
      font-weight:900;
    }
    .product-visual::before {
      content:"";
      position:absolute;
      inset:-30% -20%;
      background:linear-gradient(115deg, transparent 0 36%, rgba(255,255,255,.18) 46%, transparent 58%);
      transform:translateX(-22%);
    }
    .product-visual::after {
      content:"";
      position:absolute;
      right:12px;
      bottom:10px;
      width:58px;
      height:40px;
      border-radius:10px;
      border:2px solid rgba(255,255,255,.26);
      background:rgba(0,0,0,.20);
      box-shadow:0 0 22px rgba(65,220,255,.18);
    }
    .product-visual .art {
      position:absolute;
      z-index:1;
      display:block;
      border:2px solid rgba(255,255,255,.22);
      background:rgba(3,8,18,.42);
      box-shadow:0 0 24px rgba(65,220,255,.16);
    }
    .product-visual.device .art.a { right:38px; bottom:14px; width:34px; height:58px; border-radius:13px; border-color:rgba(65,220,255,.72); }
    .product-visual.device .art.b { right:82px; bottom:22px; width:70px; height:44px; border-radius:12px; border-color:rgba(54,229,189,.55); }
    .product-visual.device .art.c { right:18px; bottom:20px; width:22px; height:42px; border-radius:8px; border-color:rgba(255,255,255,.28); }
    .product-visual.chip .art.a,
    .product-visual.storage .art.a,
    .product-visual.sensor .art.a {
      right:34px; bottom:15px; width:58px; height:58px; border-radius:12px;
      background:linear-gradient(135deg, rgba(255,79,126,.38), rgba(7,10,23,.86));
      border-color:rgba(255,79,126,.68);
      box-shadow:inset 0 0 0 8px rgba(255,255,255,.04), 0 0 26px rgba(255,79,126,.22);
    }
    .product-visual.chip .art.b,
    .product-visual.storage .art.b {
      right:96px; bottom:25px; width:58px; height:38px; border-radius:8px;
      transform:skewX(-15deg);
      border-color:rgba(247,213,111,.48);
    }
    .product-visual.sensor .art.b { right:104px; bottom:28px; width:44px; height:44px; border-radius:50%; border-color:rgba(65,220,255,.55); }
    .product-visual.display .art.a { right:36px; bottom:18px; width:86px; height:50px; border-radius:10px; border-color:rgba(157,129,255,.78); background:linear-gradient(135deg, rgba(157,129,255,.26), rgba(65,220,255,.12)); }
    .product-visual.display .art.b { right:16px; bottom:26px; width:52px; height:34px; border-radius:8px; transform:rotate(6deg); border-color:rgba(65,220,255,.40); }
    .product-visual.auto .art.a { right:30px; bottom:24px; width:96px; height:34px; border-radius:20px 20px 10px 10px; border-color:rgba(247,213,111,.78); }
    .product-visual.auto .art.b { right:47px; bottom:19px; width:12px; height:12px; border-radius:50%; background:var(--gold); border:0; }
    .product-visual.auto .art.c { right:104px; bottom:19px; width:12px; height:12px; border-radius:50%; background:var(--gold); border:0; }
    .product-visual.finance .art.a { right:35px; bottom:18px; width:86px; height:54px; border-radius:8px; border-color:rgba(65,220,255,.52); }
    .product-visual.finance .art.a::before { content:""; position:absolute; left:12px; right:12px; top:10px; height:6px; border-radius:99px; background:rgba(65,220,255,.55); box-shadow:0 14px 0 rgba(65,220,255,.35), 0 28px 0 rgba(65,220,255,.25); }
    .product-visual.card .art.a { right:28px; bottom:22px; width:98px; height:56px; border-radius:13px; border-color:rgba(65,220,255,.55); background:linear-gradient(135deg, rgba(65,220,255,.24), rgba(54,229,189,.10)); }
    .product-visual.card .art.a::before { content:""; position:absolute; left:10px; top:13px; width:24px; height:16px; border-radius:5px; background:rgba(247,213,111,.55); }
    .product-visual.shield .art.a { right:52px; bottom:14px; width:58px; height:66px; border-radius:30px 30px 14px 14px; border-color:rgba(54,229,189,.58); background:linear-gradient(180deg, rgba(54,229,189,.22), rgba(65,220,255,.08)); }
    .product-visual.bio .art.a { right:44px; bottom:15px; width:22px; height:62px; border-radius:12px 12px 8px 8px; border-color:rgba(54,229,189,.62); }
    .product-visual.bio .art.b { right:78px; bottom:16px; width:22px; height:58px; border-radius:12px 12px 8px 8px; border-color:rgba(157,129,255,.58); }
    .product-visual.battery .art.a { right:30px; bottom:24px; width:100px; height:48px; border-radius:12px; border-color:rgba(54,229,189,.62); }
    .product-visual.battery .art.a::before { content:""; position:absolute; inset:10px 12px; background:repeating-linear-gradient(90deg, rgba(54,229,189,.50) 0 10px, transparent 10px 16px); }
    .product-visual.ship .art.a { right:26px; bottom:20px; width:118px; height:38px; border-radius:4px 4px 26px 26px; border-color:rgba(65,220,255,.48); transform:skewX(-12deg); }
    .product-visual.aero .art.a { right:40px; bottom:28px; width:98px; height:24px; border-radius:50%; border-color:rgba(247,213,111,.55); transform:rotate(-8deg); }
    .product-visual.energy .art.a { right:56px; bottom:14px; width:42px; height:70px; border-radius:9px; border-color:rgba(247,213,111,.60); }
    .product-visual.platform .art.a,
    .product-visual.game .art.a,
    .product-visual.lab .art.a,
    .product-visual.factory .art.a,
    .product-visual.chem .art.a,
    .product-visual.steel .art.a,
    .product-visual.signal .art.a {
      right:34px; bottom:16px; width:82px; height:56px; border-radius:16px;
      border-color:rgba(65,220,255,.48);
    }
    .product-visual.platform .art.a::before,
    .product-visual.game .art.a::before,
    .product-visual.lab .art.a::before,
    .product-visual.factory .art.a::before,
    .product-visual.chem .art.a::before,
    .product-visual.steel .art.a::before,
    .product-visual.signal .art.a::before {
      content:""; position:absolute; inset:13px; border-radius:50%; border:2px solid rgba(255,255,255,.26);
    }
    .product-visual.chip::after,
    .product-visual.storage::after,
    .product-visual.sensor::after {
      width:58px; height:58px; border-radius:12px;
      background:linear-gradient(135deg, rgba(255,79,126,.36), rgba(6,10,20,.82));
      box-shadow:inset 0 0 0 8px rgba(255,255,255,.04), 0 0 26px rgba(255,79,126,.22);
    }
    .product-visual.finance::after,
    .product-visual.card::after,
    .product-visual.shield::after {
      width:76px; height:42px; border-radius:12px;
      background:linear-gradient(135deg, rgba(65,220,255,.28), rgba(54,229,189,.14));
      border-color:rgba(65,220,255,.38);
    }
    .product-visual.auto::after { width:82px; height:32px; border-radius:18px 18px 8px 8px; border-color:rgba(247,213,111,.58); }
    .product-visual.display::after { width:78px; height:48px; border-radius:12px; border-color:rgba(157,129,255,.60); }
    .product-visual.bio::after { width:52px; height:52px; border-radius:50%; border-color:rgba(54,229,189,.55); }
    .visual-word {
      position:absolute;
      left:10px;
      bottom:9px;
      z-index:2;
      max-width:132px;
      border:1px solid rgba(255,255,255,.16);
      border-radius:999px;
      background:rgba(0,0,0,.42);
      color:#fff;
      padding:4px 8px;
      font-size:11px;
      font-weight:950;
      text-shadow:0 1px 8px rgba(0,0,0,.60);
    }
    .summary-list {
      display:grid;
      gap:8px;
      margin:0;
      padding:0;
      list-style:none;
    }
    .summary-list li {
      position:relative;
      border:1px solid rgba(148,163,184,.12);
      border-radius:10px;
      background:rgba(255,255,255,.035);
      color:var(--soft);
      padding:10px 12px 10px 30px;
      font-size:12.5px;
      line-height:1.55;
    }
    .summary-list li::before {
      content:"";
      position:absolute;
      left:11px;
      top:15px;
      width:7px;
      height:7px;
      border-radius:50%;
      background:linear-gradient(135deg, var(--cyan), var(--teal));
      box-shadow:0 0 14px rgba(65,220,255,.42);
    }
    .check-row { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin-top:12px; }
    .check-card {
      border:1px solid rgba(65,220,255,.16);
      border-radius:13px;
      background:linear-gradient(135deg, rgba(65,220,255,.07), rgba(255,255,255,.025));
      padding:12px;
    }
    .check-card b { display:block; color:var(--text); font-size:13px; margin-bottom:6px; }
    .check-card span { display:block; color:var(--soft); font-size:11px; line-height:1.5; }
    .check-row + .grid-2 { margin-top:12px; }
    .content { padding:18px; display:grid; gap:16px; }
    .section { border:1px solid var(--line); border-radius:14px; background:rgba(4,8,19,.64); padding:16px; }
    .section-head { display:flex; justify-content:space-between; gap:12px; align-items:start; margin-bottom:12px; }
    .section-head h2 { margin:0; font-size:20px; }
    .section-head p { margin:0; max-width:620px; color:var(--soft); font-size:12px; line-height:1.55; }
    .grid-2 { display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:12px; }
    .grid-3 { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; }
    .grid-4 { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:10px; }
    .card { min-width:0; border:1px solid rgba(148,163,184,.14); border-radius:12px; background:rgba(255,255,255,.04); padding:13px; }
    .card h3 { margin:0 0 9px; font-size:14px; }
    .card p { margin:0; color:var(--soft); font-size:12px; line-height:1.55; }
    .report-map {
      background:
        radial-gradient(circle at 10% 0%, rgba(65,220,255,.10), transparent 30%),
        radial-gradient(circle at 86% 4%, rgba(255,79,126,.10), transparent 30%),
        rgba(4,8,19,.70);
    }
    .report-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      align-items:stretch;
    }
    .report-panel {
      border:1px solid rgba(65,220,255,.16);
      border-radius:16px;
      background:linear-gradient(135deg, rgba(65,220,255,.055), rgba(255,255,255,.025));
      padding:16px;
      min-width:0;
    }
    .report-panel h3 { margin:0 0 12px; font-size:16px; }
    .engine-tiles {
      display:grid;
      grid-template-columns:repeat(2, minmax(0,1fr));
      gap:10px;
    }
    .engine-tile {
      border:1px solid rgba(255,255,255,.10);
      border-radius:13px;
      background:rgba(255,255,255,.04);
      padding:12px;
      min-height:96px;
    }
    .engine-tile strong { display:block; margin-bottom:6px; color:var(--text); font-size:13.5px; }
    .engine-tile span { display:block; color:var(--soft); font-size:12px; line-height:1.5; }
    .money-flow {
      display:grid;
      gap:9px;
      margin:0;
      padding:0;
      list-style:none;
      counter-reset:flow;
    }
    .money-flow li {
      counter-increment:flow;
      position:relative;
      border:1px solid rgba(148,163,184,.12);
      border-radius:11px;
      background:rgba(255,255,255,.04);
      color:var(--soft);
      padding:11px 12px 11px 42px;
      font-size:12.5px;
      line-height:1.55;
    }
    .money-flow li::before {
      content:counter(flow);
      position:absolute;
      left:11px;
      top:10px;
      width:20px;
      height:20px;
      display:grid;
      place-items:center;
      border-radius:50%;
      background:linear-gradient(135deg, var(--cyan), var(--teal));
      color:#031018;
      font-size:11px;
      font-weight:950;
    }
    .driver-radar {
      display:grid;
      grid-template-columns:repeat(4, minmax(0,1fr));
      gap:8px;
      margin-top:12px;
    }
    .driver-chip {
      border:1px solid rgba(255,255,255,.12);
      border-radius:13px;

5"},"snippets":{"overview":"1. 사업의 개요 당사는 경기도 이천시에 위치한 본사를 거점으로 4개의 생산기지와 3개의 연구개발법인 및 미국, 중국, 싱가포르, 대만, 홍콩 등 판매법인과 사무소를 운영하고 있는 글로벌 반도체 기업입니다. 당사 및 당사의 종속기업의 주력 제품은 DRAM 및 NAND를 중심으로 하는 메모리 반도체이며, Foundry 사업도 병행하고 있습니다. 반도체는 메모리 반도체와 시스템 반도체로 구분되고, 메모리 반도체는 정보를 저장하고 기억하는 기능을 하며, 일반적으로 '휘발성(Volatile)'과 '비휘발성(Non-volatile)'으로 분류됩니다. 휘발성 메모리 제품은 전원이 끊어지면 정보가 지워지는 반면, 비휘발성 제품은 전원이 끊겨도 저장된 정보가 계속 남아 있습니다. 당사는 휘발성 메모리인 DRAM과 비휘발성 메모리인 NAND Flash를 주력 생산하고 있습니다.","raw_material":"3. 원재료 및 생산설비 당사의 메모리 반도체 부문 생산공정에 투입되는 원재료는 크게 웨이퍼(Wafer), Substrate, PCB(Printed Circuit Board) 그리고 기타 재료 등으로 구성됩니다. 웨이퍼는 집적회로(Integrated Circuit, IC)를 제작하기 위해 반도체 물질의 단결정을 성장시킨 기둥 모양의 규소(Ingot)를 얇게 절단하여 원판 모양으로 만든 것으로서 반도체 소자를 만드는 데 사용되는 핵심 재료입니다. Substrate는 Package를 만들기 위한 원재료 중 하나로 전기 신호를 연결하면서 외부의 습기, 충격 등으로부터 칩을 보호하고 지지해주는 골격 역할을 하는 부품입니다. PCB는 그 위에 저항, 콘덴서, 코일, 트랜지스터, 집적회로, 대규모 집적회로(Large-Scale Integration), 스위치 등의 부품을 고정 및 연결하여 회로 기능을 완성시키는 인쇄회로기판입니다.그 외 가스 및 화학약품, 소자류 등이 반도체 제조 공정에 투입되는 원재료로 소요됩니다. 가. 주요 원재료 등의 현황 나.","capacity":"2. 생산실적 및 가동률 당사의 2025년 누적 생산실적은 41,216,512백만원으로 집계되었으며, 동 기간의 생산설비의 평균가동률은 100%를 유지하였습니다. (1) 생산실적 (2) 가동률 ※ 가동률은 각 지역별 FAB별 가동인원 및 수율을 고려하여 계산함 3. 생산설비의 현황당사의 시설 및 설비의 장부가액은 작성기준일 현재 77,502,704백만원이며, 상세 내역은 다음과 같습니다. 4. 투자계획(현황) 2025년 연간 누적 당사의 투자집행 현황은 다음과 같습니다. [제78기 누계] (단위: 백만원) 사업부문 매입유형 품목","segment_finance":"(1) 사업부문별 연결재무정보당사는 반도체 제조업 부문의 매출액과 자산 총액이 전체 부문의 90%를 초과하여 지배적 단일 사업부문으로써 부문별 기재를 생략합니다. (2) 지역별 재무 정보 (법인소재지 기준) 다. 대손충당금 설정현황 (1) 계정과목별 대손충당금 설정내역 (2) 대손충당금 변동현황 (3) 매출채권 관련 대손충당금 설정방침 (4) 당 보고기간말 현재 경과기간별 매출채권잔액 현황 라. 재고자산 현황 등 (1) 재고자산의 사업부문별 보유현황 (2) 재고자산의 실사내역","rd":"나. 연구개발활동 1. 연구개발 담당조직당사는 보고서 제출일 현재 선행기술연구소 및 기반기술연구소, Solution개발연구소 등에서 연구개발 활동에 주력하고 있습니다. 2. 연구개발비용 다. 연구개발 실적 계약 상대방 항목 내용 비고 Rambus Inc. 계약 유형 특허 크로스 라이선스 계약 - 계약 기간 2013년 7월 1일~2034년 6월 30일 목적 및 내용","raw_moves":[],"utilization":[{"name":"평균가동률","rate":100}],"rd_chart":{"years":["제76기","제77기","제78기"],"costs":[4188404,4954447,6732527],"expense":[3837907,4536723,6465637],"rat 전 또는 사후 정산(환급)이 이루어집니다. 이러한 계약조건으로 인해 가격 변동과 같은 원재료 매입과 관련한 위험은 제한적입니다. 한편, 당사는 원재료 공급처와 장기 공급계약을 체결하여 안정적인 원재료를 공급받고 있으며, 가격 인상과 관련하여 매년 물가 상승률 수준의 인상률을 적용하는등의 계약조건으로 인해 가격 변동과 관련한 위험은 제한적입니다. 다.","capacity":"다. 생산능력, 생산실적, 가동률 당사 CDMO사업은 원제(Drug Substance) 생산 공장별 정기점검(Slowdown)기간 및 제품 교체(Product Changeover)기간을 고려하여 생산 가능시간을 산정하고, 이를 주요 생산설비의 실제 가동/정지시간으로 구분하여 가동률을 산출합니다. 라. 생산설비에 관한 사항 (1) 생산설비의 현황 등 ① 주요 사업장 현황 ② 주요 생산설비 현황 ※ 주요 유형자산에 대한 객관적인 시가판단이 불가능하여 기재를 생략하였습니다.※ 상기 생산설비 현황은 한국채택국제회계기준에 따라 연결기준으로 작성되었습니다.※ 연결회사는 2025년 11월 1일을 기일로 삼성바이오에피스㈜를 포함한 자회사 등을 인적분할하였습니다. (2) 투자현황 ※ 당사는 '22년 7월 매입한 제2바이오캠퍼스 부지에 첫번째 생산시설인 5공장 및 부대시설 건설(2.01조원)을 '25년 4월 완료하여 생산에 착수하였습니다. (단위 : 억원) 사업부문 매입유형 품 목 매입액","segment_finance":"[사업부문별 요약 재무현황] 2025년 매출액은 4조 5,570억 원이며, 영업이익은 2조 692억 원입니다.각 부문별 주요 손익, 재무정보 및 비중은 아래의 표와 같습니다. 주1) 연결회사는 2025년 11월 1일을 기일로 삼성바이오에피스㈜를 포함한 자회사 등을 인적분할하였습니다. 손익 재무정보는 계속영업기준으로 재작성되었습니다. (단위 : 백만원) 부 문 구 분 2025년도(제15기) 2024년도(제14기) 2023년도(제13기) 금액","rd":"(2) 연구개발 인력 현황 삼성바이오로직스는 공시서류 작성기준일 기준 박사급 109명, 석사급 266명 등 연구전담 인력 총 609명을 보유하고 있으며, 그 현황은 다음과 같습니다. (3) 핵심 연구인력 삼성바이오로직스의 핵심 연구인력의 담당업무, 주요 경력 및 연구실적 현황은 아래와 같습니다. 사. 연구개발비용(연결기준) ※ 상기 비율은 연결기준 연구개발비 및 매출액으로 산출하였습니다.※ 당사는 정부보조금 해당 사항 없습니다. 아. 연구개발 실적(1) 연구개발 진행현황 및 향후계획 당사는 의약품 위탁생산ㆍ개발 서비스(CDMO)를 제공하는 회사로서, 연구개발 담당조직으로 MSAT담당, CDO개발센터, 바이오연구소가 있습니다. 해당 조직은 고객사 제품의 생산 관련 기술지원, 세포주 제작, 공정 연구/개발을 담당하고 있습니다. (2) 연구개발 완료실적 당사는 다수의 고객사 제품에 대한 생산 관련 기술지원 및 세포주 공정 연구/개발을 수행하나, 이와 별개로 현재 개발이 완료된 파이프라인은 없습니다 . (단위: 백만 달러) 품목 계약상대방 계약목적, 조건 등상세내용 계약체결일 계약종료일 계약금액 수수(지급)방법 진행경과 등 비고 바이오의약품 Sun Pharma Global FZE","raw_moves":[],"utilization":[],"rd_chart":{"years":["제76기","제77기","제78기"],"costs":[1358,1416,1674],"expense":[],"ratios":[4.6,4.1,3.7],"revenue":[2024,2025,1]}},"business_cards":[{"title":"CDMO","caption":"위탁개발·생산 계약과 공장 가동률을 봅니다.","kind":"bio","visual":"CDMO","image":"https://images.unsplash.com/photo-1576086213369-97a306d36557?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":nul 급 이후 장기유지보수 서비스 업무도 영위하고 있습니다.","raw_material":"3. 원재료 및 생산설비 가. 주요 원재료 등의 현황 나. 주요 원재료 등의 가격변동추이【두산에너빌리티, 두산밥캣 부문】 【두산에너빌리티, 두산밥캣 부문】(1) 산출기준 (주1) 상기 재료의 단순평균 구입가격 혹은 공시가격 인상률을 반영한 조정가격 기준으로 산출합니다.(주2) 미국 기준이며, 원재료 별 대표 부품 품목에 대한 가격입니다. 부품별 대표매입처 구매계약가격 기준으로 산출하였습니다. 다음은 주요 원재료 별 대표 부품 품목입니다. - Hydraulics & Powertrain : Motor Drive - Steel & Weldment : Flat Coil 0.5000\" NOM/60.0\"/MS254 - Petrochemical : Track Rubber 450x60 (2) 주요 가격변동원인 2025년에는 미국 트럼프 대통령 취임 후 관세정책과 AI수요 증가에 따라 희소금속은 강세를 보였으나 전통 철강산업(조선,건설 등)은 전년에 이어 경기둔화 국면이 지속되며 약세를 보였습니다. - 철판 : 전년에 이어 전방산업 수요둔화 지속에 따른 철강 수요 감소로 약세를 보였 습니다.","capacity":"다. 생산능력, 생산실적 및 가동률(1) 생산능력 [생산능력의 산출근거] 별도의 산출방법이 기재되어 있지 않은 경우, 당기 생산능력이 연중 일정하다고가정하고 연간생산능력을 경과한 사업기간에 비례하여 산출하였습니다. 1) 원자로, 증기발생기 ① 기준용량 : 1,400MW/호기(경수로형) ② 연간생산능력: 1,400MW/호기(경수로기준) x 5호기 = 7,000MW 2) 보일러 ※ BLR(보일러) 국내 사업은 당사 사업 포트폴리오 전환에 따른 인력전환배치, 공정외주화의 사유로 제 62기부터 미반영 3) 스팀터빈 ① 기준용량 : 1,000MW/호기(화력표준형) ② 국내 연간생산능력: 화력발전용 1,000MW/호기 x 6호기= 6,000MW (TBN Rotor Slotting 정삭가공 공정 기준으로 산정) 4) 가스터빈 ① 기준용량 : 380MW/호기 ② 연간생산능력 : 380MW/호기 x 8호기 = 3,040MW(조립 Stand 기준) 5) 발전기 ① 기준용량 : 1,000MW/호기(화력표준형) ② 연간생산능력 : 화력발전용 1,000MW/호기 x 9호기= 9,000MW (TBN Rotor Slotting 정삭가공 공정 기준으로 산정) 6) BOP - 각 제품별로 용량이 상이하여 산출이 어려우나, 당사 가스터빈, 스팀터빈 생산능력을 고려하여 산출 (3,500MW/연) 7) 풍력 - 기준용량 : 10MW/기 (당사 대표 해상풍력 모델 - DS205) - 연간생산능력 : 10MW x 22기 = 220MW 8) 담수/수처리설비 - 담수/수처리설비는 기술에 따른 제품의 성격이 각각 상이하며, 제품(업종)별로 단위 설비의 용량 및 생산능력이 큰 차이를 보이고 있어 각 기술별 생산능력을 일률적으로 계량화하기가 곤란하나 담수플랜트 대표적인 설비인 MSF 증발기와 RO Rack, Pipe 기준으로 Doosan Enerbility Vietnam Co., Ltd.에서 생산 가능한 호기/중량으로 산출함.('13년 이후 Water Shop 해외 이전에 따라 Doosan Enerbility Vietnam Co., Ltd.에서만 생산) - 담수설비 (MSF) ① 기준용량 : 20 MIGD/호기 ② 연간생산능력 : 20 MIGD x 6호기 = 120 MIGD (MSF 담수플랜트) - 담수설비 (RO Rack, Pipe) ① 연간생산능력 : 10,000톤 = 300 MIGD (RO 담수플랜트) 9) 운반설비 - 연간 RMQC-6기, RTGC-30기 기준 - 운반설비는 RMQC, RTGC의 연간 생산능력임 10) 주단조품 ① 주조품 : 연간 최대 조형생산중량(톤) ② 단조품/특수강 : 연간 최대 단조프레스 생산중량(톤) 11) 건설부문 - 두산에너빌리티 건설부문은 2025년 대한건설협회 토건업종 시공능력평가액 및 순위를 적용하였습니다. 괄호( )는 시공능력 순위임. auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null},{"title":"IB","caption":"인수금융, IPO, 구조화금융 수수료를 봅니다.","kind":"finance","visual":"IB","imageKey":"tradingDesk","image":"https://images.unsplash.com/photo-1640340434855-6084b1f4901c?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null},{"title":"자산관리","caption":"고객 예탁자산과 랩·펀드 잔고가 반복 수익을 만듭니다.","kind":"finance","visual":"WM","imageKey":"holdingPortfolio","image":"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null}]},{"rank":21,"name":"현대모비스","stock_code":"012330","corp_code":"00164788","sector":"자동차","display_category":"자동차부품","badge_label":"부품","market_cap":null,"dart_url":"https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260309001878","latest_year":{"year":2025,"revenue":611181,"operating_income":33575,"net_income":36647,"operating_cashflow":44725,"investing_cashflow":-32337,"financing_cashflow":-12047,"total_assets":704005,"total_equity":492128},"history":{"years":[2021,2022,2023,2024,2025],"revenue":[417022,519063,592544,572370,611181],"operating_income":[20401,20265,22953,30735,33575],"net_income":[23625,24872,34233,40602,36647],"operating_cashflow":[26088,21541,53426,42527,44725]},"report":{"name":"사업보고서 (2025.12)","date":"20260309","rcept_no":"20260309001878"},"snippets":{"overview":"1. 사업의 개요 연결회사는 자동차 모듈 및 부품제조사업과 A/S용 부품사업을 영위하고 있으며, 국내외 생산거점 30곳, 물류거점 41곳, 연구소 8곳 등을 운영하고 있습니다.자동차 3대 핵심모듈인 샤시모듈, 칵핏모듈, 프론트엔드모듈(이하 \"FEM\")을 조립ㆍ생산하여 현대자동차와 기아 등에 직서열(JIS, Just In Sequence) 공급하고 있으며, 제동ㆍ조향ㆍ에어백ㆍ램프 및 전장ㆍ전동화 부품 등 다양한 자동차 부품을 생산하여 현대자동차와 기아 및 글로벌 완성차 업체에 공급하고 있습니다. 연구개발 초기 단계부터 완성차 업체와 협력하며 자동차 특성에 맞춘 모듈을 개발, 생산하고 있으며, 첨단화 및 시스템 통합화를 통해 생산공정 간소화와 조립 편의성 증대 등 모듈화 효과를 바탕으로 글로벌 경쟁력을 강화하고 있습니다.또한 연결회사는 국내외에서 운행 중인 현대자동차ㆍ기아에 소요되는 보수용 부품의공급을 책임지고 있는 A/S용 부품사업을 영위하고 있습니다.","raw_material":"3. 원재료 및 생산설비 가. 주요 원재료에 관한 사항 현재 연결회사에서 사용하는 주요 원재료에는 제조공장에서 사용되는 강재류와 석유화학제품류가 있습니다. 강재류는 강판, 특수강등이 있으며 공급사는 POSCO, 현대제철입니다. 석유화학제품류에는 PP, PC 수지 등이 있으며, 주요 거래처로는 현대EP, GS칼텍스, 삼양사 등이 있습니다. 2025년 원유는 OPEC+ 감산 완화 및 수요 둔화에 따른 재고 증가로 하락하였으며, 원료 하락에 따라 석유화학 원자재도 전반적인 약세를 보였습니다. 강재류는 자동차, 가전 등 전방 산업 소비 둔화로 소폭 약세였으며 비철금속의 경우, 구리/알루미늄은 AI, 건설 산업 등 수요 확대로 강한 상승세, 니켈/아연은 공급 과잉에 따른 약세를 보였습니다. 2026년 1분기 원유는 공급 과잉 지속에 따른 약세가 예상되며, 석유화학은 낮은 원료비와 점진적 수요 회복이 맞물려 가격안정 또는 완만한 반등이 전망됩니다. 강재 시장은 원재료 비용 상승과 수요 불확실성이 맞물려 보합세를 유지할 것으로 예상됩니다. 알루미늄/구리는 공급 차질 및 수요 강세로 현강세 기조가 유지될 것으로 전망되며, 니켈/아연은 공급 과잉 대비 수요 회복이 완만하여 약세가 예상됩니다.","capacity":"나. 생산능력 및 생산능력의 산출근거연결회사는 국내 모듈공장 기준으로 2교대로 작업을 실시하고 있으며 2025년 라인별 작업일수와 1일 작업시간을 기준으로 \"라인별 UPH X 1일 작업시간 X 작업일수\"의 방법으로 생산능력을 산출하였습니다. 2025년 국내 생산능력은 생산금액을 기준으로 총 29,529,626백만원 이며, 해외 생산능력은 총 43,997,345백만원 입니다.라인별 UPH(Unit Per Hour)는 해당 라인에서의 시간당 생산수량 기준이며, 작업시간은 국내 및 해외의 생산기준을 반영하여 1일 작업시간을 적용하였습니다. 또한 작업일수는 라인별 당기 총 작업시간을 1일 작업시간으로 나누어 역산하였습니다. 다. 생산실적 및 가동률연결회사의 2025년 국내 생산실적은 26,253,460백만원으로 2024년 대비 803,101백만원 (3.0%) 감소 하였으며, 해외 생산실적은 26,918,356백만원으로 2024년 대비 4,279,875백만원(18.9%) 증가 하였습니다. 국내 생산실적 감소는 전동화 배터리셀 사급 전환 전차종 확대 적용에 따른 매출 인식 변경 영향 및 전기차 수요 감소에 따른 전동화 부품 판매 감소 영향 등이며, 해외 생산실적 증가는 미주지역 생산 물량 증가와 신설법인 양산 영향이 주요 내용입니다. 국내 평균 가동률은 88.9%(생산실적 26,253,460백만원, 생산능력 29,529,626백만원) 로 집계되었으며, 해외 평균 가동률은 61.","segment_finance":"바. 사업부문별 요약 재무현황 (1) 제 49기 (2025년) (2) 제 48기 (2024년) (3) 제 47기 (2023년) 사. 사업부문별 현황 (1) 모듈 및 부품제조사업연결회사는 자동차 3대 핵심모듈인 샤시모듈, 칵핏모듈 및 FEM을 생산하여 현대자동차ㆍ기아 등 글로벌 완성차업체에 직서열(JIS, Just In Sequence: 필요한 부품을 필요한 형태와 순서로 필요한 시간에 완성차업체에 조달) 방식으로 공급하고 있습니다. 자동차 개발 초기 단계부터 공동참여를 통해 핵심 모듈 및 부품별 특성을 고려한 설계, 시험, 해석, 평가 등 연구개발(R&D) 중이며, 3대 핵심모듈의 첨단화 및 시스템 통합화를 통하여 생산공정 간소화, 조립의 편의성 증대 및 조립시간 단축, 중량 및 부품수 감소, 비용 절감, 품질 및 재고 관리의 효율의 증대 등 모듈화 효과를 통한 글로벌 경쟁력 강화를 위하여 노력하고 있습니다.그리고 연결회사는 글로벌 종합 자동차부품업체로서 편리성과 주행성능은 물론, 도로 안전과 환경을 고려한 자동차 핵심부품을 개발 및 생산하고 있습니다.","rd":"주요 유형자산의 시가는 객관적인 판단이 어려워 기재를 생략합니다. 연결회사는 2025년말 현재 차입금과 관련하여 유형자산 중 일부(장부금액 102,906백만원)를 (주)하나은행 등에 담보로 제공하고 있습니다. 마. 주요 투자현황 (2025년)(1) 진행중인 투자 상기 투자금액은 시설/설비투자에 한정한 투자금액으로 연구개 rt":{"name":"사업보고서 (2025.12)","date":"20260312","rcept_no":"20260312001230"},"snippets":{"overview":"1. 사업의 개요 한미반도체는 1980년 설립후 반도체 제조용 장비를 개발 및 출시해 왔으며, 자체 기술을 적용하여 주물, 설계, 제작, 조립, 검사와 테스트까지의 수직통합제조(Vertical Integration Manufacture) 시스템을 구축하여 글로벌 주요 AI 반도체 기업에 최첨단 장비를 공급해 오고 있습니다. 당사의 주력 장비 'HBM TC(Thermal Compression) 본더'는 메모리칩에 정밀한 열과 압력을 가해 12단, 16단과 같은 고적층 HBM을 생산하는 핵심 장비입니다. AI 서버와 데이터센터 투자 확대에 따라 고대역폭 메모리(HBM) 수요가 급증하고 있으며 메모리 칩의 적층도가 고단화 될수록 TC 본더의 중요성은 더욱 커지고 있습니다. 최근 메모리 업계는 하이브리드 본더가 기술적 난제로 개발이 지연됨에 따라 20단 이상의 HBM 적층 시 보다 넓은 HBM칩을 적층할 수 있는 신장비의 필요성이 부각되고 있습니다.","raw_material":"3. 원재료 및 생산설비 1) 주요 원재료 등의 현황 2) 주요 원재료 등의 가격변동추이 - 반도체 장비용 원재료는 당사의 요구조건 및 옵션에 따라 상이한 가격으로 매입되므로 가격변동 추이를 제시하기 곤란합니다. 3) 생산능력/실적/가동률 - 반도체 장비부문의 생산방식은 주문형 생산시스템이며 1개의 모델(장비)일지라도 고객사의 요구에 따라 사양 및 기능의 변형과 추가, 제외 등이 가능합니다. 이 때문에 생산능력/가동률 등을 일률적으로 산출하는 것이 큰 의미가 없어 반도체 장비의 생산 능력 및 실적 관련 정보 기재를 생략합니다. 4) 생산설비의 현황 등 (*) 당기 중 건설중인자산과 재고자산으로부터의 대체 금액 등이 포함되어 있습니다. 5) 시설투자현황 해당 투자는 한미반도체 7공장 설립을 위한 것으로 이를 통해 차세대 프리미엄 HBM생산에 대응할 계획입니다.","capacity":"3) 생산능력/실적/가동률 - 반도체 장비부문의 생산방식은 주문형 생산시스템이며 1개의 모델(장비)일지라도 고객사의 요구에 따라 사양 및 기능의 변형과 추가, 제외 등이 가능합니다. 이 때문에 생산능력/가동률 등을 일률적으로 산출하는 것이 큰 의미가 없어 반도체 장비의 생산 능력 및 실적 관련 정보 기재를 생략합니다. 4) 생산설비의 현황 등 (*) 당기 중 건설중인자산과 재고자산으로부터의 대체 금액 등이 포함되어 있습니다. 5) 시설투자현황 해당 투자는 한미반도체 7공장 설립을 위한 것으로 이를 통해 차세대 프리미엄 HBM생산에 대응할 계획입니다. -투자대상: 한미반도체 7공장 -투자금액: 57,824,000,000원 -투자목적: 차세대 프리미엄 HBM 생산에 대응하기 위한 최신식 하이브리드 본더 전용 공장 건축 -투자기간: 2026년 11월 30일까지(향후 기업여건에 따라 조정 가능) ※ 관련 세부 내용은 2024년 7월 23일 유형자산취득결정(자율공시)과 2025년 6월 20일 신규시설투자등(자율공시) 공시문을 확인해주시기 바랍니다. (2025년 누계) (단위 : 백만원,%) 사업부문 매입유형 품 목 구체적용도 매입액 비율(%)","segment_finance":"연결실체의 영업부문은 단일의 영업부문을 가지고 있으며, 경영진에게 보고되는 지역부문별 매출에 한하여 공시하고 있습니다. 경영진은 영업부문에 배부될 자원과 영업부문의 성과를 평가하는데 책임이 있습니다.연결실체는 시장 및 판매방법의 특징 등을 고려하여 지역별로 적절히 관리하기 위하여 부문수익을 지역부문별 매출로 분류하고 있으며, 단일 영업부문이므로 부문자산과 부문부채는 별도로 분류하고 있지 않습니다. 지역에 대한 공시 당기 (단위 : 천원) 아시아 남아메리카 북아메리카 유럽","rd":"1-1) 경영상의 주요계약 등 - 해당사항 없음 ※ 반도체 장비 사업과 관련하여 당사는 본점인 인천시 서구 가좌동에 부설연구소를 설립하여 우수 연 사 인수를 통한 수익구조 다변화에 힘입어 2년 연속 당기순이익 3조원대를 시현했습니다. 자산리밸런싱 및 조달비용 효율화 노력을 지속하는 한편, 종합금융그룹 완성에 따른 균형잡힌 사업 포트폴리오에서 창출한 수수료 수익과 유가증권·외환·보험 관련 손익이 고르게 성장하며 대내외 불확실성에도 이자, 비이자이익의 균형잡힌 수익 창출 능력을 보여주었습니다.","raw_material":null,"capacity":"연결회사는 신용위험을 측정하기 위해 고객 또는 계약 의무상 거래상대방의 의무불이행 가능성, 거래상대방에 대한 익스포져와 인과관계에 의한 부도 익스포져, 부도시손실률 등을 고려하고 있습니다. 거래상대방의 채무불이행 가능성을 평가하기 위해 신용등급평가모형을 사용하고 있으며, 신용등급의 평가에는 재무제표 등을 활용한 계량적 방법과 평가자의 판단 외에도 통계적인 신용평점 등을 산출하는 방법이 활용되고 있습니다.연결회사는 미래경기전망 계수를 부도율 및 부도시손실률 추정치에 반영하고 있으며, 대내외 경제 불확실성의 증가로 인한 잠재부실화 가능성 등을 고려하여 미래경기전망 계수를 조정하여 기대신용손실충당금을 추가로 인식하고 있습니다.연결회사는 과거 경험손실률 데이터를 바탕으로 미래경기전망정보를 추가로 반영한 추정모형을 이용하여 손실충당금을 산출합니다.차주유형, 신용등급, 포트폴리오 등의 요소를 고려하여 각 금융자산별로 추정한 PD(부도율), LGD(부도시손실률)를 적용하여 산출하며, 추정치는 실제손실과의 차이를 줄이기 위해 정기적인 검토가 이루어지고 있습니다.연결회사는 미래경제적 상황을 예측하기 위하여 국내총생산(실질, 원계열) 성장률, 제조업 평균가동률, 아파트매매가격지수(KB, 서울), 실업률(원계열) 등 합리적으로 뒷받침될 수 있는 거시경제변수를 이용하여 기대신용손실을 측정하고 있습니다.연결회사는 다음과 같이 미래경제적 상황 예측모형을 적용하고 있으며, 그 결과를 정기적으로 검토합니다.- 모델링 결과 생성된 모형에 다양한 방법(1.","segment_finance":null,"rd":null,"raw_moves":[],"utilization":[],"rd_chart":{"years":[],"costs":[],"expense":[],"ratios":[],"revenue":[1,2021.12,2025.12]}},"business_cards":[{"title":"우리은행","caption":"원화대출과 예대마진이 핵심 수익원입니다.","kind":"finance","visual":"BANK","imageKey":"bankBranch","image":"https://commons.wikimedia.org/wiki/Special:FilePath/London.bankofengland.arp.jpg?width=640","image_source":"Wikimedia Commons","image_fallback":null},{"title":"우리카드","caption":"소비 결제와 카드 금융 흐름을 봅니다.","kind":"card","visual":"CARD","imageKey":"cardPayment","image":"https://commons.wikimedia.org/wiki/Special:FilePath/Credit-cards.jpg?width=640","image_source":"Wikimedia Commons","image_fallback":null},{"title":"우리투자증권","caption":"증권 중개와 투자금융 회복 여부를 봅니다.","kind":"finance","visual":"증권","imageKey":"tradingDesk","image":"https://images.unsplash.com/photo-1611974789855-9c2a0a7236a3?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null},{"title":"우리캐피탈","caption":"자동차금융·리스·할부 중심 소비자 금융","kind":"fina 업수익을 더한 금액임 3) 제74기 註1) 매출액은 연결포괄손익계산서의 보험영업수익과 투자영업수익을 더한 금액임註2) 2023년 1월 1일을 최초적용일로 하여 기업회계기준서 제1117호 및 제1109호를 적용 하였음 [국내사업] 가. 산업의 특성 손해보험은 우연한 사고로 인하여 발생한 재산, 신체 손해를 실제 손해액만큼 보상하는 산업입니다. 손해보험사는 각종 산업 및 개인에게 발생할 수 있는 모든 리스크를 보장하는 것을 목표로 다양한 상품을 개발하여 판매하고 있으며, 판매하는 보험상품은 크게 일반보험, 자동차보험, 장기손해보험, 개인연금, 퇴직연금으로 구분할 수 있습니다. 일반보험은 화재, 해상, 기술, 배상책임, 상해, 질병 등 기업 경영, 개인 재산 및 신체에 관련된 리스크를 보장하는 상품이며, 자동차보험은 자동차로 인하여 발생하는 타인의 신체 및 차량, 자신의 신체 및 차량에 대한 손해 등을 보장하는 상품입니다.","rd":null,"raw_moves":[],"utilization":[],"rd_chart":{"years":[],"costs":[],"expense":[],"ratios":[],"revenue":[3,1,3]}},"business_cards":[{"title":"자동차보험","caption":"손해율과 보험료 조정이 이익률을 흔듭니다.","kind":"auto","visual":"AUTO","imageKey":"carLine","image":"https://images.unsplash.com/photo-1503376780353-7e6692767b70?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null},{"title":"장기보험","caption":"보장성 장기계약과 CSM 흐름을 봅니다.","kind":"shield","visual":"LONG","imageKey":"insuranceShield","image":"https://upload.wikimedia.org/wikipedia/commons/thumb/d/d8/Insurance_contract.jpg/960px-Insurance_contract.jpg","image_source":"Wikimedia Commons","image_fallback":null},{"title":"일반보험","caption":"기업성 보험과 재보험 비용을 확인합니다.","kind":"shield","visual":"P&C","imageKey":"insuranceShield","image":"https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null}]},{"rank":38,"name":"두산","stock_code":"000150","corp_code":"00117212","sector":"지주/복합기업","display_category":"지주·전자소재","badge_label":"지주","market_cap":null,"dart_url":"https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260323000945","latest_year":{"year":2025,"revenue":197841,"operating_income":10627,"net_income":2495,"operating_cashflow":9819,"investing_cashflow":-4304,"financing_cashflow":7000,"total_assets":329278,"total_equity":122343},"history":{"years":[2021,2022,2023,2024,2025],"revenue":[132042,169958,191301,181329,197841],"operating_income":[9459,11260,14363,10038,10627],"net_income":[6567,-5812,2721,3022,2495],"operating_cashflow":[7432,5332,19087,3078,9819]},"report":{"name":"사업보고서 (2025.12)","date":"20260323","rcept_no":"20260323000945"},"snippets":{"overview":"1. 사업의 개요 당사는 두산에너빌리티㈜, 두산밥캣㈜, 두산퓨얼셀㈜, 두산로보틱스㈜ 등 총 23개 계열회사를 실질적으로 지배함과 동시에 자체 사업으로서 전자소재 사업 (전자BG), 통합IT 서비스 사업 (두산디지털 이노베이션BU) 등을 영위하고 있습니다. K-IFRS에 따른 당사의 주요 자회사가 영위하는 사업으로는 발전플랜트 EPC (Engineering, Procurement, Construction), 주요 발전 기자재 설계 및 제작과 서비스 사업(두산에너빌리티㈜), 소형 건설기계, Portable Power 장비 생산 및 판매(두산밥캣㈜), 발전용 연료전지 기자재 공급 및 장기유지보수 서비스(두산퓨얼셀㈜), 시스템반도체 테스트(㈜두산테스나), 광고대행 및 매거진 출판업 (㈜오리콤), 협동로봇 제조 및 솔루션 제공(두산로보틱스㈜) 등이 있습니다.㈜두산의 주요 자체사업에 대한 세부내용은 아래와 같습니다.","raw_material":"3. 원재료 및 생산설비 가. 주요 원재료 등의 현황 【㈜두산 전자BG】 - 동박 : Circuit Foil, Cotech, Mitsui 금속 등 국내외 다양한 업체로 부터의 매입을 통해 공급의 안정성을 확보하고 있습니다.- G/F : Nitto Boseki, Taiwan Glass Industry, Ashai Kasei 등 다양한 업체로부터의 매입을 통해 공급의 안정성을 확보하고 있습니다. - 에폭시 레진 : 국도화학, 코오롱인더스트리, 일본화약 등 국내외 다양한 업체로 부터의 매입을 통해 공급의 안정성을 확보하고 있습니다.- 기타(Film, Chemical 등) : Kaneka, 파미셀, 어드마텍스 등 국내외 다양한 업체로부터의 매입을 통해 공급의 안정성을 확보하고 있습니다. - 상기 기재된 매입처는 모두 비계열사입니다. 【㈜두산 디지털이노베이션BU】 IT 시스템 개발/운영에 필요한 인력 그리고 각종 S/W, 서버 및 네트워크 장비 등은 고객사의 요구 정도에 따라 다양하게 제공되므로 해당 인력/제품 원재료 등의 매입처를 특정하기 어렵습니다. 【두산퓨얼셀㈜】 두산퓨얼셀㈜이 매입하는 원재료는 크게 MBOP, EBOP 및 셀스택류로 구분됩니다.","capacity":"다. 생산능력, 생산실적 및 가동률 (1) 생산능력 생산능력의 산출근거 【㈜두산 전자BG】 생산능력은 주요 설비가 월 25일 가동하는 것으로 환산하여 산출하였으며, 실제 가동일수는 월별 상이합니다. - 증평/김천 공장 : Press, 익산공장 : Lami, Coater, 중국공장 : Lami, Press 【두산에너빌리티㈜】 별도의 산출방법이 기재되어 있지 않은 경우, 당기 생산능력이 연중 일정하다고가정하고 연간생산능력을 경과한 사업기간에 비례하여 산출하였습니다. 1) 원자로, 증기발생기 ① 기준용량 : 1,400MW/호기(경수로형) ② 연간생산능력: 1,400MW/호기(경수로기준) x 5호기 = 7,000MW 2) 보일러 ※ BLR(보일러) 국내 사업은 당사 사업 포트폴리오 전환에 따른 인력전환배치, 공정외주화의 사유로 2024년부터 미반영 3) 스팀터빈 ① 기준용량 : 1,000MW/호기(화력표준형) ② 국내 연간생산능력: 화력발전용 1,000MW/호기 x 6호기= 6,000MW (TBN Rotor Slotting 정삭가공 공정 기준으로 산정) 4) 가스터빈 ① 기준용량 : 380MW/호기 ② 연간생산능력 : 380MW/호기 x 8호기 = 3,040MW(조립 Stand 기준) 5) 발전기 ① 기준용량 : 1,000MW/호기(화력표준형) ② 연간생산능력 : 화력발전용 1,000MW/호기 x 9호기= 9,000MW (TBN Rotor Slotting 정삭가공 공정 기준으로 산정) 6)  소수 정유사들의 과점시장임.5) 공급의 안정성 : 당사는 전세계 선박용 연료유 시장에서의 Spot 거래를 통한 물량 확보 뿐만 아니라, 주요 공급사들과 장기 공급계약을 체결하여 공급의 안정성을 확보하고 있음. 나. 생산설비의 현황 등 1) 생산능력 및 실적 * 벌크부문(CBM)의 생산능력 단위는 MT / 생산실적 단위는 CBM임.※ 벌크부문 대선물량 및 LOG 선적은 제외함.","capacity":"가동률 생산능력 생산실적 가동률 생산능력 생산실적 가동률 컨테이너부문(TEU) 용역 - 5,851,411","segment_finance":null,"rd":"당기말 현재 회사가 체결하고 있는 장기해상운송계약 내역은 다음과 같습니다. 다. 연구개발활동의 개요 1) 연구개발 담당조직 (1) 컨테이너사업본부 - 컨테이너선대기획팀 - 컨테이너항로기획팀 - 물류신사업개발팀 - 컨테이너수익관리팀 - 컨테이너EQ팀 (2) 벌크사업본부 - 벌크전략개발팀, 친환경에너지수송팀 (3) 해사실 - R&D팀 (4) 전략재무본부 - 재무팀, 투자기획팀, 구매기획팀 (5) 연구개발 운용 현황 회사는 해운업의 특성에 맞도록 선박의 건조, 운항, 관리의 효율성 제고를 위하여 실무를 겸한 연구개발 활동을 각 부문별특성에 맞추어 연구개발 성격을 갖춘 팀을 운영하고 있습니다. 2) 연구개발비용 연구활동에 대한 지출은 발생한 기간에 비용으로 인식하고 있습니다. 개발활동(또는 내부프로젝트의 개발단계)과 관련된 지출은 해당 개발계획의 결과가 새로운 제품의 개발이나 실질적 기능 향상을 위한 것이며 연결실체가 그 개발계획의 기술적, 상업적 달성가능성이 높고 소요되는 자원을 신뢰성있게 측정가능한 경우에만 무형자산으로 인식하고 있습니다.","raw_moves":[],"utilization":[],"rd_chart":{"years":[],"costs":[],"expense":[],"ratios":[],"revenue":[1,1,2025]}},"business_cards":[{"title":"컨테이너선","caption":"컨테이너 운임과 물동량이 매출을 좌우합니다.","kind":"ship","visual":"BOX","imageKey":"logisticsShip","image":"https://images.unsplash.com/photo-1578575437130-527eed3abbec?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null},{"title":"벌크선","caption":"원자재 운송 수요와 벌크 운임 시황에 영향을 받습니다.","kind":"ship","visual":"BULK","imageKey":"shipyard","image":"https://images.unsplash.com/photo-1494412519320-aa613dfb7738?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null},{"title":"터미널·물류","caption":"항만·물류 네트워크가 서비스 경쟁력을 만듭니다.","kind":"platform","visual":"PORT","imageKey":"logisticsShip","image":"https://images.unsplash.com/photo-1575550485446-d4cdea682787?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null}]},{"rank":43,"name":"SK텔레콤","stock_code":"017670","corp_code":"00159023","sector":"통신/유틸리티/운송/기타","display_category":"통신서비스","badge_label":"통신","market_cap":null,"dart_url":"https://dart.fss.or.kr/dsaf001/main.do?rcpNo=20260318000532","latest_year":{"year":2025,"revenue":170992,"operating_income":10732,"net_income":3751,"operating_cashflow":39238,"investing_cashflow":-17371,"financing_cashflow":-27118,"total_assets":301078,"total_equity":129553},"history":{"years":[2021,2022,2023,2024,2025],"revenue":[167486,173050,176085,179406,170992],"operating_income":[13872,16121,17532,18234,10732],"net_income":[24190,9478,11459,13871,3751],"operating_cashflow":[50313,51593,49472,50873,39238]},"report":{"name":"사업보고서 (2025.12)","date":"20260318","rcept_no":"20260318000532"},"snippets":{"overview":"1. 사업의 개요 연결실체의 각 부문은 독립된 서비스 및 상품을 제공하는 법률적 실체에 의해 구분되어 있으며 ① 이동전화, 무선데이터, 정보통신사업 등의 무선통신사업, ② 전화, 초고속인터넷, 데이터 및 통신망 임대서비스 등을 포함한 유선통신사업, ③ 상품판매형 데이터방송채널사용사업 등의 기타사업부문으로 구별되어 있습니다. [요약] 연결 대상 주요 종속회사 사업의 내용 가. 무선통신사업 무선통신 사업자들은 단말, 요금제, 네트워크, 콘텐츠 등의 본원적 경쟁력을 기반으로 무선통신 서비스를 제공하고 있습니다. 당사는 5G 시장에서 앞선 통신 기술력과 네트워크 운용 기술을 바탕으로 경쟁사가 결코 뛰어넘을 수 없는 프리미엄 네트워크 사업자로서의 명성을 이어가고 있습니다. 2019년 세계 최초 5G 상용화를 통해 5G 시대에도 변함없는 1위 사업자의 위상을 이어가고 있으며, 고객에게 차별화된 서비스를 제공하기 위해 노력하고 있습니다.","raw_material":"3. 원재료 및 생산설비 가. 생산능력 및 생산실적 (1) 생산능력1) 무선통신 사업 - 생산능력의 산출근거 ※ 산출방법 등 : 이동전화 매출액 × {시설(회선)보유능력/회선보유수량}※ 평균가동시간 : 연중 계속 가동 (2) 생산실적1) 무선통신 사업 ※ 회선보유수량 및 금액은 MVNO가입자수 포함입니다. 나. 생산과 영업에 중요한 물적 재산 (1) 주요 시설 및 설비의 현황1) 무선통신사업 ※ 상기 사업장은 SK텔레콤 주요 사업장 및 연결대상 주요 종속회사의 본사 사업장입니다. 2) 유선통신사업 (2) 주요 시설 및 설비의 변동 현황1) 무선통신사업당사의 생산과 영업에 관련한 물적 재산으로는 토지, 건물, 기계장치 등의 유형자산이 있으며 장부금액의 변동내역은 다음과 같습니다. (*1) 연결대상 종속기업인 에스케이스토아 주식회사와 미디어에스(주)의 지분을 매각하기로 결정함에 따라 에스케이스토아 주식회사와 미디어에스(주)의 관련 유형자산 13,512백만원을 매각예정자산으로 대체하였습니다.(*2) 동일지배하의 사업결합으로 인한 자산 증가로 구성되어 있습니다. 2) 유선통신사업","capacity":"기업사업은 수주 경쟁력 강화로 신규 고객이 증가하고, 이에 따른 기업회선 매출 상승과 데이터센터 규모 확대 및 가동률 증가에 따른 매출 성장 등으로 전년 대비 7.8% 증가한 1조 4,727억원을 달성하였습니다. 집전화 및 기타 매출은 전년 대비 6.6% 증가한 738억원을 기록하였습니다. 다. 신규사업 - 해당사항 없음 라. 공시대상 기간 중 발생한 중단사업 - 해당사항 없음 마. 조직개편 SK텔레콤은 2025년, '통신'과 'AI'를 두 축으로 전사 역량을 집중하고자 사업 조직을 7대 사업부로 재편하였습니다. 통신사업은 MNO, B 유선/미디어, Enterprise, AI 사업은 에이닷, GPAA, AIX, AI DC 사업부로 구성되어 있습니다. 2025년 9월, 전사 AI 역량을 결집한 AI CIC를 출범하고 전사적인 AI 대전환을 추진해 나가고 있습니다. AI뿐만 아니라 통신 사업 역시 CIC로 전환해 2026년부터는 양대 CIC 체계로 운영 중입니다. 바. 환율변동 영향 당사는 글로벌 영업으로 인한 수입과 지출로 인해 외화 환포지션이 발생하며, 환포지션이 발생하는 주요 외화로는 USD, EUR 등이 있습니다. 연결실체는 연결대상회사별로 사업의 성격 및 환율 변동위험 대처수단의 유무 등을 고려하여 회사별 환율변동위험 관리정책을 선택하고 있습니다. 또한, 연결실체는 외화로 표시된 채권과 채무관리 시스템을 통하여 환노출 위험을 주기적으로 평가, 관리 및 보고하고 있습니 다.","segment_finance":"외부 영업수익의 각 부문별 매출액에 대한 공시 당기 (단위 : 백만원) 부문 부문 합계 통신사업 기타부문","rd":"가. 경영상의 주요계약 등 당기말 현재 당사의 재무상태에 중요한 영향을 미치는 비경상적인 중요계약은 없습니다. 나. 연구개발 활동 (1) 연구개발 담당조직1) SK텔레콤연구개발 담당 조직은 SK AI R&D센터 산하의 미래R&D Lab, AI DC Lab, Open AIX Lab, Vision Lab, Media Lab, Digital Twin Lab, AI Model Lab 등으로 구성되어 있으며, Network Infra센터의 Infra기술본부에서도 해당 센터와 관련된 연구개발을 수행하고 있습니다.2) SK브로드밴드당사의 연구개발은 미디어Tech본부, Enterprise사업본부, Network센터 등에서 담당하고 있습니다. 연구개발의 기본방침은 기존 서비스의 품질 향상, 효율적인 관리 기술개발 및 신규 서비스 모델 발굴, 핵심 선행기술 연구를 통한 프로덕트 차별화 및 신기술 선행 검증시험, NGN(Next Generation Network)/BcN 망 진화 관련 기반 기술, IPTV 서비스의 품질 향상, 유무선통합 및 방송통신 융합기반 미디어 기술 등의 확보입니다.","raw_moves":[],"utilization":[],"rd_chart":{"years":["제76기","제77기","제78기"],"costs":[2.23,2.19,2.08],"expense":[],"ratios":[2.23,2.19,2.08],"revenue":[]}},"business_cards":[{"title":"이동통신","caption":"무선 가입자와 ARPU가 기본 수익원입니다.","kind":"signal","visual":"5G","image":"https://images.unsplash.com/photo-1517420704952-d9f39e95b43e?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null},{"title":"AI·데이터센터","caption":"AI 인프라와 클라우드 수요가 성장 축입니다.","kind":"platform","visual":"AI","image":"https://images.unsplash.com/photo-1558494949-ef010cbdcc31?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null},{"title":"구독·플랫폼","caption":"멤버십, 미디어, 커머스 서비스가 실적을 보탭니다.","kind":"platform","visual":"APP","image":"https://images.unsplash.com/photo-1551650975-87deedd944c3?auto=format&fit=crop&w=640&q=80","image_source":"Unsplash","image_fallback":null}]},{"rank":44,"name":"현대건설","stock_code":"000720","corp_code":"00164478","sector":"통신/유틸리티/운송/기타","display_category":"건설","badge_la     }
    function listRows() {
      const q = $('#searchInput').value.trim().toLowerCase();
      let rows = DATA.filter((r) => !q || String(r.name).toLowerCase().includes(q) || String(r.stock_code).includes(q));
      rows = rows.slice().sort((a,b) => {
        if (sortMode === "revenue") return (num(b.latest_year && b.latest_year.revenue) || -1) - (num(a.latest_year && a.latest_year.revenue) || -1);
        return (a.rank || 999) - (b.rank || 999);
      });
      $('#companyList').innerHTML = rows.map((r) => '<button class="company-btn ' + (r.stock_code === selected ? 'active' : '') + '" type="button" data-code="' + esc(r.stock_code) + '"><span class="rank">#' + esc(r.rank) + '</span><span><span class="cname">' + esc(r.name) + '</span><span class="cticker">' + esc(r.stock_code) + ' · ' + esc(r.display_category || r.sector || '업종 미분류') + '</span></span><span class="sector-pill">' + esc(r.badge_label || r.display_category || '사업') + '</span></button>').join("");
    }
    function render(row) {
      if (!row) return;
      const category = row.display_category || row.sector || '업종 미분류';
      const sector = row.sector || category;
      const reportLabel = row.report && row.report.name ? row.report.name : '최근 사업보고서';
      const dart = row.dart_url || (row.report && row.report.rcept_no ? 'https://dart.fss.or.kr/dsaf001/main.do?rcpNo=' + row.report.rcept_no : '#');
      $('#readerPanel').innerHTML =
        '<section class="company-hero">' +
          '<div class="orbit-lines"></div><div class="planet-ring"></div>' +
          '<div class="planet"><div><strong>' + esc(row.name) + '</strong><span>' + esc(row.stock_code) + '<br>' + esc(category) + '<br>' + esc(reportLabel.replace('사업보고서 ', '')) + '</span></div></div>' +
          '<div class="hero-grid cards-' + Math.min(4, Math.max(1, (row.business_cards || []).length)) + '">' + businessCardsHtml(row) + '</div>' +
        '</section>' +
        '<div class="content">' +
          reportMapHtml(row) +
          '<div class="source-row"><a class="source-link" href="' + esc(dart) + '" target="_blank" rel="noreferrer">DART 원문 열기</a><span class="mini-label">generated ' + esc(GENERATED_AT) + '</span></div>' +
          businessStatusPanelHtml(row) +
          innovationSectionHtml(row) +
        '</div>';
    }
    function selectByCode(code) {
      selected = code;
      listRows();
      render(DATA.find((r) => r.stock_code === code) || DATA[0]);
    }
    $('#searchInput').addEventListener('input', listRows);
    document.querySelectorAll('.sort-btn').forEach((btn) => btn.addEventListener('click', () => {
      sortMode = btn.dataset.sort;
      document.querySelectorAll('.sort-btn').forEach((b) => b.classList.toggle('active', b === btn));
      listRows();
    }));
    $('#companyList').addEventListener('click', (event) => {
      const btn = event.target.closest('.company-btn');
      if (btn) selectByCode(btn.dataset.code);
    });
    $('#coverageBadge').textContent = '수집 완료 ' + DATA.length + '개 기업';
    listRows();
    render(DATA[0]);
  </script>
</body>
</html>
