<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DiscloseAI — Corporate Galaxies (섹터 은하수)</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060a13;color:#e0e0e0;font-family:-apple-system,'Pretendard',sans-serif;overflow:hidden;user-select:none}
canvas{display:block}

/* Alert */
.alert-banner{position:fixed;top:-80px;left:0;right:0;z-index:100;background:linear-gradient(90deg,rgba(20,40,80,0.96),rgba(30,60,120,0.96));border-bottom:2px solid #4da6ff;padding:14px 24px;display:flex;align-items:center;gap:12px;transition:top 0.6s cubic-bezier(0.16,1,0.3,1)}
.alert-banner.show{top:0}
.alert-dot{width:10px;height:10px;background:#ff4444;border-radius:50%;animation:pulse 1s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(0.8)}}

/* HUD */
.hud-main{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px}
.hud-modes{display:flex;gap:4px;background:rgba(8,12,24,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:5px 8px}
.hud-modes button{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#777;padding:6px 16px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;transition:all 0.25s}
.hud-modes button:hover{background:rgba(255,255,255,0.08);color:#ccc}
.hud-modes button.on{color:#fff;border-color:#4da6ff}
.hud-modes button.on[data-mode="analyze"]{background:rgba(77,166,255,0.2)}
.hud-modes button.on[data-mode="disclosure"]{background:rgba(251,191,36,0.2);border-color:#fbbf24}
.hud-modes button.on[data-mode="timemachine"]{background:rgba(124,108,240,0.2);border-color:#7c6cf0}
.hud-sub{display:flex;gap:4px;background:rgba(8,12,24,0.92);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:4px 8px;transition:opacity 0.3s;flex-wrap:wrap;max-width:92vw;justify-content:center}
.hud-sub button{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:#888;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10px;transition:all 0.2s;border-left:3px solid var(--sc,transparent)}
.hud-sub button:hover{color:#ddd;background:rgba(255,255,255,0.08)}
.hud-sub button.on{background:color-mix(in srgb, var(--sc, #4da6ff) 22%, transparent);border-color:var(--sc, #4da6ff);color:var(--sc, #4da6ff)}
.mode-hint{font-size:10px;color:#555;text-align:center}

/* Panel */
.panel{position:fixed;right:-520px;top:0;bottom:0;width:520px;z-index:90;background:rgba(8,12,24,0.98);border-left:1px solid rgba(77,166,255,0.15);overflow-y:auto;transition:right 0.5s cubic-bezier(0.16,1,0.3,1)}
.panel.open{right:0}
.close-btn{position:absolute;top:14px;right:14px;background:none;border:none;color:#555;font-size:22px;cursor:pointer;z-index:5}

/* Fin cards */
.fin-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.fin-card .card-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.fin-card .card-title .src{font-size:10px;color:#555;margin-left:auto}
.fin-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0;font-size:12px}
.fin-row .label{color:#888;min-width:80px}
.fin-row .value{font-weight:500}
.fin-bar-wrap{flex:1;max-width:100px;height:5px;background:rgba(255,255,255,0.05);border-radius:3px;margin:0 8px;overflow:hidden}
.fin-bar{height:100%;border-radius:3px}
.fin-insight{margin-top:10px;padding:8px 10px;background:rgba(77,166,255,0.05);border-left:3px solid rgba(77,166,255,0.25);border-radius:0 6px 6px 0;font-size:11px;color:#8bb8d9;line-height:1.6}
.fin-change{font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px}
.fin-change.up{background:rgba(74,222,128,0.1);color:#4ade80}
.fin-change.down{background:rgba(248,113,113,0.1);color:#f87171}
.checkpoint{padding:8px 10px;background:rgba(251,191,36,0.04);border:1px solid rgba(251,191,36,0.1);border-radius:7px;margin-bottom:6px;font-size:11px}
.checkpoint .cp-title{color:#e0e0e0;font-weight:500}
.checkpoint .cp-detail{color:#888;margin-top:3px;line-height:1.5}

/* EQS */
.eqs-module{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.eqs-bar{height:5px;background:rgba(255,255,255,0.05);border-radius:3px;margin:5px 0;overflow:hidden}
.eqs-fill{height:100%;border-radius:3px}
.eqs-what{background:rgba(77,166,255,0.04);border:1px solid rgba(77,166,255,0.1);border-radius:8px;padding:10px;font-size:11px;color:#8bb8d9;line-height:1.7}

/* Timemachine */
.tm-scene{padding:20px}
.tm-header{text-align:center;margin-bottom:20px}
.tm-header .tm-date{font-size:28px;font-weight:700;color:#7c6cf0}
.tm-header .tm-sub{font-size:12px;color:#666;margin-top:4px}
.tm-disclosure{background:rgba(77,166,255,0.06);border:1px solid rgba(77,166,255,0.15);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.tm-disclosure .tm-label{font-size:10px;color:#4da6ff;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.tm-disclosure .tm-title{font-size:15px;font-weight:600;color:#fff}
.tm-disclosure .tm-detail{font-size:12px;color:#999;margin-top:4px}
.tm-news{margin-bottom:14px}
.tm-news-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:11px}
.tm-news-item .src{color:#fbbf24;min-width:50px}
.tm-news-item .headline{color:#ccc}
.tm-choices{display:flex;gap:10px;justify-content:center;margin:20px 0}
.tm-choice{padding:12px 28px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;border:2px solid;transition:all 0.2s;text-align:center}
.tm-choice:hover{transform:scale(1.05)}
.tm-choice.buy{background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.3);color:#4ade80}
.tm-choice.hold{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.15);color:#aaa}
.tm-choice.sell{background:rgba(248,113,113,0.08);border-color:rgba(248,113,113,0.3);color:#f87171}
.tm-result{display:none;animation:fadeUp 0.5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.tm-result-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:16px;margin-bottom:10px}
.tm-result-card .big-num{font-size:32px;font-weight:700;text-align:center}
.tm-result-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
.tm-lesson{background:rgba(124,108,240,0.06);border:1px solid rgba(124,108,240,0.15);border-radius:10px;padding:14px;margin-top:14px}
.tm-lesson .lesson-title{font-size:12px;font-weight:600;color:#7c6cf0;margin-bottom:6px}
.tm-lesson .lesson-body{font-size:11px;color:#999;line-height:1.7}
.tm-eqs-hint{background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.12);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:11px;color:#d98888;line-height:1.6}
.tm-next{display:block;margin:16px auto 0;padding:10px 30px;background:rgba(124,108,240,0.15);border:1px solid rgba(124,108,240,0.3);border-radius:8px;color:#7c6cf0;font-size:13px;cursor:pointer;font-weight:500}

/* Common */
.section-title{font-size:12px;font-weight:600;margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.05)}
.tag{display:inline-block;font-size:10px;padding:2px 7px;border-radius:8px;margin:2px;background:rgba(255,255,255,0.05);color:#999;border:1px solid rgba(255,255,255,0.08)}
.title{position:fixed;top:16px;left:20px;z-index:50}
.title h1{font-size:16px;font-weight:600;color:rgba(255,255,255,0.85)}
.title p{font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px}
.title .live{display:inline-block;width:6px;height:6px;background:#22c55e;border-radius:50%;margin-right:4px;animation:pulse 2s infinite}
.legend{position:fixed;z-index:50;background:rgba(8,12,24,0.92);border:1px solid rgba(255,255,255,0.08);border-radius:8px;padding:10px 14px;font-size:10px;color:#888;max-width:260px}
.legend-title{font-size:10px;font-weight:600;color:#ccc;margin-bottom:6px;padding-bottom:4px;border-bottom:1px solid rgba(255,255,255,0.08)}
.legend-edge{bottom:16px;left:16px}
.legend-item{display:flex;align-items:center;gap:6px;margin:3px 0;line-height:1.2}
.legend-line{width:20px;height:0;flex:0 0 20px;border-top-width:2px;border-top-style:solid}

/* 엣지 범례 hover 툴팁 (K-IFRS·공정거래법·자본시장법 근거) */
.legend-edge .legend-item{position:relative;cursor:help;padding:2px 2px;border-radius:4px;transition:background 0.15s}
.legend-edge .legend-item:hover{background:rgba(255,255,255,0.06)}
.legend-edge .legend-item:hover::after{
  content:attr(data-tooltip);
  position:absolute;left:calc(100% + 10px);bottom:-4px;
  width:300px;padding:10px 12px;
  background:rgba(8,12,24,0.98);
  border:1px solid rgba(251,191,36,0.4);
  border-radius:6px;
  font-size:11px;color:#e0e0e0;line-height:1.6;
  z-index:200;pointer-events:none;
  white-space:normal;text-align:left;
  box-shadow:0 4px 20px rgba(0,0,0,0.5);
}

/* Disclosure panel */
.disc-impact{padding:6px 10px;border-radius:6px;margin-bottom:6px;font-size:12px;display:flex;justify-content:space-between;align-items:center}
.disc-impact .company{font-weight:500}
.disc-impact .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
</style>
</head>
<body>

<div class="alert-banner" id="alert">
  <div class="alert-dot"></div>
  <div style="font-size:13px;flex:1;line-height:1.5"><strong style="color:#4da6ff">📡 신규 공시 감지</strong><br>삼성전자 (005930) — 타법인 주식 취득 결정 (<strong style="color:#4da6ff">레인보우로보틱스</strong>, <span style="color:#fbbf24;font-weight:600">5,000억원</span>)</div>
  <button style="background:none;border:1px solid rgba(255,255,255,0.2);color:white;padding:4px 12px;border-radius:4px;cursor:pointer;font-size:11px" onclick="document.getElementById('alert').classList.remove('show')">닫기</button>
</div>

<div class="title"><h1>DiscloseAI</h1><p><span class="live"></span>기업을 클릭하여 해부를 시작하세요</p></div>

<canvas id="c"></canvas>


<div class="panel" id="panel">
  <button class="close-btn" onclick="closePanel()">×</button>
  <div id="panelInner" style="padding:20px"></div>
</div>

<!-- 풀스크린 기업분석 오버레이 — 기업 행성 클릭 시 firm_<ticker>.html 단독 분석 페이지를 iframe으로 띄움 -->
<div id="fullAnalysis" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(8,12,28,0.92);backdrop-filter:blur(4px)">
  <div style="position:absolute;top:14px;right:18px;display:flex;gap:8px;align-items:center;z-index:10001">
    <span id="fullAnalysisTitle" style="color:#cbd5e1;font-size:13px;padding:6px 12px;background:rgba(15,23,42,0.7);border:1px solid #334155;border-radius:18px"></span>
    <button onclick="closeFullAnalysis()" title="닫고 우주 화면으로 돌아가기" style="font-size:18px;line-height:1;width:36px;height:36px;border-radius:50%;border:1px solid #475569;background:rgba(15,23,42,0.85);color:#e2e8f0;cursor:pointer;font-weight:600">×</button>
  </div>
  <iframe id="fullAnalysisFrame" src="about:blank" style="position:absolute;inset:0;width:100%;height:100%;border:0;background:#0f172a"></iframe>
</div>

<div class="hud-main">
  <div class="hud-sub" id="hudSub"></div>
  <div class="hud-modes">
    <button class="on" data-mode="analyze" onclick="setMode('analyze',this)">📊 기업분석</button>
    <button data-mode="disclosure" onclick="setMode('disclosure',this)">📡 공시</button>
    <button data-mode="timemachine" onclick="setMode('timemachine',this)">🕰 타임머신</button>
  </div>
  <div class="mode-hint" id="modeHint">기업을 클릭하면 재무제표와 EQS 분석을 볼 수 있습니다</div>
</div>

<!-- 좌측 하단: 관계 유형(엣지 색) 범례 — 각 항목 hover 시 K-IFRS·공정거래법 근거 툴팁 -->
<div class="legend legend-edge">
  <div class="legend-title">관계 유형 (엣지 색) <span style="font-weight:400;color:#666">— 항목에 커서를 올려두면 상세 설명</span></div>
  <div class="legend-item" data-tooltip="K-IFRS 1110 &#39;연결재무제표&#39; 기준. 의결권 50% 초과 보유 시 지배력이 인정되어 지배기업-종속기업 관계가 성립합니다. 지배기업은 종속기업의 자산·부채·손익을 합산한 연결재무제표를 작성할 의무를 집니다."><span class="legend-line" style="border-color:#ef4444;border-top-width:2.5px"></span>종속기업 (K-IFRS &gt;50%)</div>
  <div class="legend-item" data-tooltip="K-IFRS 1028 &#39;관계기업과 공동기업에 대한 투자&#39; 기준. 의결권 20~50% 보유 시 유의적 영향력(significant influence)이 추정되어 관계기업으로 분류됩니다. 지분법(equity method)을 적용하여 피투자기업 순이익 중 지분만큼을 투자자의 손익에 반영합니다."><span class="legend-line" style="border-color:#f97316;border-top-width:2px"></span>관계기업 (K-IFRS 20~50%)</div>
  <div class="legend-item" data-tooltip="자본시장법 제147조 &#39;주식등의 대량보유상황 보고&#39; 기준. 상장주식 5% 이상 취득 시 5영업일 이내 공시 의무(5% rule). K-IFRS 1109상 금융자산으로 공정가치 측정하며, 지배·유의적 영향력 없는 지분투자로 분류됩니다."><span class="legend-line" style="border-color:#94a3b8;border-top-style:dashed;border-top-width:1.2px"></span>유의적 투자 (5~20%)</div>
  <div class="legend-item" data-tooltip="공정거래법 제2조 제11호 &#39;기업집단&#39; 정의 및 동법 시행령. 공정거래위원회가 매년 5월 지정·공시하는 &#39;공시대상기업집단&#39;(자산총액 5조원 이상)의 소속회사 간 관계. 동일인이 사실상 지배하는 기업 집합으로, K-IFRS 특수관계자 정의보다 광범위합니다."><span class="legend-line" style="border-color:#fbbf24;border-top-style:dashed;border-top-width:1.5px"></span>공정위 계열</div>
  <div class="legend-item" data-tooltip="K-IFRS 1024 &#39;특수관계자 공시&#39; 기준. 사업보고서 주석에 공시된 지배·종속·관계·공동기업 및 동일인 지배 하 형제회사 등. 지분율로는 포착되지 않지만 실질 지배력·영향력이 인정되는 관계까지 포함하여 공정위 미지정 독립기업의 실질 관계를 보강합니다."><span class="legend-line" style="border-color:#a78bfa;border-top-style:dashed;border-top-width:1.2px"></span>사업보고서 특수관계자</div>
  <div class="legend-item" data-tooltip="공개 DB(DART·공정거래위원회)에 반영되지 않은 상호 관계 — CPA 팀의 실사·감사 정보 또는 알려진 인적 지배 관계 기반 수동 보정. 향후 공시에 반영되면 자동 소스(K-IFRS/공정위)로 대체됩니다."><span class="legend-line" style="border-color:#ec4899;border-top-style:dotted;border-top-width:1px"></span>수동 보정</div>
  <div style="margin-top:6px;font-size:9px;color:#555">실선 = K-IFRS 지분율 분류, 점선 = 공정위/주석/수동</div>
</div>

<script>
const c=document.getElementById('c'),x=c.getContext('2d');let W,H;function resize(){W=c.width=innerWidth;H=c.height=innerHeight}resize();onresize=resize;

// ===== DATA =====
// Helper — hex + alpha → rgba()
function hexA(hex, a){ const h = hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); return `rgba(${r},${g},${b},${a})`; }
const bySecCount = {};
// Each sector is a galaxy — cx/cy are world-space galaxy centers, each has spiral arms, rotation, scale
const sectors={
  '반도체':     {color:'#7c6cf0',cx:-0.55,cy:-0.35,size:1.3, arms:3, tightness:0.5,  rotation: 0.00018, spin: 1},
  '디스플레이': {color:'#4da6ff',cx: 0.55,cy:-0.50,size:0.9, arms:2, tightness:0.6,  rotation:-0.00022, spin:-1},
  '2차전지':    {color:'#22d3ee',cx: 0.70,cy: 0.05,size:1.0, arms:4, tightness:0.45, rotation: 0.00016, spin: 1},
  '바이오':     {color:'#34d399',cx:-0.70,cy: 0.30,size:1.0, arms:3, tightness:0.55, rotation:-0.00020, spin:-1},
  '자동차':     {color:'#f97316',cx: 0.00,cy: 0.50,size:1.1, arms:2, tightness:0.4,  rotation: 0.00014, spin: 1},
  '금융':       {color:'#a78bfa',cx:-0.20,cy:-0.60,size:0.8, arms:2, tightness:0.7,  rotation: 0.00019, spin: 1},
  '플랫폼':     {color:'#f472b6',cx: 0.30,cy:-0.15,size:0.7, arms:2, tightness:0.5,  rotation:-0.00024, spin:-1},
  '에너지':     {color:'#facc15',cx:-0.45,cy: 0.00,size:0.7, arms:3, tightness:0.5,  rotation: 0.00017, spin: 1},
  '중공업·방산':{color:'#64748b',cx: 0.75,cy:-0.25,size:0.7, arms:2, tightness:0.5,  rotation:-0.00018, spin:-1},
  '건설':       {color:'#d97706',cx: 0.20,cy: 0.28,size:0.6, arms:2, tightness:0.5,  rotation: 0.00016, spin: 1},
  '통신':       {color:'#06b6d4',cx:-0.30,cy: 0.55,size:0.6, arms:2, tightness:0.5,  rotation:-0.00021, spin:-1},
  '기타':       {color:'#a3e635',cx: 0.05,cy:-0.05,size:0.5, arms:2, tightness:0.5,  rotation: 0.00015, spin: 1}
};

// Cuter chibi cat — bigger head, huge eyes, rounder body
function makeCatSprite(pose){
  const size = 160;
  const cv = document.createElement('canvas');
  cv.width = cv.height = size;
  const c = cv.getContext('2d');
  // Pose params — chibi proportions (head ~= body)
  let bodyY=95, bodyW=56, bodyH=42, legFR=0, legBR=0, tailRot=0.3, earDrop=0, stretchX=1, squashY=1, eyeMood='happy';
  if(pose==='idle'){bodyY=95;stretchX=1;squashY=1;tailRot=0.3;eyeMood='happy';}
  else if(pose==='crouch'){bodyY=108;bodyH=36;stretchX=1.1;squashY=0.85;tailRot=-0.1;eyeMood='determined';}
  else if(pose==='launch'){bodyY=80;bodyH=36;stretchX=1.15;squashY=1.15;tailRot=-0.5;legFR=-0.7;legBR=1.1;eyeMood='excited';}
  else if(pose==='midair'){bodyY=72;bodyH=38;stretchX=1.2;squashY=1.2;tailRot=-0.9;legFR=-1.0;legBR=1.3;earDrop=0.15;eyeMood='excited';}
  else if(pose==='land'){bodyY=105;bodyH=38;stretchX=0.85;squashY=0.85;tailRot=0.7;legFR=0.6;legBR=-0.3;eyeMood='happy';}
  c.save();
  c.translate(size/2,0);
  c.scale(stretchX, squashY);

  // === TAIL ===
  c.save();
  c.translate(-bodyW/2+4, bodyY-6);
  c.rotate(tailRot);
  c.strokeStyle='#d98248';c.lineWidth=9;c.lineCap='round';
  c.beginPath();c.moveTo(0,0);c.quadraticCurveTo(-18,-2,-26,-22);c.stroke();
  c.strokeStyle='#fff';c.lineWidth=5;
  c.beginPath();c.moveTo(-22,-18);c.quadraticCurveTo(-24,-21,-26,-22);c.stroke();
  c.restore();

  // === BACK LEGS ===
  c.fillStyle='#d98248';
  c.save();c.translate(-bodyW/2+12, bodyY+bodyH/2-2);c.rotate(legBR*0.3);
  c.beginPath();c.ellipse(0,6,5,9,0,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.beginPath();c.ellipse(0,13,4,3,0,0,Math.PI*2);c.fill();
  c.restore();

  // === BODY (rounder, blobby chibi) ===
  c.fillStyle='#f2a869';
  c.beginPath();c.ellipse(0,bodyY,bodyW/2,bodyH/2,0,0,Math.PI*2);c.fill();
  // belly (white patch)
  c.fillStyle='#fff4e0';
  c.beginPath();c.ellipse(2,bodyY+bodyH*0.2,bodyW*0.35,bodyH*0.38,0,0,Math.PI*2);c.fill();
  // shoulder shade
  c.fillStyle='rgba(180,100,40,0.15)';
  c.beginPath();c.ellipse(-bodyW*0.2,bodyY-bodyH*0.15,bodyW*0.2,bodyH*0.2,0,0,Math.PI*2);c.fill();

  // === FRONT LEGS ===
  c.fillStyle='#d98248';
  c.save();c.translate(bodyW/2-12, bodyY+bodyH/2-2);c.rotate(legFR*0.4);
  c.beginPath();c.ellipse(0,6,4.5,8,0,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.beginPath();c.ellipse(0,12,3.5,2.5,0,0,Math.PI*2);c.fill();
  c.restore();
  c.fillStyle='#d98248';
  c.save();c.translate(bodyW/2-20, bodyY+bodyH/2-2);c.rotate(legFR*0.2);
  c.beginPath();c.ellipse(0,6,4,7,0,0,Math.PI*2);c.fill();
  c.fillStyle='#fff';c.beginPath();c.ellipse(0,11,3,2,0,0,Math.PI*2);c.fill();
  c.restore();

  // === HEAD === (big chibi head)
  const headX = bodyW/2-2, headY = bodyY-24;
  const headR = 22;
  c.fillStyle='#f2a869';
  c.beginPath();c.ellipse(headX,headY,headR,headR*0.95,0,0,Math.PI*2);c.fill();
  // cheek fluff
  c.fillStyle='#fff4e0';
  c.beginPath();c.ellipse(headX-6,headY+6,8,5,0,0,Math.PI*2);c.fill();
  c.beginPath();c.ellipse(headX+6,headY+6,8,5,0,0,Math.PI*2);c.fill();

  // === EARS (larger triangular) ===
  c.fillStyle='#d98248';
  c.save();c.translate(headX-headR*0.7,headY-headR*0.65);c.rotate(-0.25+earDrop);
  c.beginPath();c.moveTo(0,0);c.lineTo(-6,-14);c.lineTo(8,-4);c.closePath();c.fill();c.restore();
  c.save();c.translate(headX+headR*0.7,headY-headR*0.65);c.rotate(0.25-earDrop);
  c.beginPath();c.moveTo(0,0);c.lineTo(6,-14);c.lineTo(-8,-4);c.closePath();c.fill();c.restore();
  // inner ears (pink)
  c.fillStyle='#ffb8a8';
  c.save();c.translate(headX-headR*0.7,headY-headR*0.65);c.rotate(-0.25+earDrop);
  c.beginPath();c.moveTo(-1,-2);c.lineTo(-4,-10);c.lineTo(3,-4);c.closePath();c.fill();c.restore();
  c.save();c.translate(headX+headR*0.7,headY-headR*0.65);c.rotate(0.25-earDrop);
  c.beginPath();c.moveTo(1,-2);c.lineTo(4,-10);c.lineTo(-3,-4);c.closePath();c.fill();c.restore();

  // === HEAD STRIPES (M-shape forehead) ===
  c.strokeStyle='rgba(160,90,35,0.55)';c.lineWidth=2.2;c.lineCap='round';
  c.beginPath();
  c.moveTo(headX-6,headY-10);c.lineTo(headX-4,headY-15);
  c.moveTo(headX,headY-12);c.lineTo(headX,headY-17);
  c.moveTo(headX+6,headY-10);c.lineTo(headX+4,headY-15);
  c.stroke();

  // === EYES (huge chibi eyes) ===
  const eyeY = headY-1, eyeDX = 7, eyeW = 5, eyeH = 7;
  if(eyeMood==='excited' || pose==='midair'){
    // sparkly wide-open eyes
    c.fillStyle='#1a1a1a';
    c.beginPath();c.ellipse(headX-eyeDX,eyeY,eyeW,eyeH,0,0,Math.PI*2);
    c.ellipse(headX+eyeDX,eyeY,eyeW,eyeH,0,0,Math.PI*2);c.fill();
    // big sparkle highlights
    c.fillStyle='#fff';
    c.beginPath();c.ellipse(headX-eyeDX+1.5,eyeY-2,2.2,2.8,0,0,Math.PI*2);
    c.ellipse(headX+eyeDX+1.5,eyeY-2,2.2,2.8,0,0,Math.PI*2);c.fill();
    // small under-sparkle
    c.beginPath();c.arc(headX-eyeDX-1.5,eyeY+2.5,0.8,0,Math.PI*2);
    c.arc(headX+eyeDX-1.5,eyeY+2.5,0.8,0,Math.PI*2);c.fill();
  } else if(eyeMood==='determined'){
    // narrowed eyes (^ shape)
    c.strokeStyle='#1a1a1a';c.lineWidth=2.5;c.lineCap='round';
    c.beginPath();
    c.moveTo(headX-eyeDX-4,eyeY+1);c.quadraticCurveTo(headX-eyeDX,eyeY-3,headX-eyeDX+4,eyeY+1);
    c.moveTo(headX+eyeDX-4,eyeY+1);c.quadraticCurveTo(headX+eyeDX,eyeY-3,headX+eyeDX+4,eyeY+1);
    c.stroke();
  } else {
    // happy round eyes
    c.fillStyle='#1a1a1a';
    c.beginPath();c.ellipse(headX-eyeDX,eyeY,eyeW*0.95,eyeH,0,0,Math.PI*2);
    c.ellipse(headX+eyeDX,eyeY,eyeW*0.95,eyeH,0,0,Math.PI*2);c.fill();
    // highlights
    c.fillStyle='#fff';
    c.beginPath();c.ellipse(headX-eyeDX+1.5,eyeY-2.5,1.8,2.4,0,0,Math.PI*2);
    c.ellipse(headX+eyeDX+1.5,eyeY-2.5,1.8,2.4,0,0,Math.PI*2);c.fill();
  }
  // blush
  c.fillStyle='rgba(255,150,160,0.45)';
  c.beginPath();c.ellipse(headX-10,headY+5,3.5,2,0,0,Math.PI*2);
  c.ellipse(headX+10,headY+5,3.5,2,0,0,Math.PI*2);c.fill();

  // === NOSE + MOUTH ===
  c.fillStyle='#ff8095';
  c.beginPath();c.moveTo(headX-2,headY+7);c.lineTo(headX+2,headY+7);c.lineTo(headX,headY+9.5);c.closePath();c.fill();
  c.strokeStyle='#3a2518';c.lineWidth=1.3;c.lineCap='round';
  c.beginPath();
  c.moveTo(headX,headY+9.5);c.lineTo(headX,headY+11);
  c.moveTo(headX,headY+11);c.quadraticCurveTo(headX-3.5,headY+13,headX-5,headY+11);
  c.moveTo(headX,headY+11);c.quadraticCurveTo(headX+3.5,headY+13,headX+5,headY+11);
  c.stroke();

  // === WHISKERS ===
  c.strokeStyle='rgba(255,255,255,0.75)';c.lineWidth=0.9;c.lineCap='round';
  c.beginPath();
  c.moveTo(headX-7,headY+8);c.lineTo(headX-17,headY+6);
  c.moveTo(headX-7,headY+10);c.lineTo(headX-17,headY+11);
  c.moveTo(headX+7,headY+8);c.lineTo(headX+17,headY+6);
  c.moveTo(headX+7,headY+10);c.lineTo(headX+17,headY+11);
  c.stroke();

  c.restore();
  return cv;
}
['idle','crouch','launch','midair','land'].forEach(p=>{ catSprites[p]=makeCatSprite(p); });

// Seeded RNG (mulberry32)
function mkRand(seed){let s=seed>>>0;return function(){s=(s+0x6D2B79F5)>>>0;let t=s;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296};}
function mixHex(hex,target,amt){const h=hex.replace('#','');const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);const tr=(target>>16)&255,tg=(target>>8)&255,tb=target&255;return `rgb(${Math.round(r+(tr-r)*amt)},${Math.round(g+(tg-g)*amt)},${Math.round(b+(tb-b)*amt)})`;}
function hexRGB(hex){const h=hex.replace('#','');return {r:parseInt(h.slice(0,2),16),g:parseInt(h.slice(2,4),16),b:parseInt(h.slice(4,6),16)};}

function buildPlanetTexture(n){
  const TEX_SIZE = 256;
  const cv = document.createElement('canvas');
  cv.width = cv.height = TEX_SIZE;
  const cx = cv.getContext('2d');
  const rnd = mkRand(n.seed);
  const typeIdx = Math.floor(rnd()*PLANET_TYPES.length);
  const type = PLANET_TYPES[typeIdx];
  n.planetType = type;
  n.hasRing = rnd() < 0.22; // ~22% planets get rings
  n.hasMoon = rnd() < 0.15;
  n.ringTilt = (rnd()-0.5)*0.6;
  n.ringWidth = 0.35 + rnd()*0.25;
  n.ringColor = n.col;
  n.moonAngle = rnd()*Math.PI*2;
  n.moonDist = 1.5 + rnd()*0.4;
  n.moonSpeed = 0.005 + rnd()*0.008;

  const base = hexRGB(n.col);
  const R = TEX_SIZE/2;
  // draw equirectangular strip (2:1 wrapped around sphere). We'll paint directly as circle mapped via cosine warp.
  const img = cx.createImageData(TEX_SIZE, TEX_SIZE);
  const data = img.data;

  // Value-noise-ish using summed sine bands
  function noise2(u, v, freq, phase){
    return Math.sin(u*freq+phase)*Math.cos(v*freq*0.8+phase*1.3) + Math.sin(u*freq*2.3+phase*2)*0.5;
  }

  for(let py=0;py<TEX_SIZE;py++){
    for(let px=0;px<TEX_SIZE;px++){
      const dx = (px-R)/R, dy=(py-R)/R;
      const d2 = dx*dx+dy*dy;
      const idx = (py*TEX_SIZE+px)*4;
      if(d2 > 1){ data[idx+3]=0; continue; }
      // sphere-ified uv (longitude/latitude)
      const z = Math.sqrt(1-d2);
      const lon = Math.atan2(dx, z); // -pi..pi
      const lat = Math.asin(dy);     // -pi/2..pi/2
      const u = lon, v = lat;
      let r=base.r, g=base.g, b=base.b;
      // Lighting: diffuse (light from upper-left)
      const lx=-0.55, ly=-0.55, lz=0.63;
      const nnx=dx, nny=dy, nnz=z;
      let lum = Math.max(0, nnx*lx+nny*ly+nnz*lz);
      lum = 0.15 + lum*0.95; // ambient + diffuse

      if(type==='gas'){
        // horizontal bands + swirls (Jupiter-like)
        const band = Math.sin(v*7 + noise2(u,v,3,n.seed)*1.2 + n.seed*0.1);
        const swirl = noise2(u+band*0.3, v, 5, n.seed+1)*0.3;
        const t = (band+swirl+1)/2;
        r = base.r*(0.6+t*0.55); g=base.g*(0.6+t*0.55); b=base.b*(0.6+t*0.55);
        // Great red/dark spot
        const sx = 0.4, sy = 0.15;
        const sd = Math.hypot((u-sx)*0.8, v-sy);
        if(sd<0.25){ const sf = 1-sd/0.25; r*= (1-sf*0.5); g*=(1-sf*0.7); b*=(1-sf*0.4); r+=sf*60; }
      } else if(type==='rocky'){
        // continents + seas
        const h = noise2(u,v,3.5,n.seed) + noise2(u,v,8,n.seed+2)*0.5 + noise2(u,v,18,n.seed+3)*0.25;
        if(h>0.2){ // land
          const lf = Math.min(1,(h-0.2)*1.2);
          r = base.r*(0.7+lf*0.5); g=base.g*(0.9+lf*0.3); b=base.b*(0.5+lf*0.2);
        } else { // ocean
          r = base.r*0.35; g=base.g*0.5; b=base.b*0.9;
        }
        // Polar caps
        if(Math.abs(v)>0.9-Math.abs(noise2(u,0,6,n.seed))*0.1){ r=240;g=248;b=255; }
      } else if(type==='ice'){
        const crack = Math.abs(noise2(u,v,6,n.seed))+Math.abs(noise2(u,v,14,n.seed+2))*0.4;
        const t = Math.max(0, 1-crack*1.3);
        r = 200+t*55; g=220+t*35; b=240+t*15;
        // subtle blue tint from base color
        r = r*0.6+base.r*0.4; g=g*0.6+base.g*0.4; b=b*0.6+base.b*0.4;
      } else if(type==='lava'){
        const h = noise2(u,v,4,n.seed)+noise2(u,v,12,n.seed+1)*0.6;
        if(h>0.3){ r=255; g=120+Math.random()*40; b=40; } // lava cracks
        else { r=base.r*0.4; g=base.g*0.3; b=base.b*0.3; }
        // glow
        const glow = Math.max(0,h-0.2);
        r=Math.min(255,r+glow*120); g=Math.min(255,g+glow*40);
      } else if(type==='crater'){
        // grey moon-like with craters
        const baseG = 140+noise2(u,v,5,n.seed)*30;
        r=baseG*(0.7)+base.r*0.3; g=baseG*(0.75)+base.g*0.25; b=baseG*(0.85)+base.b*0.15;
        // Craters: punch circular dimples
        const rnd2 = mkRand(n.seed+99);
        for(let c=0;c<6;c++){
          const cu = -2+rnd2()*4, cv = -1+rnd2()*2, cr = 0.08+rnd2()*0.15;
          const cd = Math.hypot(u-cu, v-cv);
          if(cd<cr){ const f=1-cd/cr; r*=(1-f*0.4); g*=(1-f*0.4); b*=(1-f*0.4); if(cd<cr*0.6) { r*=1.1; g*=1.1; b*=1.1; } }
        }
      } else { // striped
        const band = Math.sin(v*11 + u*0.5 + n.seed);
        const t = (band+1)/2;
        r = base.r*(0.5+t*0.7); g=base.g*(0.5+t*0.7); b=base.b*(0.5+t*0.7);
      }

      // Apply lighting
      r=Math.min(255,r*lum); g=Math.min(255,g*lum); b=Math.min(255,b*lum);
      // Edge darkening (limb)
      const edge = Math.pow(d2, 3);
      r*=(1-edge*0.4); g*=(1-edge*0.4); b*=(1-edge*0.4);
      // Specular near light point
      const spec = Math.max(0, nnx*lx+nny*ly+nnz*lz);
      const sp2 = Math.pow(spec, 20)*(type==='ice'||type==='rocky'?0.8:0.3);
      r=Math.min(255,r+sp2*180); g=Math.min(255,g+sp2*180); b=Math.min(255,b+sp2*180);

      data[idx]=r; data[idx+1]=g; data[idx+2]=b; data[idx+3]=255;
    }
  }
  cx.putImageData(img,0,0);
  return cv;
}

// ===== GRAPH ENGINE (same) =====
function init(){
  const nm={};
  // Group nodes by sector for intra-galaxy positioning
  const bySec = {};
  raw.forEach(r => { if(!bySec[r.s]) bySec[r.s]=[]; bySec[r.s].push(r); });
  Object.keys(bySec).forEach(k=>{ bySecCount[k]=bySec[k].length; });
  window._galaxyCache = null;
  const SPAN = Math.max(W,H) * 0.80;
  nodes = [];
  Object.entries(bySec).forEach(([secName, secNodes])=>{
    const sec = sectors[secName] || sectors['기타'];
    const gcx = W/2 + sec.cx * SPAN;
    const gcy = H/2 + sec.cy * SPAN;
    const gr = 175 * sec.size;
    const arms = sec.arms;
    const tight = sec.tightness;
    secNodes.forEach((r,i)=>{
      const armIdx = i % arms;
      const armPhase = (armIdx/arms) * Math.PI*2;
      const coreBias = Math.max(0.15, 1 - (r.sz||1)*0.25);
      const dist = gr * (0.15 + coreBias*0.9);
      const spiralAng = armPhase + Math.log(dist/18+1)*tight*sec.spin + (i/secNodes.length)*0.8;
      const jA = (Math.random()-0.5)*0.35;
      const jD = (Math.random()-0.5)*20;
      const n = { ...r,
        x: gcx + Math.cos(spiralAng+jA)*(dist+jD),
        y: gcy + Math.sin(spiralAng+jA)*(dist+jD),
        vx:0, vy:0, glow:0, pp:Math.random()*6.28, col:sec.color,
        orbitR: dist+jD, orbitA: spiralAng+jA,
        gcx, gcy, secRef: sec
      };
      nm[r.n]=n;
      nodes.push(n);
    });
  });
  camX = (W/2)*(1-zm); camY = (H/2)*(1-zm);
  edges=[];
  nodes.forEach(n=>{if(!n.rl)return;n.rl.forEach(r=>{const parts=r.split(':');const tn=parts[0],rt=parts[1],detail=parts.slice(2).join(':');const tgt=nm[tn];if(tgt)edges.push({a:n,b:tgt,type:rt,detail:detail});});});

  // === build planet textures (offscreen canvas) ===
  nodes.forEach((n,i)=>{ n.seed = i*97 + (n.n.charCodeAt(0)||1); n.rot = (n.seed%360)*Math.PI/180; n.rotSpeed = 0.0008 + (n.seed%11)*0.00015; n.planetTex = buildPlanetTexture(n); });

  // === 평행 엣지 offset 계산 (같은 (min,max) 쌍에 여러 relation_type 엣지가 있으면 나란히 그리기) ===
  // ftc_group 같은 무방향 엣지는 이미 source/target이 ticker 정렬 상태라 (A→B) 하나만 저장됨.
  // K-IFRS 지분 엣지는 방향이 있어 A→B와 B→A가 별도로 존재할 수 있음 — 이것도 같은 쌍으로 묶어 offset.
  const pairIdx = {};
  edges.forEach(e=>{
    const key = [e.a.n, e.b.n].sort().join('|');
    if(!pairIdx[key]) pairIdx[key] = [];
    pairIdx[key].push(e);
  });
  // 폭 기반 동적 offset — 각 엣지의 hover-state 폭(base*1.5) 합 + 1px 여백을 누적해 per-edge 오프셋 산출.
  // 2.5px 고정 step 대비: 가는 선끼리는 더 바짝, 굵은 실선(subsidiary)끼리는 자동으로 더 벌어져 overlap 방지.
  Object.values(pairIdx).forEach(group=>{
    group.forEach((e,i)=>{ e.parallelIdx=i; e.parallelCount=group.length; });
    if(group.length===1){ group[0].parallelOffset=0; return; }
    const PAD=0.0;  // 평행 선 사이 최소 여백 (px) - 딱 붙게 설정
    const widths=group.map(e=>(EDGE_STYLES[e.type]||{width:1}).width);  // 엣지 두께만큼만 떨어뜨리기
    const centers=[]; let acc=widths[0]/2;
    centers.push(acc);
    for(let i=1;i<group.length;i++){ acc+=widths[i-1]/2+PAD+widths[i]/2; centers.push(acc); }
    const mid=(centers[0]+centers[group.length-1])/2;
    group.forEach((e,i)=>{ e.parallelOffset=centers[i]-mid; });
  });
}
function physics(){
  nodes.forEach(n=>{
    const sec = n.secRef;
    if(sec){
      n.orbitA += sec.rotation;
      const tx = n.gcx + Math.cos(n.orbitA)*n.orbitR;
      const ty = n.gcy + Math.sin(n.orbitA)*n.orbitR;
      n.vx += (tx - n.x)*0.012;
      n.vy += (ty - n.y)*0.012;
    }
    nodes.forEach(m=>{
      if(n===m) return;
      if(m.s!==n.s) return;
      const dx=n.x-m.x,dy=n.y-m.y,d=Math.sqrt(dx*dx+dy*dy)||1;
      if(d<120){const f=300/(d*d);n.vx+=dx/d*f;n.vy+=dy/d*f;}
    });
  });
  edges.forEach(e=>{
    const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
    const sameGal = e.a.s===e.b.s;
    const rest = sameGal ? 140 : 400;
    const k = sameGal ? 0.0008 : 0.00015;
    const f = (d-rest)*k;
    e.a.vx+=dx/d*f;e.a.vy+=dy/d*f;e.b.vx-=dx/d*f;e.b.vy-=dy/d*f;
  });
  nodes.forEach(n=>{
    n.vx*=0.86;n.vy*=0.86;n.x+=n.vx;n.y+=n.vy;n.pp+=0.015;
    if(alertOn&&alertSrc){
      if(n.n===alertSrc)n.glow=Math.min(1,n.glow+0.04);
      else{const h1=edges.some(e=>(e.a.n===alertSrc&&e.b.n===n.n)||(e.b.n===alertSrc&&e.a.n===n.n));if(h1)n.glow=Math.min(0.8,n.glow+0.025);else n.glow=Math.max(0,n.glow-0.015);}
    }else n.glow=Math.max(0,n.glow-0.02);
  });
}
function draw(){
time+=0.016;
x.clearRect(0,0,W,H);

// === BACKGROUND: deep space gradient ===
const bgGrad=x.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
bgGrad.addColorStop(0,'#0a0f1e');bgGrad.addColorStop(0.5,'#070b16');bgGrad.addColorStop(1,'#040711');
x.fillStyle=bgGrad;x.fillRect(0,0,W,H);

// === NEBULAE ===
nebulae.forEach(nb=>{const ng=x.createRadialGradient(nb.x*W,nb.y*H,0,nb.x*W,nb.y*H,nb.r*W);ng.addColorStop(0,`hsla(${nb.hue},60%,40%,${nb.alpha*0.5})`);ng.addColorStop(0.5,`hsla(${nb.hue},50%,30%,${nb.alpha*0.25})`);ng.addColorStop(1,'transparent');x.fillStyle=ng;x.fillRect(0,0,W,H);});

// === STARS with twinkle ===
stars.forEach(s=>{const tw=Math.sin(time*s.twinkleSpeed+s.b*10)*0.4+0.6;const bright=tw*s.s*0.3;x.beginPath();x.arc(s.x*W,s.y*H,s.s*0.6,0,Math.PI*2);x.fillStyle=`rgba(200,210,255,${Math.min(1,bright)})`;x.fill();if(s.s>1.5){x.beginPath();x.moveTo(s.x*W-s.s*2,s.y*H);x.lineTo(s.x*W+s.s*2,s.y*H);x.moveTo(s.x*W,s.y*H-s.s*2);x.lineTo(s.x*W,s.y*H+s.s*2);x.strokeStyle=`rgba(200,220,255,${bright*0.3})`;x.lineWidth=0.5;x.stroke();}});

// === SHOOTING STARS ===
shootingStars=shootingStars.filter(ss=>{ss.x+=ss.vx;ss.y+=ss.vy;ss.life-=0.02;if(ss.life<=0)return false;x.beginPath();x.moveTo(ss.x,ss.y);x.lineTo(ss.x-ss.vx*ss.len/5,ss.y-ss.vy*ss.len/5);const sg=x.createLinearGradient(ss.x,ss.y,ss.x-ss.vx*ss.len/5,ss.y-ss.vy*ss.len/5);sg.addColorStop(0,`rgba(255,255,255,${ss.life*0.8})`);sg.addColorStop(1,'transparent');x.strokeStyle=sg;x.lineWidth=1;x.stroke();return true;});

x.save();x.translate(camX,camY);x.scale(zm,zm);

// === GALAXIES (world-space) — render each sector as a spiral galaxy ===
if(!window._galaxyCache){
  window._galaxyCache = {};
  const SPAN = Math.max(W,H) * 0.80;
  Object.entries(sectors).forEach(([name, sec])=>{
    const gcx = W/2 + sec.cx*SPAN;
    const gcy = H/2 + sec.cy*SPAN;
    const gr = 210 * sec.size;
    const parts = [];
    const count = Math.floor(900 * sec.size);
    for(let i=0;i<count;i++){
      const armIdx = Math.floor(Math.random()*sec.arms);
      const armPhase = (armIdx/sec.arms)*Math.PI*2;
      const r = Math.pow(Math.random(), 0.7) * gr;
      const spiralAng = armPhase + Math.log(r/25+1)*sec.tightness*sec.spin;
      const jitter = (Math.random()-0.5)*0.35*(1 - r/gr*0.5);
      parts.push({ r, ang: spiralAng+jitter, size: 0.3+Math.random()*1.6, alpha: 0.15+Math.random()*0.55, twinkle: Math.random()*6.28 });
    }
    const core = [];
    for(let i=0;i<140;i++){
      core.push({ r: Math.pow(Math.random(),1.8)*gr*0.25, ang: Math.random()*Math.PI*2, size: 0.4+Math.random()*1.2, alpha: 0.5+Math.random()*0.5 });
    }
    window._galaxyCache[name] = { gcx, gcy, gr, parts, core, sec, name };
  });
}
Object.values(window._galaxyCache).forEach(g=>{
  const phase = time * g.sec.rotation * 80;
  // Halo
  const halo = x.createRadialGradient(g.gcx,g.gcy,0,g.gcx,g.gcy,g.gr*1.3);
  halo.addColorStop(0, hexA(g.sec.color,0.22));
  halo.addColorStop(0.35, hexA(g.sec.color,0.10));
  halo.addColorStop(0.7, hexA(g.sec.color,0.035));
  halo.addColorStop(1,'transparent');
  x.fillStyle = halo;
  x.fillRect(g.gcx-g.gr*1.3, g.gcy-g.gr*1.3, g.gr*2.6, g.gr*2.6);
  // Spiral arm dust
  x.save(); x.translate(g.gcx,g.gcy); x.rotate(phase);
  g.parts.forEach(p=>{
    const px=Math.cos(p.ang)*p.r, py=Math.sin(p.ang)*p.r;
    const rFrac = p.r/g.gr;
    const fade = rFrac<0.15 ? rFrac/0.15 : (rFrac>0.9 ? (1-rFrac)/0.1 : 1);
    const tw = 0.6 + Math.sin(time*1.5+p.twinkle)*0.4;
    x.fillStyle = hexA(g.sec.color, p.alpha*fade*tw*0.5);
    x.beginPath(); x.arc(px,py,p.size,0,Math.PI*2); x.fill();
  });
  x.restore();
  // Core
  x.save(); x.translate(g.gcx,g.gcy);
  const coreGrad = x.createRadialGradient(0,0,0,0,0,g.gr*0.35);
  coreGrad.addColorStop(0,'rgba(255,245,220,0.9)');
  coreGrad.addColorStop(0.3, hexA(g.sec.color,0.6));
  coreGrad.addColorStop(0.7, hexA(g.sec.color,0.15));
  coreGrad.addColorStop(1,'transparent');
  x.fillStyle = coreGrad;
  x.beginPath(); x.arc(0,0,g.gr*0.35,0,Math.PI*2); x.fill();
  x.rotate(phase*1.5);
  g.core.forEach(cs=>{
    const px=Math.cos(cs.ang)*cs.r, py=Math.sin(cs.ang)*cs.r;
    x.fillStyle = `rgba(255,240,210,${cs.alpha})`;
    x.beginPath(); x.arc(px,py,cs.size,0,Math.PI*2); x.fill();
  });
  x.restore();
  // Label
  if(zm > 0.25){
    x.save();
    const fade = zm>2.0 ? Math.max(0,(3.0-zm)/1.0) : Math.min(1,(zm-0.25)*4);
    x.globalAlpha = fade * 0.85;
    x.fillStyle = hexA(g.sec.color, 0.9);
    x.font = `600 ${Math.max(14, 22*g.sec.size)}px -apple-system, sans-serif`;
    x.textAlign = 'center';
    x.shadowColor = g.sec.color; x.shadowBlur = 16;
    x.fillText(g.name, g.gcx, g.gcy - g.gr*0.9);
    x.shadowBlur = 0;
    x.font = '11px -apple-system, sans-serif';
    x.fillStyle = 'rgba(255,255,255,0.35)';
    x.fillText(`${g.name} Galaxy`.toUpperCase()+` · ${(bySecCount[g.name]||0)} COs`, g.gcx, g.gcy - g.gr*0.9 + 16);
    x.restore();
  }
});

// === RIPPLES ===
ripples=ripples.filter(r=>{r.radius+=3;r.alpha-=0.008;if(r.alpha<=0)return false;x.beginPath();x.arc(r.x,r.y,r.radius,0,Math.PI*2);x.strokeStyle=`rgba(77,166,255,${r.alpha})`;x.lineWidth=1.5;x.stroke();return true;});

// === EDGES ===
// === 엣지 그리기 (평행 offset + 방향 화살표 + 선택 강조) ===
const ARROW_TYPES = new Set(['subsidiary','associate','investment','dart_filing']);  // 방향성 있는 관계만 화살표
edges.forEach(e=>{
  const isH=hov&&(e.a.n===hov.n||e.b.n===hov.n);
  const isA=alertOn&&alertSrc&&(e.a.n===alertSrc||e.b.n===alertSrc);
  const fa=flt==='all'||e.a.s===flt,fb=flt==='all'||e.b.s===flt;

  // sel 기반 alpha — 선택 노드와 연결된 엣지만 선명
  const selConnected = !sel || (e.a===sel || e.b===sel);
  const st=EDGE_STYLES[e.type]||{color:'#999',width:0.5,dash:[]};

  // 평행 offset — 같은 쌍에 여러 엣지 있으면 수직 방향으로 약간 떨어뜨려 나란히
  const dx0=e.b.x-e.a.x, dy0=e.b.y-e.a.y;
  const len=Math.sqrt(dx0*dx0+dy0*dy0)||1;
  let px=-dy0/len, py=dx0/len;  // perpendicular unit
  if(e.a.n > e.b.n) { px = -px; py = -py; } // 법선벡터 방향 통일 (방향 오프셋 상쇄 방지)
  
  // offset은 init()에서 폭 기반 사전 계산됨 (e.parallelOffset)
  const off = e.parallelOffset || 0;
  const x1=e.a.x+px*off, y1=e.a.y+py*off;
  const x2=e.b.x+px*off, y2=e.b.y+py*off;

  x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);
  if(isA){x.strokeStyle=`rgba(251,191,36,${0.5+Math.sin(time*4)*0.2})`;x.lineWidth=2;x.setLineDash([6,4]);x.globalAlpha=1.0;}
  else if(isH||(sel&&selConnected)){x.strokeStyle=st.color;x.lineWidth=st.width*1.5;x.setLineDash(st.dash);x.globalAlpha=1.0;}
  else if(sel&&!selConnected){x.strokeStyle=st.color;x.lineWidth=st.width;x.setLineDash(st.dash);x.globalAlpha=0.08;}
  else{x.strokeStyle=st.color;x.lineWidth=st.width;x.setLineDash(st.dash);x.globalAlpha=0.6;}
  x.stroke();

  // 흐름 효과 — hover/select 시 방향성 있는 엣지에 움직이는 점선 오버레이 (source→target 방향으로 흐름)
  const isFlow = ARROW_TYPES.has(e.type) && (isH || (sel && selConnected));
  if(isFlow){
    x.beginPath();x.moveTo(x1,y1);x.lineTo(x2,y2);
    x.setLineDash([10,16]);
    x.lineDashOffset = -time * 45;  // 음수 → path 방향(a→b)으로 흐름
    x.strokeStyle = st.color;
    x.lineWidth = st.width * 1.6;
    x.globalAlpha = 0.95;
    x.stroke();
    x.lineDashOffset = 0;
  }

  // 방향 화살표 (K-IFRS 지분·주석 관계만 — ftc_group/manual은 무방향)
  if(ARROW_TYPES.has(e.type) && x.globalAlpha >= 0.3){
    x.setLineDash([]);
    const nodeR = e.b.sz*22;
    const tipX = x2 - (dx0/len)*nodeR;
    const tipY = y2 - (dy0/len)*nodeR;
    const arrowSize = isFlow ? Math.max(14, st.width*6) : Math.max(9, st.width*4);
    const ang = Math.atan2(dy0, dx0);
    x.globalAlpha = isFlow ? 1.0 : Math.min(0.9, x.globalAlpha);
    x.beginPath();
    x.moveTo(tipX, tipY);
    x.lineTo(tipX - arrowSize*Math.cos(ang-0.5), tipY - arrowSize*Math.sin(ang-0.5));
    x.lineTo(tipX - arrowSize*Math.cos(ang+0.5), tipY - arrowSize*Math.sin(ang+0.5));
    x.closePath();
    x.fillStyle = st.color;
    x.fill();
  }

  x.globalAlpha=1.0;x.setLineDash([]);
});

// === NODES: 큰 회사는 행성, 작은 회사는 별(star)로 렌더 ===
const selNeighbors = sel ? new Set(edges.filter(e=>e.a===sel||e.b===sel).flatMap(e=>[e.a,e.b])) : null;
// 스타 임계치: sz < 1.1 이면 별처럼, 그 이상이면 행성
const STAR_THRESHOLD = 1.1;
nodes.forEach(n=>{
  const filtered=flt!=='all'&&n.s!==flt;
  const selFaded = sel && n!==sel && (!selNeighbors || !selNeighbors.has(n));
  const r=n.sz*18;
  const pulse=Math.sin(n.pp)*0.08+1;
  const pr=r*pulse;

  x.save();
  if(selFaded) x.globalAlpha = 0.15;

  const isH=hov&&hov.n===n.n,isS=sel&&sel.n===n.n;
  const alpha=filtered?0.15:1;
  const col=n.col;
  const hr=parseInt(col.slice(1,3),16),hg=parseInt(col.slice(3,5),16),hb=parseInt(col.slice(5,7),16);

  // === SMALL NODES → STARS ===
  if(n.sz < STAR_THRESHOLD && !isS && !isH){
    // Alert glow still applies
    if(n.glow>0.01){const gr=pr*(2.5+n.glow*2);const g=x.createRadialGradient(n.x,n.y,pr*0.5,n.x,n.y,gr);g.addColorStop(0,n.n===alertSrc?`rgba(251,191,36,${n.glow*0.5})`:`rgba(77,166,255,${n.glow*0.4})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(n.x,n.y,gr,0,Math.PI*2);x.fill();}
    // Star: sparkle + small bright core
    const twinkle = 0.75 + Math.sin(n.pp*1.5)*0.25;
    const starR = Math.max(3, pr*0.35);
    // soft halo in sector color
    const haloR = starR*4;
    const halo = x.createRadialGradient(n.x,n.y,0,n.x,n.y,haloR);
    halo.addColorStop(0, `rgba(${hr},${hg},${hb},${0.7*alpha*twinkle})`);
    halo.addColorStop(0.4,`rgba(${hr},${hg},${hb},${0.2*alpha*twinkle})`);
    halo.addColorStop(1,'transparent');
    x.fillStyle=halo;
    x.beginPath();x.arc(n.x,n.y,haloR,0,Math.PI*2);x.fill();
    // bright white core
    const core = x.createRadialGradient(n.x,n.y,0,n.x,n.y,starR);
    core.addColorStop(0,`rgba(255,255,255,${alpha*twinkle})`);
    core.addColorStop(0.5,`rgba(${Math.min(255,hr+80)},${Math.min(255,hg+80)},${Math.min(255,hb+80)},${alpha*twinkle*0.8})`);
    core.addColorStop(1,'transparent');
    x.fillStyle=core;
    x.beginPath();x.arc(n.x,n.y,starR,0,Math.PI*2);x.fill();
    // 4-point star spikes
    const spikeLen = starR*3*twinkle;
    x.strokeStyle=`rgba(255,255,255,${0.5*alpha*twinkle})`;
    x.lineWidth=0.8;
    x.beginPath();
    x.moveTo(n.x-spikeLen,n.y);x.lineTo(n.x+spikeLen,n.y);
    x.moveTo(n.x,n.y-spikeLen);x.lineTo(n.x,n.y+spikeLen);
    x.stroke();
    // label (smaller, dimmer)
    if(!filtered||isH){x.fillStyle=`rgba(255,255,255,${filtered?0.15:0.5})`;x.font='9px -apple-system,sans-serif';x.textAlign='center';x.fillText(n.n,n.x,n.y+starR*2+10);}
    x.restore();
    return;
  }

  // === LARGE NODES → PLANETS ===
  // Alert glow
  if(n.glow>0.01){const gr=pr*(2.5+n.glow*2);const g=x.createRadialGradient(n.x,n.y,pr*0.5,n.x,n.y,gr);g.addColorStop(0,n.n===alertSrc?`rgba(251,191,36,${n.glow*0.5})`:`rgba(77,166,255,${n.glow*0.4})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(n.x,n.y,gr,0,Math.PI*2);x.fill();}

  // === TEXTURED PLANET with rotation + atmosphere ===
  n.rot += n.rotSpeed;

  // Back ring (behind planet)
  if(n.hasRing && !filtered){
    x.save();
    x.translate(n.x, n.y);
    x.rotate(n.ringTilt);
    x.scale(1, 0.18);
    const ringOuter = pr*(1.7+n.ringWidth);
    const ringInner = pr*1.25;
    x.beginPath();
    x.arc(0,0,ringOuter,Math.PI,Math.PI*2);   // back half only
    x.arc(0,0,ringInner,Math.PI*2,Math.PI,true);
    x.closePath();
    const rg = x.createRadialGradient(0,0,ringInner,0,0,ringOuter);
    rg.addColorStop(0,`rgba(${hr},${hg},${hb},0)`);
    rg.addColorStop(0.3,`rgba(${hr},${hg},${hb},0.5)`);
    rg.addColorStop(0.6,`rgba(255,255,255,0.35)`);
    rg.addColorStop(1,`rgba(${hr},${hg},${hb},0)`);
    x.fillStyle = rg;
    x.fill();
    x.restore();
  }

  // Outer atmospheric halo
  if(!filtered && pr>8){
    const haloR = pr*(isS?2.2:isH?1.8:1.5);
    const halo = x.createRadialGradient(n.x,n.y,pr*0.9,n.x,n.y,haloR);
    halo.addColorStop(0,`rgba(${hr},${hg},${hb},${isS?0.35:isH?0.22:0.14})`);
    halo.addColorStop(0.4,`rgba(${hr},${hg},${hb},${isS?0.18:0.08})`);
    halo.addColorStop(1,'transparent');
    x.fillStyle = halo;
    x.beginPath();x.arc(n.x,n.y,haloR,0,Math.PI*2);x.fill();
  }

  // Planet body from texture (with horizontal rotation via offset draws)
  if(n.planetTex){
    x.save();
    x.beginPath();x.arc(n.x,n.y,pr,0,Math.PI*2);x.clip();
    const texSize = pr*2;
    // draw texture — rotation via source-x shift gives longitudinal spin illusion
    // We simply draw full sphere texture; the texture itself was painted spherified so rotation needs shader-style trick.
    // Instead, slightly shift a duplicate band to suggest rotation motion. For now render static + tiny parallax via time.
    x.drawImage(n.planetTex, n.x-pr, n.y-pr, texSize, texSize);
    x.restore();
  } else {
    x.beginPath();x.arc(n.x,n.y,pr,0,Math.PI*2);
    x.fillStyle = col;
    x.fill();
  }

  // Atmosphere rim light (crescent on lit side)
  if(!filtered && pr>10){
    x.save();
    x.beginPath();x.arc(n.x,n.y,pr,0,Math.PI*2);x.clip();
    const rim = x.createRadialGradient(n.x-pr*0.4,n.y-pr*0.4,pr*0.8,n.x,n.y,pr);
    rim.addColorStop(0,'transparent');
    rim.addColorStop(0.85,`rgba(255,255,255,0)`);
    rim.addColorStop(0.97,`rgba(${Math.min(255,hr+120)},${Math.min(255,hg+120)},${Math.min(255,hb+140)},0.45)`);
    rim.addColorStop(1,'transparent');
    x.fillStyle = rim;
    x.fillRect(n.x-pr,n.y-pr,pr*2,pr*2);
    x.restore();
  }

  // Selection/hover glow (outer shadow)
  if(isS || isH){
    x.save();
    x.shadowColor = col;
    x.shadowBlur = isS?40:22;
    x.strokeStyle = `rgba(${Math.min(255,hr+80)},${Math.min(255,hg+80)},${Math.min(255,hb+80)},${isS?0.9:0.6})`;
    x.lineWidth = isS?2:1.5;
    x.beginPath();x.arc(n.x,n.y,pr+2,0,Math.PI*2);x.stroke();
    x.restore();
  }

  // Front ring (in front of planet)
  if(n.hasRing && !filtered){
    x.save();
    x.translate(n.x, n.y);
    x.rotate(n.ringTilt);
    x.scale(1, 0.18);
    const ringOuter = pr*(1.7+n.ringWidth);
    const ringInner = pr*1.25;
    x.beginPath();
    x.arc(0,0,ringOuter,0,Math.PI);
    x.arc(0,0,ringInner,Math.PI,0,true);
    x.closePath();
    const rg = x.createRadialGradient(0,0,ringInner,0,0,ringOuter);
    rg.addColorStop(0,`rgba(${hr},${hg},${hb},0)`);
    rg.addColorStop(0.3,`rgba(${hr},${hg},${hb},0.6)`);
    rg.addColorStop(0.6,`rgba(255,255,255,0.5)`);
    rg.addColorStop(1,`rgba(${hr},${hg},${hb},0)`);
    x.fillStyle = rg;
    x.fill();
    x.restore();
  }

  // Moon
  if(n.hasMoon && !filtered && pr>10){
    n.moonAngle += n.moonSpeed;
    const mx0 = n.x + Math.cos(n.moonAngle)*pr*n.moonDist;
    const my0 = n.y + Math.sin(n.moonAngle)*pr*n.moonDist*0.35;
    const mr = pr*0.18;
    const mg = x.createRadialGradient(mx0-mr*0.3, my0-mr*0.3, 0, mx0, my0, mr);
    mg.addColorStop(0,'#dfd9c8');
    mg.addColorStop(1,'#4a4638');
    x.fillStyle = mg;
    x.beginPath();x.arc(mx0,my0,mr,0,Math.PI*2);x.fill();
  }

  // EQS arc (analyze mode)
  if(!filtered&&pr>10&&currentMode==='analyze'){const ec=n.eqs>=70?'#4ade80':n.eqs>=50?'#fbbf24':'#f87171';x.beginPath();x.arc(n.x,n.y,pr+5,-(Math.PI/2),-(Math.PI/2)+(Math.PI*2*n.eqs/100));x.strokeStyle=ec+'88';x.lineWidth=2;x.stroke();}

  // Mode-specific labels
  if(currentMode==='timemachine'&&n.tm&&!filtered){x.fillStyle='rgba(124,108,240,0.9)';x.font='bold 9px -apple-system,sans-serif';x.textAlign='center';x.fillText('⏰ 타임머신',n.x,n.y-pr-10);}
  if(n.glow>0.3&&n.n!==alertSrc&&!filtered&&currentMode==='disclosure'){const imp=edges.some(e=>(e.a.n===alertSrc&&e.b.n===n.n&&(e.type==='공급'||e.type==='종속'||e.type==='피인수'))||(e.b.n===alertSrc&&e.a.n===n.n&&(e.type==='공급'||e.type==='종속'||e.type==='피인수')))?'↑ 수혜 예상':edges.some(e=>(e.a.n===alertSrc&&e.b.n===n.n&&e.type==='경쟁')||(e.b.n===alertSrc&&e.a.n===n.n&&e.type==='경쟁'))?'↓ 경쟁 압박':'● 영향권';x.fillStyle=imp.includes('수혜')?'rgba(74,222,128,0.9)':imp.includes('경쟁')?'rgba(248,113,113,0.9)':'rgba(77,166,255,0.9)';x.font='bold 9px -apple-system,sans-serif';x.textAlign='center';x.fillText(imp,n.x,n.y-pr-10);}

  // Name label
  if(!filtered||isH){x.fillStyle=`rgba(255,255,255,${filtered?0.2:0.85})`;x.font=`${n.sz>2?'12':'10'}px -apple-system,sans-serif`;x.textAlign='center';x.fillText(n.n,n.x,n.y+pr+16);}
  x.restore();  // selFaded 처리용 globalAlpha 복원
});

// === MASCOT (cat sprite) ===
if(mascot.targetNode===null||mascot.progress>=1){mascot.waitTimer+=0.016;if(mascot.waitTimer>1.8){mascot.waitTimer=0;pickNextNode();}}
if(mascot.targetNode&&mascot.progress<1){
  mascot.progress=Math.min(1,mascot.progress+0.010);
  const t=mascot.progress;
  const ease=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const prevNode=mascot.prevNode||mascot.targetNode;
  const prevX=prevNode.x, prevY=prevNode.y-prevNode.sz*18;
  const tgtX=mascot.targetNode.x, tgtY=mascot.targetNode.y-mascot.targetNode.sz*18;
  mascot.x=prevX+(tgtX-prevX)*ease;
  mascot.y=prevY+(tgtY-prevY)*ease;
  // parabolic hop arc
  const arcH = 60 + Math.hypot(tgtX-prevX, tgtY-prevY)*0.25;
  mascot.bounceY = Math.sin(t*Math.PI)*arcH;
  mascot.airborne = Math.sin(t*Math.PI);
  mascot.facing = (tgtX>=prevX)?1:-1;
  if(Math.random()<0.25)mascot.trail.push({x:mascot.x,y:mascot.y-mascot.bounceY+8,alpha:0.5,s:5+Math.random()*4});
}else if(mascot.targetNode){
  mascot.x=mascot.targetNode.x;mascot.y=mascot.targetNode.y-mascot.targetNode.sz*18;
  mascot.bouncePhase+=0.05;
  mascot.bounceY=Math.abs(Math.sin(mascot.bouncePhase))*4;
  mascot.airborne=0;
}
// trail (dust puffs)
mascot.trail=mascot.trail.filter(p=>{p.alpha-=0.018;p.s*=0.96;if(p.alpha<=0)return false;x.beginPath();x.arc(p.x,p.y,p.s,0,Math.PI*2);x.fillStyle=`rgba(255,220,180,${p.alpha*0.35})`;x.fill();return true;});

// Pick sprite pose based on hop progress
let pose='idle';
if(mascot.targetNode && mascot.progress<1){
  const t=mascot.progress;
  if(t<0.08) pose='crouch';
  else if(t<0.22) pose='launch';
  else if(t<0.78) pose='midair';
  else if(t<0.92) pose='land';
  else pose='idle';
}
const sprite = catSprites[pose];
// shadow on ground (follows planet top) — scales with world zoom
const gx=mascot.x, gy = mascot.y + 6;
x.save();
x.beginPath();x.ellipse(gx,gy,16*(1-mascot.airborne*0.4),5*(1-mascot.airborne*0.4),0,0,Math.PI*2);
x.fillStyle=`rgba(0,0,0,${0.35*(1-mascot.airborne*0.5)})`;x.fill();
x.restore();
// draw cat — scales with zoom (part of the scene)
const catSize = 56;
x.save();
x.translate(mascot.x, mascot.y - mascot.bounceY);
x.scale(mascot.facing, 1);
// slight forward lean during hop
if(mascot.targetNode && mascot.progress<1){
  const t=mascot.progress;
  x.rotate(Math.sin(t*Math.PI)*0.15 * (t<0.5?-1:1));
}
x.drawImage(sprite, -catSize/2, -catSize*0.7, catSize, catSize);
x.restore();

// Update prevNode for next hop
if(mascot.progress>=1&&mascot.targetNode){mascot.prevNode=mascot.targetNode;}

x.restore();physics();requestAnimationFrame(draw);}

// ===== INTERACTION =====
c.addEventListener('mousemove',e=>{if(drag){camX=cs.x+(e.clientX-ds.x);camY=cs.y+(e.clientY-ds.y);return;}const mx=(e.clientX-camX)/zm,my=(e.clientY-camY)/zm;hov=null;nodes.forEach(n=>{const dx=n.x-mx,dy=n.y-my;if(Math.sqrt(dx*dx+dy*dy)<n.sz*22){hov=n;c.style.cursor='pointer';}});if(!hov)c.style.cursor='grab';});
c.addEventListener('mousedown',e=>{const mx=(e.clientX-camX)/zm,my=(e.clientY-camY)/zm;let clicked=null;nodes.forEach(n=>{const dx=n.x-mx,dy=n.y-my;if(Math.sqrt(dx*dx+dy*dy)<n.sz*22)clicked=n;});if(clicked){sel=clicked;if(currentMode==='analyze')showAnalyze(clicked);else if(currentMode==='disclosure')showDisclosure(clicked);else showTimemachine(clicked);}else{sel=null;closePanel();drag=true;ds={x:e.clientX,y:e.clientY};cs={x:camX,y:camY};c.style.cursor='grabbing';}});
// ESC 키로 선택 해제
document.addEventListener('keydown',e=>{if(e.key==='Escape'){sel=null;closePanel();}});
c.addEventListener('mouseup',()=>{drag=false;c.style.cursor='grab';});
c.addEventListener('wheel',e=>{const d=e.deltaY>0?0.9:1.1;const mx=e.clientX,my=e.clientY;const wx=(mx-camX)/zm,wy=(my-camY)/zm;zm=Math.max(0.2,Math.min(4,zm*d));camX=mx-wx*zm;camY=my-wy*zm;e.preventDefault();},{passive:false});

function closePanel(){document.getElementById('panel').classList.remove('open');sel=null;}
function filter(f,btn){flt=f;document.querySelectorAll('.hud-sub button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}
function simAlert(){alertOn=true;alertSrc='삼성전자';document.getElementById('alert').classList.add('show');const src=nodes.find(n=>n.n==='삼성전자');if(src)for(let i=0;i<3;i++)setTimeout(()=>ripples.push({x:src.x,y:src.y,radius:src.sz*18,alpha:0.6}),i*400);setTimeout(()=>{alertOn=false;alertSrc=null;},10000);}

// ===== PANEL: ANALYZE =====
// 풀스크린 단독 분석 오버레이 — firm_<ticker>.html 로드.
// docs/prototype/firm_<ticker>.html은 batch 단계에서 47개 기업분 사전 생성됨.
// 자체완결형(데이터 인라인)이라 file:// 환경에서도 그대로 동작.
function openFullAnalysis(n) {
  const ticker = n.t;
  if (!ticker) return false;
  const url = `../../docs/prototype/firm_${ticker}.html`;
  const overlay = document.getElementById('fullAnalysis');
  const frame = document.getElementById('fullAnalysisFrame');
  const title = document.getElementById('fullAnalysisTitle');
  if (!overlay || !frame) return false;
  title.textContent = `${n.n} (${ticker})`;
  frame.src = url;
  overlay.style.display = 'block';
  // ESC로 닫기
  document.addEventListener('keydown', _fullAnalysisEsc);
  return true;
}
function closeFullAnalysis() {
  const overlay = document.getElementById('fullAnalysis');
  const frame = document.getElementById('fullAnalysisFrame');
  if (overlay) overlay.style.display = 'none';
  if (frame) frame.src = 'about:blank';  // iframe 메모리 해제
  document.removeEventListener('keydown', _fullAnalysisEsc);
}
function _fullAnalysisEsc(e) {
  if (e.key === 'Escape') closeFullAnalysis();
}

function showAnalyze(n) {
  window.__lastShownNode = n;  // 쉬운말 모드 토글 시 재렌더용
  // 우선 풀스크린 오버레이 시도 (단독 분석 페이지) — 실패 시 기존 우측 패널 fallback
  if (openFullAnalysis(n)) return;
  const p = document.getElementById('panel');
  const eqsCol=n.eqs>=70?'#4ade80':n.eqs>=50?'#fbbf24':'#f87171';
  const oiSign=String(n.oi).startsWith('-');
  const easy = _isEasyMode();
  const easyLine = (key) => easy ? `<div style="font-size:11px;color:#9ca3af;font-style:italic;margin:4px 0 -2px 2px;line-height:1.45">${EASY_NOTES[key]}</div>` : '';
  const val = _calcValuation(n);
  // 색상은 중립톤 — 적정 PER/PBR은 업종마다 크게 다르므로 단정적 색깔(저평가/고평가) 회피.
  const valCol = '#cbd5e1';
  // 일반 해석 — 절대 기준 대신 "이 숫자가 무엇을 의미하는가"만 안내.
  const perTip = val.per == null
    ? '순이익이 음수(적자)거나 데이터 부족 — PER 계산 의미 없음'
    : '순이익 대비 시장 가격의 배수. 높을수록 시장이 미래 성장을 더 크게 기대한다는 뜻 (업종마다 통상 수준 다름).';
  const pbrTip = val.pbr == null
    ? '데이터 부족'
    : '자본총계(주주 몫) 대비 시장 가격의 배수. 1배 = 청산가치 수준. 업종 자산 구조에 따라 통상 범위 다름.';
  const roeTip = val.roe == null

// 공시 summary 전문 토글 (showDisclosure 카드에서 호출됨)
function toggleDiscSummary(cardId) {
  const shortEl = document.getElementById(cardId + '-short');
  const fullEl = document.getElementById(cardId + '-full');
  const btn = document.getElementById(cardId + '-btn');
  if (!shortEl || !fullEl || !btn) return;
  const expanded = fullEl.style.display !== 'none';
  if (expanded) {
    fullEl.style.display = 'none';
    shortEl.style.display = 'block';
    btn.textContent = '더보기 ▾';
  } else {
    fullEl.style.display = 'block';
    shortEl.style.display = 'none';
    btn.textContent = '접기 ▴';
  }
}

// ===== PANEL: DISCLOSURE (실데이터 기반, modules/disclosure/data/disclosure.db 연결) =====
function showDisclosure(n) {
  const p=document.getElementById('panel');
  const rels=edges.filter(e=>e.a.n===n.n||e.b.n===n.n);
  const discList = n.disc || [];
  const stmts = (n.statements || []).slice(0, 4);  // 최근 4분기

  // 공시 카드 리스트 — summary 300자 초과 시 "더보기" 토글로 전문 확인
  const discCardsHtml = discList.length > 0 ? discList.map((d, idx) => {
    const impactBadge = d.high_impact
      ? '<span style="font-size:9px;padding:2px 6px;border-radius:4px;background:rgba(248,113,113,0.2);color:#f87171;font-weight:600;margin-left:6px">⚠ HIGH IMPACT</span>'
      : '';
    const dilText = d.dilution_ratio != null
      ? `<div style="font-size:10px;color:#fbbf24;margin-top:2px">희석률 ${(d.dilution_ratio*100).toFixed(1)}%</div>`
      : '';
    const summary = d.summary || '';
    const isLong = summary.length > 300;
    const cardId = `disc-card-${idx}`;
    const summaryShort = isLong ? summary.slice(0, 300) + '…' : summary;
    const summaryBlock = summary
      ? (isLong
          ? `<div id="${cardId}-short" style="font-size:10px;color:#888;margin-top:6px;line-height:1.6;white-space:pre-wrap">${summaryShort}</div>
             <div id="${cardId}-full" style="display:none;font-size:10px;color:#888;margin-top:6px;line-height:1.6;white-space:pre-wrap">${summary}</div>
             <button type="button" id="${cardId}-btn"
               onclick="toggleDiscSummary('${cardId}')"
               style="margin-top:6px;padding:3px 10px;font-size:10px;background:rgba(77,166,255,0.12);border:1px solid rgba(77,166,255,0.3);border-radius:5px;color:#4da6ff;cursor:pointer">더보기 ▾</button>`
          : `<div style="font-size:10px;color:#888;margin-top:6px;line-height:1.6;white-space:pre-wrap">${summary}</div>`)
      : '';
    return `
      <div style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 12px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
          <div style="flex:1">
            <div style="font-size:10px;color:#4da6ff;margin-bottom:2px">${d.date || '-'} · ${d.type || '기타'}${impactBadge}</div>
            <div style="font-size:12px;font-weight:600;color:#fff;line-height:1.4">${d.title || ''}</div>
            ${dilText}
          </div>
        </div>
        ${summaryBlock}
      </div>`;
  }).join('') : '<div style="color:#555;font-size:12px;padding:12px 0">공시 데이터 없음 (수집 대상 외 기업)</div>';

  // 분기 재무 추이 (최근 4분기 매출·영업이익·ROE)
  const stmtsHtml = stmts.length > 0 ? `
    <div class="section-title" style="color:#4da6ff">📈 분기 재무 추이 (최근 ${stmts.length}분기)</div>
    <div style="background:rgba(255,255,255,0.02);border-radius:8px;padding:10px">
      <div style="display:grid;grid-template-columns:60px 1fr 1fr 60px;gap:6px;font-size:10px;color:#666;margin-bottom:4px">
        <span>시점</span><span>매출(조)</span><span>영업이익(조)</span><span>ROE%</span>
      </div>
      ${stmts.map(s => `
        <div style="display:grid;grid-template-columns:60px 1fr 1fr 60px;gap:6px;font-size:11px;padding:3px 0;border-top:1px solid rgba(255,255,255,0.04)">
          <span style="color:#ccc">${s.year}Q${s.quarter}</span>
          <span>${s.revenue != null ? (s.revenue/1e12).toFixed(1) : '-'}</span>
          <span style="color:${s.operating_income>=0?'#4ade80':'#f87171'}">${s.operating_income != null ? (s.operating_income/1e12).toFixed(2) : '-'}</span>
          <span>${s.roe != null ? s.roe.toFixed(1) : '-'}</span>
        </div>
      `).join('')}
    </div>
  ` : '';

  document.getElementById('panelInner').innerHTML=`
    <h2 style="color:#fbbf24;font-size:18px">📡 ${n.n} 공시</h2>
    <div style="color:#666;font-size:12px;margin-bottom:12px">${n.t} | ${n.s} | 시총 ${n.mc || '-'}</div>
    <div class="section-title" style="color:#fbbf24">📋 최근 공시 (${discList.length}건)</div>
    ${discCardsHtml}
    ${stmtsHtml}
    <div class="section-title" style="color:#888">🔗 관계 네트워크</div>
    ${rels.map(e=>{const o=e.a.n===n.n?e.b:e.a;return `<span class="tag">${e.type} ${o.n}</span>`;}).join('')||'없음'}
    <div style="font-size:10px;color:#555;margin-top:12px;line-height:1.5;padding:8px;background:rgba(255,255,255,0.02);border-radius:6px">
      데이터 출처: modules/disclosure/data/disclosure.db (최근 공시 최대 5건 + 분기 재무 8분기)<br>
      ⚠ 본 분석은 과거 통계이며 투자 권유가 아닙니다
    </div>`;
  p.classList.add('open');
}

// INIT — relation(base) + financial + disclosure + price (방법 B: 정적 JSON fetch)
// 자세한 경로·스키마 규약: modules/integration/CLAUDE.md
// financial.db의 수치는 억원(= 10^8원) 단위로 저장됨.
// 1조 = 10,000억 → 억원 → 조원 변환은 /10000.
// 삼성전자 revenue=3336059(억) / 10000 ≈ 333.6조 (실제치)
function _trillionFmt(v) {
  if (v === null || v === undefined) return '-';
  return (v / 10000).toFixed(1);
}
// 시총(원 단위) → "1,425.2조" 포맷. financial 담당자의 eqs_data.json 소스 기준.
// 레퍼 docs/prototype/kospi50_ranking.html의 fmtCap과 동일하게 소수점 1자리.
function _marketCapFmt(v) {
  if (v == null) return null;
  return (v / 1e12).toFixed(1) + '조';
}
// EQS 5모듈 점수 기반 해설 자동 생성 (legacy m1t~m5t 대체)
function _eqsBucket(s) {
  if (s >= 75) return 'good';
  if (s >= 50) return 'mid';
  return 'bad';
}
// 시계열 sparkline — 5년 추이를 60×16 SVG로 렌더. 양/음수 모두 0선 기준 정규화.
// values: 억원 단위 숫자 배열 (None은 null로 들어옴 — 점 누락 처리).
// color: 라인 색상. 단년만 있으면 빈 문자열.
function _sparkline(values, color = '#4da6ff') {
  if (!Array.isArray(values)) return '';
  const pts = values.filter(v => v != null && Number.isFinite(v));
  if (pts.length < 2) return '';
  const w = 60, h = 16, pad = 1;
  const min = Math.min(...pts, 0);
  const max = Math.max(...pts, 0);
  const range = (max - min) || 1;
  const xStep = (w - pad * 2) / (values.length - 1);
  const path = values.map((v, i) => {
    if (v == null || !Number.isFinite(v)) return null;
    const x = pad + i * xStep;
    const y = h - pad - ((v - min) / range) * (h - pad * 2);
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).filter(Boolean);
  if (path.length < 2) return '';
  // 마지막 점만 강조
  const last = path[path.length - 1].split(',');
  return `<svg width="${w}" height="${h}" style="vertical-align:middle;margin-left:6px" aria-hidden="true">`
    + `<polyline points="${path.join(' ')}" fill="none" stroke="${color}" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>`
    + `<circle cx="${last[0]}" cy="${last[1]}" r="1.6" fill="${color}"/>`
    + `</svg>`;
}
// 동종업계 백분위 뱃지 — 0~100 점수, 100=업계 1등.
// '업계 상위 X%' (역수로 표시 — 백분위 80 → 상위 20%).
function _percentileBadge(pct, sectorSize) {
  if (pct == null || !Number.isFinite(pct)) return '';
  if (sectorSize != null && sectorSize < 3) return '';  // 표본 부족
  const topPct = Math.max(1, Math.round(100 - pct));
  // 색상: 상위 30% 초록, 70%까지 노랑, 그 외 빨강
  const color = topPct <= 30 ? '#4ade80' : topPct <= 70 ? '#fbbf24' : '#f87171';
  return `<span style="font-size:10px;padding:1px 5px;border-radius:3px;background:${color}20;color:${color};font-weight:500;margin-left:6px" title="동종업계(${sectorSize}개사) 내 백분위">업계 상위 ${topPct}%</span>`;
}
// ④ PER · PBR · ROE 산출 — 시총(원) / 순이익·자본(억원 raw) 기반.
// 1차: financial.db raw 값(정밀도 최상). 2차: legacy 하드코딩(file:// fetch 실패 시).
function _calcValuation(n) {
  let mc = n.market_cap;            // 원 (수치)
  let ni = n.net_income_raw;        // 억원 (raw)
  let eq = n.equity_raw;            // 억원 (raw)
  // Fallback — fetch 실패해서 legacy 하드코딩만 있을 때 (n.mc:"512조", n.ni:"26.4", n.eq:"362")
  if (mc == null && typeof n.mc === 'string' && n.mc !== '-') {
    const m = n.mc.match(/([0-9.]+)/);
    if (m) mc = parseFloat(m[1]) * 1e12;  // "512조" → 시총 원 단위
  }
  if (ni == null && n.ni != null && n.ni !== '-') {
    const v = parseFloat(n.ni);
    if (!isNaN(v)) ni = v * 10000;  // "26.4"(조) → 264000(억)
  }
  if (eq == null && n.eq != null && n.eq !== '-') {
    const v = parseFloat(n.eq);
    if (!isNaN(v)) eq = v * 10000;  // 362(조) → 3620000(억)
  }
  const out = { per: null, pbr: null, roe: null };
  if (mc != null && ni != null && ni > 0) {
    out.per = +(mc / 1e8 / ni).toFixed(1);  // 시총_억 / 순이익_억
  }
  if (mc != null && eq != null && eq > 0) {
    out.pbr = +(mc / 1e8 / eq).toFixed(2);
  }
  if (ni != null && eq != null && eq > 0) {
    out.roe = +(ni / eq * 100).toFixed(1);
  }
  return out;
}
// ⑤ 쉬운말 모드 — 회계용어를 학생 어휘로 풀어 보여주는 토글.
// 상태는 localStorage 보존 → 새로고침해도 유지.
function _isEasyMode() {
  try { return localStorage.getItem('easyMode') === '1'; } catch (e) { return false; }
}
function _toggleEasyMode() {
  const cur = _isEasyMode();
  try { localStorage.setItem('easyMode', cur ? '0' : '1'); } catch (e) {}
  // 패널이 열려 있으면 마지막 클릭한 회사 다시 렌더
  if (window.__lastShownNode) showAnalyze(window.__lastShownNode);
}
const EASY_NOTES = {
  income:  '쉽게: 회사가 100원어치 팔아서 본업으로 얼마 남기는지 보는 표.',
  balance: '쉽게: 회사가 가진 것(자산)과 갚을 것(부채), 그리고 주주 몫(자본)을 적은 표.',
  cash:    '쉽게: 본업 / 미래 투자 / 빚·배당 — 세 가지로 들어오고 나간 진짜 현금.',
  valuation:'쉽게: 시장이 이 회사 1주를 얼마에 사는지 — 이익·자산 대비 비싼지 싼지.',
  eqs:     '쉽게: "이 회사 이익이 진짜인가?"를 5가지로 나눠 100점 만점으로 채점.',
};
function _eqsNarration(idx, score) {
  const b = _eqsBucket(score);
  const texts = {
    1: { good: '이익이 현금으로 뒷받침됨 — 발생액 품질 양호.',
         mid:  '발생액 정상 범위. 향후 추이 관찰 필요.',
         bad:  '비용 이연 가능성. 발생액 높아 주의 필요.' },
    2: { good: 'M-score 안전 구간 — 분식 징후 낮음.',
         mid:  '분식 확률 중간 구간. 핵심 지표 모니터링 필요.',
         bad:  'M-score 위험 구간 — 회계 투명성 점검 필요.' },
    3: { good: 'OCF/NI 양호 — 영업이익이 실제 현금으로 유입.',
         mid:  '현금흐름 다소 괴리. 매출채권·재고자산 증감 확인.',
         bad:  '영업이익 대비 현금흐름 낮음 — 현금 창출력 점검.' },
    4: { good: '이익 추이 안정적 — 지속 가능성 높음.',
         mid:  '이익 변동성 중간 — 업황 의존 구간.',
         bad:  '이익 변동 심함 — 일회성·업황 영향 검토.' },
    5: { good: 'Piotroski F-score 양호 — 재무 건전성 우수.',
         mid:  '재무 건전성 보통. 일부 지표 개선 필요.',
         bad:  'F-score 낮음 — 재무 악화 신호 다수.' },
  };
  return texts[idx][b];
}
(async () => {
  // 1) relation graph — 필수 (없으면 legacy fallback)
  let relData;
  try {
    const r = await fetch('../relation/data/graph_top50.json');
    if (!r.ok) throw new Error('no remote');
    relData = await r.json();
  } catch (e) {
    console.warn('[Integration] relation fetch 실패, legacy fallback 사용:', e);
    relData = _LEGACY_HARDCODED_RAW;
  }

  // 2) financial / disclosure / price — graceful degrade (하나 실패해도 나머지 로드)
  const [eqsPayload, discPayload, pricePayload] = await Promise.all([
    fetch('./data/eqs_summary.json').then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('./data/disclosures.json').then(r => r.ok ? r.json() : null).catch(() => null),
    fetch('./data/price_scenarios.json').then(r => r.ok ? r.json() : null).catch(() => null),
  ]);

  // 3) ticker 기준 인덱스 구성
  const eqsByTicker = Object.fromEntries(((eqsPayload && eqsPayload.data) || []).map(d => [d.ticker, d]));
  const discByTicker = {};
  ((discPayload && discPayload.disclosures) || []).forEach(d => {
    if (!d.ticker) return;
    (discByTicker[d.ticker] = discByTicker[d.ticker] || []).push(d);
  });
  const stmtByTicker = {};
  ((discPayload && discPayload.statements) || []).forEach(s => {
    if (!s.ticker) return;
    (stmtByTicker[s.ticker] = stmtByTicker[s.ticker] || []).push(s);
  });
  const scenarioByTicker = Object.fromEntries(((pricePayload && pricePayload.data) || []).map(s => [s.ticker, s]));

  // 4) relation 노드에 실데이터 주입 (기존 show* 함수 구조와 호환되는 필드명 유지)
  relData.forEach(n => {
    const t = n.t;
    const fin = eqsByTicker[t];
    if (fin) {
      n.has_financial = true;
      // 프로토타입 메타 (extract_data.py가 eqs_data.json에서 보강)
      n.market_cap = fin.market_cap ?? null;          // 원 단위, null 가능
      n.dart_url = fin.dart_url ?? null;               // DART 사업보고서
      n.industry_code = fin.industry_code ?? null;
      n.is_financial_biz = fin.is_financial === true;  // 금융업(064/066/067)
      n.latest_year = fin.latest_year ?? null;         // 분석 기준 연도
      n.eqs = Math.round(fin.eqs_total || 0);
      n.gr = fin.eqs_grade || '-';
      n.m1 = Math.round(fin.eqs_m1 || 0);
      n.m2 = Math.round(fin.eqs_m2 || 0);
      n.m3 = Math.round(fin.eqs_m3 || 0);
      n.m4 = Math.round(fin.eqs_m4 || 0);
      n.m5 = Math.round(fin.eqs_m5 || 0);
      n.m1t = _eqsNarration(1, n.m1);
      n.m2t = _eqsNarration(2, n.m2);
      n.m3t = _eqsNarration(3, n.m3);
      n.m4t = _eqsNarration(4, n.m4);
      n.m5t = _eqsNarration(5, n.m5);
      n.rv = _trillionFmt(fin.revenue);
      n.oi = _trillionFmt(fin.operating_income);
      n.ni = _trillionFmt(fin.net_income);
      // 자산·부채·자본도 억→조 변환 (/10000)
      n.ta = fin.total_assets != null ? Math.round(fin.total_assets / 10000) : '-';
      n.tl = fin.total_liabilities != null ? Math.round(fin.total_liabilities / 10000) : '-';
      n.eq = fin.total_equity != null ? Math.round(fin.total_equity / 10000) : '-';
      // 부채비율 = 총부채 / 자본총계 × 100 (K-IFRS·DART 실무 기준)
      // 자본총계가 0이거나 null이면 계산 불가 → null
      n.dr = (fin.total_equity && fin.total_equity > 0 && fin.total_liabilities != null)
        ? Math.round(fin.total_liabilities / fin.total_equity * 100)
        : null;
      n.ocf = _trillionFmt(fin.operating_cashflow);
      n.icf = _trillionFmt(fin.investing_cashflow);
      n.fcf = _trillionFmt(fin.financing_cashflow);
      n.oim = (fin.revenue && fin.operating_income != null)
        ? (fin.operating_income / fin.revenue * 100).toFixed(1)
        : null;
      // 시계열(sparkline) + 동종업계 백분위 (financial 모듈에서 산출)
      n.history = fin.history || null;
      n.percentile = fin.percentile || null;
      // PER·PBR·ROE 산출용 원본 값 (억원 raw) — _trillionFmt 반올림 손실 회피
      n.net_income_raw = fin.net_income;       // 억원
      n.equity_raw = fin.total_equity;          // 억원
    } else {
      n.has_financial = false;
    }

    const recentDisc = discByTicker[t] || [];
    n.has_disclosure = recentDisc.length > 0;
    n.disc = recentDisc.slice(0, 3).map(d => ({
      title: d.title || '',
      date: d.disclosure_date || '',
      type: d.disclosure_type || '',
      summary: d.summary || '',
      high_impact: !!d.high_impact,
      dilution_ratio: d.dilution_ratio,
      impacts: [],
    }));
    n.statements = stmtByTicker[t] || [];

    const sc = scenarioByTicker[t];
    n.has_quiz = !!sc;
    if (sc) {
      n.tm = {
        date: sc.date || '',
        category: sc.category || '',
        disclosure: sc.title || '',
        context: sc.context || '',
        refUrl: sc.refUrl || '',  // extract_data.py에서 자동 생성한 네이버 뉴스 검색 URL
        news: [],
        answer: {
          stock_chg: (sc.change_pct >= 0 ? '+' : '') + sc.change_pct + '%',
          kospi_chg: sc.kospi_change_pct,
          window: sc.window || '',
          supply: [],
          lesson: sc.explanation || '',
          eqs_hint: '',
        },
      };
    }
  });

  raw = relData;

  // 5) 로드 요약 (디버깅)
  console.log('[Integration] data loaded:', {
    nodes: raw.length,
    financial_covered: raw.filter(n => n.has_financial).length,
    disclosure_covered: raw.filter(n => n.has_disclosure).length,
    timemachine_covered: raw.filter(n => n.has_quiz).length,
  });

  init();
  draw();
  setMode('analyze', document.querySelector('[data-mode="analyze"]'));
  window._debug = { getNode: (name) => nodes.find(n => n.n === name) };
})();
</script>
