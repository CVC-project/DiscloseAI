  <!-- React 18 + Babel in-browser. v2 prototype과 동일 스택.

  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

       각 IIFE가 window.DiscloseAI에 함수·상수를 export.
       ?v= 파라미터는 dev cache-bust용 (수정 후 새로고침). -->
  <script src="./data/mock.js?v=j5"></script>
  <script src="./data/valuation.js?v=j5"></script>
  <script src="./data/narration.js?v=j5"></script>
  <script src="./data/loader.js?v=j5"></script>

  <script type="text/babel" data-presets="env,react" src="./app.jsx?v=j5"></script>
