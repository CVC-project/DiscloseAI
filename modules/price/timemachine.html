<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공시 시간여행 — DiscloseAI</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --bg:#0a0e1a;--bg2:#0f1523;--card:#141d30;--border:#1e2d4a;
      --blue:#3b82f6;--blue2:#60a5fa;--indigo:#6366f1;
      --text:#e2e8f0;--muted:#64748b;--green:#22c55e;--red:#ef4444;--yellow:#fbbf24;
    }
    body{background:var(--bg);color:var(--text);font-family:'Apple SD Gothic Neo',sans-serif;min-height:100vh;overflow-x:hidden;}

    .screen{display:none;min-height:100vh;}
    .screen.active{display:flex;flex-direction:column;}

    /* ── INTRO ── */
    #s-intro{align-items:center;justify-content:center;text-align:center;padding:48px 24px;
      background:radial-gradient(ellipse at 50% 25%,#0d1f40 0%,var(--bg) 65%);}
    .clock{font-size:56px;margin-bottom:20px;animation:float 3s ease-in-out infinite;}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
    #s-intro h1{font-size:2.1rem;font-weight:800;margin-bottom:10px;}
    #s-intro h1 span{background:linear-gradient(90deg,#3b82f6,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
    #s-intro .sub{color:var(--muted);font-size:0.93rem;line-height:1.75;max-width:440px;margin:0 auto 32px;}
    .btn-primary{background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;
      padding:14px 38px;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer;transition:.2s;}
    .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(99,102,241,.4);}
    .feats{display:flex;gap:16px;margin-top:44px;flex-wrap:wrap;justify-content:center;}
    .feat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px;
      font-size:0.82rem;color:var(--muted);max-width:148px;text-align:center;}
    .feat .fi{font-size:1.4rem;margin-bottom:6px;}
    .feat strong{display:block;color:var(--text);font-size:0.85rem;margin-bottom:3px;}

    /* ── SELECT ── */
    #s-select{padding:36px 24px;max-width:820px;margin:0 auto;width:100%;}
    #s-select h2{font-size:1.35rem;font-weight:700;margin-bottom:6px;}
    #s-select p{color:var(--muted);font-size:0.86rem;margin-bottom:24px;}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;}
    .sc-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;cursor:pointer;transition:.2s;}
    .sc-card:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 8px 24px rgba(59,130,246,.15);}
    .sc-meta{display:flex;gap:7px;margin-bottom:11px;flex-wrap:wrap;}
    .tag{padding:3px 9px;border-radius:999px;font-size:0.71rem;font-weight:600;}
    .t-era{background:#1e3a5f;color:#60a5fa;}
    .t-cat{background:#2d1b4e;color:#a78bfa;}
    .t-easy{background:#1a3a2a;color:#4ade80;}
    .t-mid{background:#3a2a0e;color:#fbbf24;}
    .t-hard{background:#3a0e0e;color:#f87171;}
    .sc-co{font-size:1rem;font-weight:700;margin-bottom:4px;}
    .sc-desc{font-size:0.81rem;color:var(--muted);line-height:1.5;}
    .sc-arrow{text-align:right;color:var(--blue2);font-size:0.82rem;margin-top:10px;}

    /* ── CHAT ── */
    #s-chat{height:100vh;max-width:720px;margin:0 auto;width:100%;}
    .chat-hdr{background:var(--bg2);border-bottom:1px solid var(--border);padding:12px 18px;
      display:flex;align-items:center;gap:12px;flex-shrink:0;}
    .btn-back{background:none;border:1px solid var(--border);color:var(--muted);
      padding:5px 11px;border-radius:8px;cursor:pointer;font-size:0.8rem;}
    .btn-back:hover{color:var(--text);}
    .hdr-info{flex:1;}
    .hdr-co{font-weight:700;font-size:0.93rem;}
    .hdr-era{font-size:0.76rem;color:var(--muted);}
    .turn-badge{background:var(--border);padding:4px 11px;border-radius:999px;font-size:0.74rem;color:var(--muted);white-space:nowrap;}
    .prog-bar{height:3px;background:var(--border);flex-shrink:0;}
    .prog-fill{height:100%;background:linear-gradient(90deg,#3b82f6,#6366f1);transition:width .5s ease;}
    .chat-msgs{flex:1;overflow-y:auto;padding:20px 18px;display:flex;flex-direction:column;gap:14px;}

    .msg-ai{display:flex;gap:10px;max-width:92%;}
    .ai-av{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#3b82f6,#6366f1);
      display:flex;align-items:center;justify-content:center;font-size:.9rem;flex-shrink:0;margin-top:2px;}
    .ai-bub{background:var(--card);border:1px solid var(--border);border-radius:4px 14px 14px 14px;
      padding:13px 15px;font-size:0.875rem;line-height:1.78;white-space:pre-wrap;cursor:pointer;}
    .ai-bub.skip-hint{position:relative;}
    .ai-bub.skip-hint::after{content:'탭하면 빠르게 보기';position:absolute;bottom:6px;right:10px;
      font-size:0.64rem;color:var(--muted);opacity:.6;}

    .msg-user{display:flex;justify-content:flex-end;}
    .usr-bub{background:linear-gradient(135deg,#1e3a5f,#1e2d5f);border:1px solid #2d4a7f;
      border-radius:14px 4px 14px 14px;padding:11px 15px;font-size:0.875rem;max-width:80%;word-break:break-all;}

    .typing-wrap{display:flex;gap:10px;}
    .typing-bub{background:var(--card);border:1px solid var(--border);border-radius:4px 14px 14px 14px;
      padding:13px 15px;display:flex;gap:5px;align-items:center;}
    .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite ease-in-out;}
    .dot:nth-child(2){animation-delay:.2s;}.dot:nth-child(3){animation-delay:.4s;}
    @keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-8px)}}

    /* ── INPUT AREA ── */
    .input-area{flex-shrink:0;border-top:1px solid var(--border);background:var(--bg2);padding:10px 14px 12px;}
    .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;}
    .chip{background:var(--card);border:1px solid var(--border);color:var(--text);
      padding:5px 13px;border-radius:999px;cursor:pointer;font-size:0.78rem;font-weight:600;transition:.15s;white-space:nowrap;}
    .chip:hover{border-color:var(--blue);color:var(--blue2);}
    .chips-label{font-size:0.71rem;color:var(--muted);margin-bottom:5px;}
    .input-row{display:flex;gap:8px;align-items:flex-end;}
    .chat-input{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);
      border-radius:10px;padding:10px 13px;font-size:0.875rem;resize:none;outline:none;
      font-family:inherit;line-height:1.5;max-height:100px;min-height:42px;}
    .chat-input:focus{border-color:var(--blue);}
    .chat-input::placeholder{color:var(--muted);}
    .chat-input:disabled{opacity:.4;cursor:default;}
    .send-btn{background:linear-gradient(135deg,#3b82f6,#6366f1);border:none;color:#fff;
      width:42px;height:42px;border-radius:10px;cursor:pointer;font-size:1rem;transition:.15s;flex-shrink:0;}
    .send-btn:hover:not(:disabled){opacity:.85;}
    .send-btn:disabled{opacity:.3;cursor:default;}
    .action-row{display:flex;gap:8px;margin-top:8px;}
    .btn-hint{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);
      padding:8px;border-radius:8px;cursor:pointer;font-size:0.8rem;font-weight:600;transition:.15s;}
    .btn-hint:hover:not(:disabled){border-color:var(--blue);color:var(--blue2);}
    .btn-hint:disabled{opacity:.4;cursor:default;}
    .btn-reveal{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);
      padding:8px;border-radius:8px;cursor:pointer;font-size:0.8rem;font-weight:600;transition:.15s;}
    .btn-reveal:hover{border-color:var(--green);color:var(--green);}

    /* ── RESULT ── */
    #s-result{align-items:center;padding:40px 24px;text-align:center;}
    .res-wrap{max-width:480px;width:100%;}
    .res-emoji{font-size:48px;margin-bottom:12px;}
    .res-title{font-size:1.4rem;font-weight:800;margin-bottom:6px;}
    .res-sub{color:var(--muted);font-size:0.86rem;margin-bottom:24px;}
    .stat-box{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:18px;}
    .stat-row{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);}
    .stat-row:last-child{border-bottom:none;}
    .stat-lbl{font-size:0.81rem;color:var(--muted);}
    .stat-val{font-weight:700;font-size:0.93rem;}
    .vg{color:var(--green);}.vr{color:var(--red);}.vb{color:var(--blue2);}
    .big-num{font-size:3.2rem;font-weight:900;margin:10px 0 4px;}
    .big-sub{font-size:0.76rem;color:var(--muted);margin-bottom:20px;}
    .insight-box{background:#0d1f3a;border:1px solid #1e3a5f;border-radius:12px;padding:18px 20px;margin-bottom:16px;text-align:left;}
    .insight-box h4{font-size:0.79rem;color:var(--blue2);font-weight:700;margin-bottom:8px;}
    .insight-box p{font-size:0.84rem;line-height:1.72;}
    .lesson-box{background:#191900;border:1px solid #333300;border-radius:12px;padding:16px 18px;margin-bottom:22px;text-align:left;}
    .lesson-box h4{font-size:0.77rem;color:var(--yellow);font-weight:700;margin-bottom:6px;}
    .lesson-box p{font-size:0.82rem;line-height:1.68;color:#e2d590;}
    .res-btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;}
    .btn-sec{background:var(--card);border:1px solid var(--border);color:var(--text);
      padding:10px 22px;border-radius:10px;cursor:pointer;font-size:0.86rem;font-weight:600;transition:.15s;}
    .btn-sec:hover{border-color:var(--blue);color:var(--blue2);}

    ::-webkit-scrollbar{width:4px;}
    ::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
  </style>
</head>
<body>

<!-- INTRO -->
<div class="screen active" id="s-intro">
  <div class="clock">⏰</div>
  <h1>공시 <span>시간여행</span></h1>
  <p class="sub">실제 공시가 나온 그날로 돌아갑니다.<br>당신이 그 투자자였다면 어떻게 했을까요?<br>AI와 대화하며 의사결정을 시뮬레이션해보세요.</p>
  <button class="btn-primary" onclick="showSelect()">시작하기 →</button>
  <button id="btn-key" onclick="showKeyModal(false)" style="background:none;border:1px solid var(--border);color:var(--muted);
    padding:8px 18px;border-radius:8px;cursor:pointer;font-size:0.78rem;margin-top:10px;transition:.15s;"
    onmouseover="this.style.color='var(--text)'" onmouseout="this.style.color='var(--muted)'">🔑 API 키 설정</button>
  <div id="key-status" style="font-size:0.72rem;margin-top:6px;"></div>
  <div class="feats">
    <div class="feat"><div class="fi">📊</div><strong>실제 데이터</strong>KRX 검증된 주가 기반</div>
    <div class="feat"><div class="fi">💬</div><strong>자유 대화</strong>Gemini AI와 대화</div>
    <div class="feat"><div class="fi">💡</div><strong>힌트 제공</strong>모르면 AI가 안내</div>
  </div>
</div>

<!-- SELECT -->
<div class="screen" id="s-select">
  <h2>시나리오 선택</h2>
  <p>시나리오를 선택하면 그날로 돌아갑니다</p>
  <div class="grid" id="sc-grid"></div>
</div>

<!-- CHAT -->
<div class="screen" id="s-chat">
  <div class="chat-hdr">
    <button class="btn-back" onclick="showSelect()">← 목록</button>
    <div class="hdr-info">
      <div class="hdr-co" id="h-co"></div>
      <div class="hdr-era" id="h-era"></div>
    </div>
    <div class="turn-badge" id="h-turn">대화 시작</div>
  </div>
  <div class="prog-bar"><div class="prog-fill" id="prog" style="width:0%"></div></div>
  <div class="chat-msgs" id="msgs"></div>
  <div class="input-area" id="input-area" style="display:none">
    <div id="hints-wrap" style="display:none">
      <div class="chips-label">💡 이런 거 물어보세요</div>
      <div class="chips" id="hint-chips"></div>
    </div>
    <div class="input-row">
      <textarea class="chat-input" id="chat-input" rows="1"
        placeholder="공시에 대해 자유롭게 질문해보세요"
        oninput="autoResize(this)"
        onkeydown="handleKey(event)"></textarea>
      <button class="send-btn" id="send-btn" onclick="submitInput()" title="전송">↑</button>
    </div>
    <div class="action-row">
      <button class="btn-hint" id="hint-btn" onclick="fetchHints()">💡 힌트</button>
      <button class="btn-reveal" onclick="confirmResult()">📊 결과 보기</button>
    </div>
  </div>
</div>

<!-- RESULT -->
<div class="screen" id="s-result">
  <div class="res-wrap">
    <div class="res-emoji" id="r-emoji">🎯</div>
    <div class="res-title" id="r-title"></div>
    <div class="res-sub" id="r-sub"></div>
    <div class="stat-box">
      <div class="stat-row"><span class="stat-lbl">종목</span><span class="stat-val" id="r-co"></span></div>
      <div class="stat-row"><span class="stat-lbl">공시일</span><span class="stat-val" id="r-date"></span></div>
      <div class="stat-row"><span class="stat-lbl">내 최종 예측</span><span class="stat-val" id="r-pred"></span></div>
      <div class="stat-row"><span class="stat-lbl">실제 결과</span><span class="stat-val" id="r-ans"></span></div>
    </div>
    <div class="big-num" id="r-num">+0.0%</div>
    <div class="big-sub" id="r-win"></div>
    <div class="insight-box"><h4>💡 당신이 놓쳤을 변수</h4><p id="r-insight"></p></div>
    <div class="lesson-box"><h4>📌 교훈</h4><p id="r-lesson"></p></div>
    <div class="res-btns">
      <button class="btn-sec" onclick="showSelect()">다른 시나리오</button>
      <button class="btn-primary" onclick="replay()">다시 도전</button>
    </div>
  </div>
</div>

<script>
// ── CONFIG ────────────────────────────────────────────────────────────────
const STORAGE_KEY = 'disclose_gemini_key';
let GEMINI_KEY = localStorage.getItem(STORAGE_KEY) || '';
const GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent';

function getKey() { return GEMINI_KEY; }
function saveKey(k) { GEMINI_KEY = k.trim(); localStorage.setItem(STORAGE_KEY, GEMINI_KEY); }

function showKeyModal(onSave) {
  const existing = document.getElementById('key-modal');
  if (existing) existing.remove();
  const m = document.createElement('div');
  m.id = 'key-modal';
  m.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;';
  m.innerHTML = `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;max-width:400px;width:100%;">
      <div style="font-size:1.4rem;margin-bottom:10px;text-align:center;">🔑</div>
      <h3 style="font-size:1rem;font-weight:700;margin-bottom:6px;text-align:center;">Gemini API 키 입력</h3>
      <p style="color:var(--muted);font-size:0.8rem;margin-bottom:16px;text-align:center;line-height:1.6">
        Google AI Studio에서 발급한 API 키를 입력하세요.<br>키는 브라우저에만 저장되며 외부로 전송되지 않습니다.
      </p>
      <input id="key-input" type="password"
        placeholder="AIzaSy..."
        style="width:100%;background:var(--bg2);border:1px solid var(--border);color:var(--text);
               border-radius:8px;padding:10px 12px;font-size:0.875rem;outline:none;margin-bottom:12px;"
        value="${GEMINI_KEY}">
      <div style="display:flex;gap:8px;">
        <button onclick="applyKey()" style="flex:1;background:linear-gradient(135deg,#3b82f6,#6366f1);border:none;color:#fff;
          padding:10px;border-radius:8px;cursor:pointer;font-size:0.875rem;font-weight:600;">저장 후 시작</button>
        ${GEMINI_KEY ? `<button onclick="document.getElementById('key-modal').remove()" style="flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:10px;border-radius:8px;cursor:pointer;font-size:0.875rem;">취소</button>` : ''}
      </div>
      <p style="color:var(--muted);font-size:0.72rem;margin-top:10px;text-align:center">
        <a href="https://aistudio.google.com/app/apikey" target="_blank" rel="noopener" style="color:var(--blue2);">Google AI Studio</a>에서 무료 발급 가능
      </p>
    </div>`;
  document.body.appendChild(m);
  document.getElementById('key-input').focus();
  if (onSave) m.dataset.onSave = 'true';
}

function applyKey() {
  const v = document.getElementById('key-input').value.trim();
  if (!v) { document.getElementById('key-input').style.borderColor = 'var(--red)'; return; }
  saveKey(v);
  document.getElementById('key-modal').remove();
  updateKeyStatus();
  const cb = window._keyModalCb;
  if (cb) { window._keyModalCb = null; cb(); }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && document.getElementById('key-modal')) applyKey();
});

// ── SCENARIOS ─────────────────────────────────────────────────────────────
const SC = [
  {
    id:1, company:"LG화학", ticker:"051910",
    era:"2020년 9월 17일", category:"물적분할", badge:"🧪", diff:"중급",
    desc:"배터리 사업부 물적분할·별도 상장 추진 공시",

    background:"LG화학 배터리 사업부 물적분할로 LG에너지솔루션 설립. 당시 LG화학 주가 약 82만 원, 연초 대비 +290%. 배터리 사업이 시총의 약 65% 차지. 물적분할 후 모회사는 자회사 지분만 보유하는 지주회사 구조로 전환됨. 한국 시장에서 지주회사에는 통상 20~40% 할인 적용.",
    answer:"악재", changePct:-11.2, kospiPct:-6.7, window:"공시 후 5거래일",
    insight:"모회사 디스카운트의 속도. 시장은 배터리가 분리되는 순간 즉시 LG화학에 할인을 적용했습니다. 이후 LG에너지솔루션이 2022년 1월 시총 100조로 상장됐지만, LG화학은 물적분할 전 주가를 회복하지 못했습니다.",

  },
  {
    id:2, company:"SK하이닉스", ticker:"000660",
    era:"2020년 10월 20일", category:"대형M&A", badge:"💾", diff:"고급",

// ── GEMINI RESPONSE HELPER ───────────────────────────────────────────────
function extractText(data){
  const parts = data.candidates?.[0]?.content?.parts || [];
  const textPart = parts.find(p => !p.thought && p.text);
  return textPart?.text || parts.find(p => p.text)?.text || '';
}

// ── PROMPTS ──────────────────────────────────────────────────────────────
function buildSystem(sc){
  return `당신은 '공시 시간여행' 금융 교육 AI입니다.
사용자가 실제 한국 상장사 공시가 있었던 날의 투자자 역할을 체험하고 있습니다.

[시나리오]
종목: ${sc.company} (${sc.ticker})
공시일: ${sc.era}
공시 내용: ${sc.desc}
배경 정보: ${sc.background}

[대화 가이드]
- 사용자의 질문에 관련된 재무 수치, 시장 데이터, 역사적 사례, 업종 맥락을 구체적으로 설명하세요
- 수치, 날짜, 비율, 회사명, 사건명 등 팩트를 적극 활용하세요
- 재무 변수, 시장 컨텍스트, 역사적 선례, 수급 분석, 글로벌 트렌드 등 다양한 각도를 탐구하세요
- 사용자가 이미 언급한 내용은 반복하지 말고 새로운 시각과 정보를 추가하세요
- 실제 결과(${sc.answer}, ${sc.changePct}% 변동)는 절대 사전에 공개하지 마세요
- 투자 조언이 아닌 '과거 통계 기반 학습 시뮬레이션'임을 인지하세요
- 한국어로만 답변하세요
- 이모지는 최대 2개만 사용하세요`;
}

function buildIntro(sc){
  return `${sc.era}, 당신은 ${sc.company} 주주입니다.\n\n📄 공시 알림:\n"${sc.desc}"\n\n${sc.ctx}\n\n이 공시에 대해 자유롭게 질문하거나 의견을 말씀해 주세요.\n💡 힌트 버튼을 누르면 참고 질문을 추천해드립니다.`;
}

// ── STATE ─────────────────────────────────────────────────────────────────
let S = { sc:null, final:null, messages:[], msgCount:0 };
let inputLocked = false;
let typeIv = null;

// ── SCREENS ───────────────────────────────────────────────────────────────
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function showSelect(){
  if (!getKey()) {
    window._keyModalCb = showSelect;
    showKeyModal(true);
    return;
  }
  const grid = document.getElementById('sc-grid');
  grid.innerHTML = SC.map(s=>`
    <div class="sc-card" onclick="startSc(${s.id})">
      <div class="sc-meta">
        <span class="tag t-era">${s.era}</span>
        <span class="tag t-cat">${s.badge} ${s.category}</span>
        <span class="tag t-${s.diff==='초급'?'easy':s.diff==='중급'?'mid':'hard'}">${s.diff}</span>
      </div>
      <div class="sc-co">${s.company}</div>
      <div class="sc-desc">${s.desc}</div>
      <div class="sc-arrow">대화 시작 →</div>
    </div>`).join('');
  showScreen('s-select');
}

// ── CHAT ENGINE ───────────────────────────────────────────────────────────
function startSc(id){
  S = { sc:SC.find(s=>s.id===id), final:null, messages:[], msgCount:0 };
  document.getElementById('h-co').textContent = S.sc.company;
  document.getElementById('h-era').textContent = S.sc.era + ' 투자자로 시간여행';
  document.getElementById('msgs').innerHTML = '';
  document.getElementById('hints-wrap').style.display = 'none';
  document.getElementById('hint-chips').innerHTML = '';
  document.getElementById('input-area').style.display = 'none';
  setProgress(0);
  showScreen('s-chat');
  setTimeout(()=>showTyping(()=>{
    addAI(buildIntro(S.sc), false, ()=>{
      document.getElementById('input-area').style.display = 'block';
      lockInput(false);
      scrollBottom();
    });
  }), 500);
}

function onUserInput(text){
  if(inputLocked || !text.trim()) return;
  document.getElementById('hints-wrap').style.display = 'none';
  document.getElementById('chat-input').value = '';
  document.getElementById('chat-input').style.height = '42px';
  addUser(text);
  S.messages.push({role:'user', content:text});
  S.msgCount++;
  setProgress(S.msgCount);
  fetchAI();
}

async function fetchAI(){
  lockInput(true);
  const msgs = document.getElementById('msgs');
  const typingEl = document.createElement('div');
  typingEl.className = 'typing-wrap';
  typingEl.innerHTML = `<div class="ai-av">🤖</div><div class="typing-bub"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  msgs.appendChild(typingEl);
  scrollBottom();

  let reply = '잠시 연결에 문제가 있어요. 다시 시도해주세요.';

  try {
    const contents = S.messages.map(m=>({
      role: m.role === 'user' ? 'user' : 'model',
      parts:[{text:m.content}]
    }));
    const key = getKey();
    if (!key) {
      typingEl.remove();
      lockInput(false);
      window._keyModalCb = () => fetchAI();
      showKeyModal(true);
      return;
    }
    const res = await fetch(`${GEMINI_URL}?key=${key}`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({
        system_instruction:{parts:[{text:buildSystem(S.sc)}]},
        contents,
        generationConfig:{maxOutputTokens:8192}
      })
    });
    if(res.ok){
      const data = await res.json();
      reply = extractText(data) || '응답을 받지 못했습니다.';
      S.messages.push({role:'assistant', content:reply});
    } else {
      const err = await res.json().catch(()=>({}));
      reply = `오류 (${res.status}): ${err?.error?.message || '알 수 없는 오류'}`;
    }
  } catch(e){ reply = `연결 오류: ${e.message}`; }

  typingEl.remove();
  addAI(reply, true, ()=>lockInput(false));
}

function fetchHints(){
  const hintsWrap = document.getElementById('hints-wrap');
  if(hintsWrap.style.display !== 'none'){ hintsWrap.style.display = 'none'; return; }

  document.getElementById('hint-chips').innerHTML = S.sc.hints.map((h, i)=>
    `<span class="chip" onclick="sendHint(${i})">${h}</span>`
  ).join('');
  hintsWrap.style.display = 'block';
  scrollBottom();
}

function sendHint(i){ onUserInput(S.sc.hints[i]); }

function confirmResult(){
  const modal = document.createElement('div');
  modal.id = 'result-pick-modal';
  modal.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:9999;padding:24px;';
  modal.innerHTML = `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:16px;padding:28px 24px;max-width:360px;width:100%;text-align:center;">
      <div style="font-size:1.6rem;margin-bottom:10px;">🎯</div>
      <h3 style="font-size:1.05rem;font-weight:700;margin-bottom:8px;">최종 예측</h3>
      <p style="color:var(--muted);font-size:0.82rem;margin-bottom:20px;">공시 후 주가 방향을 최종 선택하세요</p>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <button onclick="pickFinal('수혜 예상')" style="background:#1a3a2a;border:1px solid #2d5a3d;color:#4ade80;padding:12px;border-radius:10px;cursor:pointer;font-size:0.9rem;font-weight:600;">📈 수혜 예상 (상승)</button>
        <button onclick="pickFinal('악재 예상')" style="background:#3a1a1a;border:1px solid #5a2d2d;color:#f87171;padding:12px;border-radius:10px;cursor:pointer;font-size:0.9rem;font-weight:600;">📉 악재 예상 (하락)</button>
        <button onclick="pickFinal('중립')" style="background:var(--bg2);border:1px solid var(--border);color:var(--muted);padding:12px;border-radius:10px;cursor:pointer;font-size:0.9rem;">🤔 잘 모르겠습니다</button>
      </div>
      <button onclick="document.getElementById('result-pick-modal').remove()" style="background:none;border:none;color:var(--muted);font-size:0.78rem;cursor:pointer;margin-top:14px;">취소</button>
    </div>`;
  document.body.appendChild(modal);
}

function pickFinal(stance){
  S.final = stance;
  document.getElementById('result-pick-modal')?.remove();
  showResult();
}

// ── INPUT HELPERS ─────────────────────────────────────────────────────────
function lockInput(locked){
  inputLocked = locked;
  document.getElementById('chat-input').disabled = locked;
  document.getElementById('send-btn').disabled = locked;
  if(!locked) setTimeout(()=>document.getElementById('chat-input').focus(), 100);
}

function submitInput(){
  const el = document.getElementById('chat-input');
  const text = el.value.trim();
  if(!text) return;
  onUserInput(text);
}

function handleKey(e){
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); submitInput(); }
}

function autoResize(el){
  el.style.height = '42px';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ── UI HELPERS ────────────────────────────────────────────────────────────
function setProgress(t){
  document.getElementById('h-turn').textContent = t ? `${t}번째 대화` : '대화 시작';
  document.getElementById('prog').style.width = Math.min(t * 10, 100) + '%';
}

function showTyping(cb){
  const msgs = document.getElementById('msgs');
  const el = document.createElement('div');
  el.className = 'typing-wrap';
  el.innerHTML = `<div class="ai-av">🤖</div><div class="typing-bub"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  msgs.appendChild(el);
  scrollBottom();
  setTimeout(()=>{ el.remove(); cb(); }, 800 + Math.random()*500);
}

function addAI(text, skippable, onDone){
  const msgs = document.getElementById('msgs');
  const wrap = document.createElement('div');
  wrap.className = 'msg-ai';
  const bub = document.createElement('div');
  bub.className = 'ai-bub' + (skippable ? ' skip-hint' : '');
  wrap.innerHTML = `<div class="ai-av">🤖</div>`;
  wrap.appendChild(bub);
  msgs.appendChild(wrap);

  let i = 0;
  bub.textContent = '';

  const finish = () => {
    clearInterval(typeIv);
    bub.textContent = text;
    bub.classList.remove('skip-hint');
    bub.onclick = null;
    scrollBottom();
    if(onDone) setTimeout(onDone, 150);
  };

  if(skippable) bub.onclick = finish;

  typeIv = setInterval(()=>{
    bub.textContent += text[i++];
    scrollBottom();
    if(i >= text.length) finish();
  }, 10);
}

function addUser(text){
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'msg-user';
  div.innerHTML = `<div class="usr-bub">${text.replace(/</g,'&lt;')}</div>`;
  msgs.appendChild(div);
  scrollBottom();
}

function scrollBottom(){
  const el = document.getElementById('msgs');
  setTimeout(()=>el.scrollTop = el.scrollHeight, 50);
}

// ── RESULT ────────────────────────────────────────────────────────────────
function showResult(){
  const s = S.sc;
  const correct = (S.final==='수혜 예상' && s.answer==='수혜') ||
                  (S.final==='악재 예상' && s.answer==='악재');
  const neutral = S.final === '중립';

  document.getElementById('r-co').textContent = s.company + ' (' + s.ticker + ')';
  document.getElementById('r-date').textContent = s.era;

  const predEl = document.getElementById('r-pred');
  predEl.textContent = S.final;
  predEl.className = 'stat-val ' + (S.final==='수혜 예상'?'vg':S.final==='악재 예상'?'vr':'vb');

  const ansEl = document.getElementById('r-ans');
  ansEl.textContent = s.answer;
  ansEl.className = 'stat-val ' + (s.answer==='수혜'?'vg':'vr');

  document.getElementById('r-win').textContent = s.window + ' | 코스피 ' + (s.kospiPct>=0?'+':'') + s.kospiPct + '%';
  document.getElementById('r-lesson').textContent = s.lesson;
  document.getElementById('r-insight').textContent = '';

  if(correct){
    document.getElementById('r-emoji').textContent = '🎯';
    document.getElementById('r-title').textContent = '정답! 예리한 분석이었습니다';
    document.getElementById('r-sub').textContent = '실제 결과와 예측이 일치했습니다';
  } else if(neutral){
    document.getElementById('r-emoji').textContent = '🤔';
    document.getElementById('r-title').textContent = '아쉽게 중립으로 마무리';
    document.getElementById('r-sub').textContent = '방향을 잡기 어려우셨군요';
  } else {
    document.getElementById('r-emoji').textContent = '📚';
    document.getElementById('r-title').textContent = '틀렸지만 배움이 있습니다';
    document.getElementById('r-sub').textContent = '대부분의 투자자가 같은 판단을 했습니다';
  }

  showScreen('s-result');

  const numEl = document.getElementById('r-num');
  numEl.className = 'big-num ' + (s.changePct>=0?'vg':'vr');
  animNum(numEl, 0, s.changePct, 1200);
  setTimeout(()=>typeText(document.getElementById('r-insight'), s.insight), 1300);
}

function animNum(el, from, to, dur){
  const t0 = Date.now();
  const tick = ()=>{
    const p = Math.min((Date.now()-t0)/dur, 1);
    const e = 1-Math.pow(1-p, 3);
    const v = from + (to-from)*e;
    el.textContent = (v>=0?'+':'') + v.toFixed(1) + '%';
    if(p < 1) requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
}

function typeText(el, text){
  let i=0; el.textContent='';
  const iv = setInterval(()=>{ el.textContent += text[i++]; if(i>=text.length) clearInterval(iv); }, 14);
}

function replay(){ startSc(S.sc.id); }

function updateKeyStatus(){
  const el = document.getElementById('key-status');
  if (!el) return;
  el.textContent = getKey() ? '✅ API 키 등록됨' : '⚠️ API 키 미설정 — 대화를 시작하면 입력 창이 뜹니다';
  el.style.color = getKey() ? 'var(--green)' : 'var(--yellow)';
}
updateKeyStatus();
