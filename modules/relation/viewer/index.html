<title>공시해부학 - DiscloseAI v4</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060a13;color:#e0e0e0;font-family:-apple-system,'Pretendard',sans-serif;overflow:hidden;user-select:none}
canvas{display:block}

/* Alert */
.alert-banner{position:fixed;top:-80px;left:0;right:0;z-index:100;background:linear-gradient(90deg,rgba(20,40,80,0.96),rgba(30,60,120,0.96));border-bottom:2px solid #4da6ff;padding:14px 24px;display:flex;align-items:center;gap:12px;transition:top 0.6s cubic-bezier(0.16,1,0.3,1)}
.alert-banner.show{top:0}
.alert-dot{width:10px;height:10px;background:#ff4444;border-radius:50%;animation:pulse 1s infinite;flex-shrink:0}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(0.8)}}

/* HUD */
.hud-main{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;align-items:center;gap:6px}
.hud-modes{display:flex;gap:4px;background:rgba(8,12,24,0.95);border:1px solid rgba(255,255,255,0.1);border-radius:10px;padding:5px 8px}
.hud-modes button{background:rgba(255,255,255,0.05);border:1px solid rgba(255,255,255,0.08);color:#777;padding:6px 16px;border-radius:7px;cursor:pointer;font-size:12px;font-weight:500;transition:all 0.25s}
.hud-modes button:hover{background:rgba(255,255,255,0.08);color:#ccc}
.hud-modes button.on{color:#fff;border-color:#4da6ff}
.hud-modes button.on[data-mode="analyze"]{background:rgba(77,166,255,0.2)}
.hud-modes button.on[data-mode="disclosure"]{background:rgba(251,191,36,0.2);border-color:#fbbf24}
.hud-modes button.on[data-mode="timemachine"]{background:rgba(124,108,240,0.2);border-color:#7c6cf0}
.hud-sub{display:flex;gap:4px;background:rgba(8,12,24,0.92);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:4px 8px;transition:opacity 0.3s}
.hud-sub button{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);color:#666;padding:4px 10px;border-radius:5px;cursor:pointer;font-size:10px;transition:all 0.2s}
.hud-sub button:hover{color:#aaa}
.hud-sub button.on{background:rgba(77,166,255,0.15);border-color:rgba(77,166,255,0.3);color:#4da6ff}
.mode-hint{font-size:10px;color:#555;text-align:center}

/* Panel */
.panel{position:fixed;right:-520px;top:0;bottom:0;width:520px;z-index:90;background:rgba(8,12,24,0.98);border-left:1px solid rgba(77,166,255,0.15);overflow-y:auto;transition:right 0.5s cubic-bezier(0.16,1,0.3,1)}
.panel.open{right:0}
.close-btn{position:absolute;top:14px;right:14px;background:none;border:none;color:#555;font-size:22px;cursor:pointer;z-index:5}

.fin-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.fin-card .card-title{font-size:13px;font-weight:600;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.fin-card .card-title .src{font-size:10px;color:#555;margin-left:auto}
.fin-row{display:flex;align-items:center;justify-content:space-between;padding:3px 0;font-size:12px}
.fin-row .label{color:#888;min-width:80px}
.fin-row .value{font-weight:500}
.fin-bar-wrap{flex:1;max-width:100px;height:5px;background:rgba(255,255,255,0.05);border-radius:3px;margin:0 8px;overflow:hidden}
.fin-bar{height:100%;border-radius:3px}
.fin-insight{margin-top:10px;padding:8px 10px;background:rgba(77,166,255,0.05);border-left:3px solid rgba(77,166,255,0.25);border-radius:0 6px 6px 0;font-size:11px;color:#8bb8d9;line-height:1.6}
.fin-change{font-size:10px;padding:1px 5px;border-radius:4px;margin-left:4px}
.fin-change.up{background:rgba(74,222,128,0.1);color:#4ade80}
.fin-change.down{background:rgba(248,113,113,0.1);color:#f87171}
.checkpoint{padding:8px 10px;background:rgba(251,191,36,0.04);border:1px solid rgba(251,191,36,0.1);border-radius:7px;margin-bottom:6px;font-size:11px}
.checkpoint .cp-title{color:#e0e0e0;font-weight:500}
.checkpoint .cp-detail{color:#888;margin-top:3px;line-height:1.5}

/* EQS */
.eqs-module{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 12px;margin-bottom:6px}
.eqs-bar{height:5px;background:rgba(255,255,255,0.05);border-radius:3px;margin:5px 0;overflow:hidden}
.eqs-fill{height:100%;border-radius:3px}
.eqs-what{background:rgba(77,166,255,0.04);border:1px solid rgba(77,166,255,0.1);border-radius:8px;padding:10px;font-size:11px;color:#8bb8d9;line-height:1.7}

.tm-scene{padding:20px}
.tm-header{text-align:center;margin-bottom:20px}
.tm-header .tm-date{font-size:28px;font-weight:700;color:#7c6cf0}
.tm-header .tm-sub{font-size:12px;color:#666;margin-top:4px}
.tm-disclosure{background:rgba(77,166,255,0.06);border:1px solid rgba(77,166,255,0.15);border-radius:10px;padding:14px 16px;margin-bottom:14px}
.tm-disclosure .tm-label{font-size:10px;color:#4da6ff;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.tm-disclosure .tm-title{font-size:15px;font-weight:600;color:#fff}
.tm-disclosure .tm-detail{font-size:12px;color:#999;margin-top:4px}
.tm-news{margin-bottom:14px}
.tm-news-item{display:flex;gap:8px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.03);font-size:11px}
.tm-news-item .src{color:#fbbf24;min-width:50px}
.tm-news-item .headline{color:#ccc}
.tm-choices{display:flex;gap:10px;justify-content:center;margin:20px 0}
.tm-choice{padding:12px 28px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;border:2px solid;transition:all 0.2s;text-align:center}
.tm-choice:hover{transform:scale(1.05)}
.tm-choice.buy{background:rgba(74,222,128,0.08);border-color:rgba(74,222,128,0.3);color:#4ade80}
.tm-choice.hold{background:rgba(255,255,255,0.05);border-color:rgba(255,255,255,0.15);color:#aaa}
.tm-choice.sell{background:rgba(248,113,113,0.08);border-color:rgba(248,113,113,0.3);color:#f87171}
.tm-result{display:none;animation:fadeUp 0.5s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.tm-result-card{background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);border-radius:10px;padding:16px;margin-bottom:10px}
.tm-result-card .big-num{font-size:32px;font-weight:700;text-align:center}
.tm-result-row{display:flex;justify-content:space-between;padding:4px 0;font-size:12px}
.tm-lesson{background:rgba(124,108,240,0.06);border:1px solid rgba(124,108,240,0.15);border-radius:10px;padding:14px;margin-top:14px}
.tm-lesson .lesson-title{font-size:12px;font-weight:600;color:#7c6cf0;margin-bottom:6px}
.tm-lesson .lesson-body{font-size:11px;color:#999;line-height:1.7}
.tm-eqs-hint{background:rgba(248,113,113,0.06);border:1px solid rgba(248,113,113,0.12);border-radius:8px;padding:10px 12px;margin-top:10px;font-size:11px;color:#d98888;line-height:1.6}
.tm-next{display:block;margin:16px auto 0;padding:10px 30px;background:rgba(124,108,240,0.15);border:1px solid rgba(124,108,240,0.3);border-radius:8px;color:#7c6cf0;font-size:13px;cursor:pointer;font-weight:500}

.title{position:fixed;top:16px;left:20px;z-index:50}

.title p{font-size:11px;color:rgba(255,255,255,0.3);margin-top:2px}
.title .live{display:inline-block;width:6px;height:6px;background:#22c55e;border-radius:50%;margin-right:4px;animation:pulse 2s infinite}
.legend{position:fixed;bottom:16px;right:16px;z-index:50;background:rgba(8,12,24,0.9);border:1px solid rgba(255,255,255,0.06);border-radius:8px;padding:10px 14px;font-size:10px;color:#666}
.legend-item{display:flex;align-items:center;gap:6px;margin:3px 0}

.disc-impact .company{font-weight:500}
.disc-impact .badge{font-size:10px;padding:2px 8px;border-radius:10px;font-weight:600}
</style>
</head>

    hint.textContent = '기업을 클릭하면 재무제표 번역 + EQS 이익 품질 분석을 볼 수 있습니다';

  } else if (mode === 'disclosure') {
    sub.innerHTML = `<button style="background:rgba(251,191,36,0.1);border-color:rgba(251,191,36,0.3);color:#fbbf24" onclick="simAlert()">📡 공시 시뮬레이션</button>`;
    hint.textContent = '공시 시뮬레이션 버튼을 누르거나, 기업을 클릭하면 공시 영향 분석을 볼 수 있습니다';
    flt = 'all';
  } else {
    sub.innerHTML = `<span style="color:#7c6cf0;font-size:11px">⏰ 기업을 클릭하면 과거로 돌아갑니다</span>`;
    hint.textContent = '삼성전자, SK하이닉스, LG디스플레이, 에코프로비엠에 타임머신 시나리오가 준비되어 있습니다';
    flt = 'all';
  }
}

// ===== GRAPH ENGINE (same) =====
function init(){const nm={};nodes=raw.map((r,i)=>{const sec=sectors[r.s]||{cx:0,cy:0,color:'#888'};const ang=(i/raw.length)*Math.PI*2+Math.random()*0.5;const rad=160+Math.random()*140;const n={...r,x:W/2+sec.cx*W*0.3+Math.cos(ang)*rad+(Math.random()-0.5)*60,y:H/2+sec.cy*H*0.3+Math.sin(ang)*rad+(Math.random()-0.5)*60,vx:0,vy:0,glow:0,pp:Math.random()*6.28,col:sec.color};nm[r.n]=n;return n;});edges=[];nodes.forEach(n=>{if(!n.rl)return;n.rl.forEach(r=>{const parts=r.split(':');const tn=parts[0],rt=parts[1],detail=parts.slice(2).join(':');const tgt=nm[tn];if(tgt)edges.push({a:n,b:tgt,type:rt,detail:detail});});});}
function physics(){const cx=W/2,cy=H/2;nodes.forEach(n=>{n.vx+=(cx-n.x)*0.00015;n.vy+=(cy-n.y)*0.00015;nodes.forEach(m=>{if(n===m)return;const dx=n.x-m.x,dy=n.y-m.y,d=Math.sqrt(dx*dx+dy*dy)||1;if(d<280){const f=500/(d*d);n.vx+=dx/d*f;n.vy+=dy/d*f;}});});edges.forEach(e=>{const dx=e.b.x-e.a.x,dy=e.b.y-e.a.y,d=Math.sqrt(dx*dx+dy*dy)||1;const f=(d-200)*0.002;e.a.vx+=dx/d*f;e.a.vy+=dy/d*f;e.b.vx-=dx/d*f;e.b.vy-=dy/d*f;});nodes.forEach(n=>{n.vx*=0.88;n.vy*=0.88;n.x+=n.vx;n.y+=n.vy;n.pp+=0.015;if(alertOn&&alertSrc){if(n.n===alertSrc)n.glow=Math.min(1,n.glow+0.04);else{const h1=edges.some(e=>(e.a.n===alertSrc&&e.b.n===n.n)||(e.b.n===alertSrc&&e.a.n===n.n));if(h1)n.glow=Math.min(0.8,n.glow+0.025);else n.glow=Math.max(0,n.glow-0.015);}}else n.glow=Math.max(0,n.glow-0.02);});}
function draw(){
time+=0.016;x.clearRect(0,0,W,H);

// === BACKGROUND: deep space gradient ===
const bgGrad=x.createRadialGradient(W/2,H/2,0,W/2,H/2,W*0.7);
bgGrad.addColorStop(0,'#0a0f1e');bgGrad.addColorStop(0.5,'#070b16');bgGrad.addColorStop(1,'#040711');
x.fillStyle=bgGrad;x.fillRect(0,0,W,H);

// === NEBULAE ===
nebulae.forEach(nb=>{const ng=x.createRadialGradient(nb.x*W,nb.y*H,0,nb.x*W,nb.y*H,nb.r*W);ng.addColorStop(0,`hsla(${nb.hue},60%,40%,${nb.alpha})`);ng.addColorStop(0.5,`hsla(${nb.hue},50%,30%,${nb.alpha*0.5})`);ng.addColorStop(1,'transparent');x.fillStyle=ng;x.fillRect(0,0,W,H);});

// === STARS with twinkle ===
stars.forEach(s=>{const tw=Math.sin(time*s.twinkleSpeed+s.b*10)*0.4+0.6;const bright=tw*s.s*0.3;x.beginPath();x.arc(s.x*W,s.y*H,s.s*0.6,0,Math.PI*2);x.fillStyle=`rgba(200,210,255,${Math.min(1,bright)})`;x.fill();if(s.s>1.5){x.beginPath();x.moveTo(s.x*W-s.s*2,s.y*H);x.lineTo(s.x*W+s.s*2,s.y*H);x.moveTo(s.x*W,s.y*H-s.s*2);x.lineTo(s.x*W,s.y*H+s.s*2);x.strokeStyle=`rgba(200,220,255,${bright*0.3})`;x.lineWidth=0.5;x.stroke();}});

// === SHOOTING STARS ===
shootingStars=shootingStars.filter(ss=>{ss.x+=ss.vx;ss.y+=ss.vy;ss.life-=0.02;if(ss.life<=0)return false;x.beginPath();x.moveTo(ss.x,ss.y);x.lineTo(ss.x-ss.vx*ss.len/5,ss.y-ss.vy*ss.len/5);const sg=x.createLinearGradient(ss.x,ss.y,ss.x-ss.vx*ss.len/5,ss.y-ss.vy*ss.len/5);sg.addColorStop(0,`rgba(255,255,255,${ss.life*0.8})`);sg.addColorStop(1,'transparent');x.strokeStyle=sg;x.lineWidth=1;x.stroke();return true;});

x.save();x.translate(camX,camY);x.scale(zm,zm);

// === RIPPLES ===
ripples=ripples.filter(r=>{r.radius+=3;r.alpha-=0.008;if(r.alpha<=0)return false;x.beginPath();x.arc(r.x,r.y,r.radius,0,Math.PI*2);x.strokeStyle=`rgba(77,166,255,${r.alpha})`;x.lineWidth=1.5;x.stroke();return true;});

// === EDGES ===
edges.forEach(e=>{const isH=hov&&(e.a.n===hov.n||e.b.n===hov.n);const isA=alertOn&&alertSrc&&(e.a.n===alertSrc||e.b.n===alertSrc);const fa=flt==='all'||e.a.s===flt,fb=flt==='all'||e.b.s===flt;if(!fa&&!fb)return;const st=EDGE_STYLES[e.type]||{color:'#999',width:0.5,dash:[]};x.beginPath();x.moveTo(e.a.x,e.a.y);x.lineTo(e.b.x,e.b.y);if(isA){x.strokeStyle=`rgba(251,191,36,${0.5+Math.sin(time*4)*0.2})`;x.lineWidth=2;x.setLineDash([6,4]);}else if(isH){x.strokeStyle=st.color;x.lineWidth=st.width*1.8;x.setLineDash(st.dash);x.globalAlpha=1.0;}else{x.strokeStyle=st.color;x.lineWidth=st.width;x.setLineDash(st.dash);x.globalAlpha=0.6;}x.stroke();x.globalAlpha=1.0;x.setLineDash([]);});

// === NODES as 3D PLANETS ===
nodes.forEach(n=>{
  const filtered=flt!=='all'&&n.s!==flt;
  const r=n.sz*18;
  const pulse=Math.sin(n.pp)*0.08+1;
  const pr=r*pulse;

  // Alert glow
  if(n.glow>0.01){const gr=pr*(2.5+n.glow*2);const g=x.createRadialGradient(n.x,n.y,pr*0.5,n.x,n.y,gr);g.addColorStop(0,n.n===alertSrc?`rgba(251,191,36,${n.glow*0.5})`:`rgba(77,166,255,${n.glow*0.4})`);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.beginPath();x.arc(n.x,n.y,gr,0,Math.PI*2);x.fill();}

  const isH=hov&&hov.n===n.n,isS=sel&&sel.n===n.n;
  const alpha=filtered?0.15:1;

  // Parse hex color
  const col=n.col;
  const hr=parseInt(col.slice(1,3),16),hg=parseInt(col.slice(3,5),16),hb=parseInt(col.slice(5,7),16);

  // === 3D PLANET: radial gradient with highlight ===
  const lightX=n.x-pr*0.3, lightY=n.y-pr*0.3;
  const planetGrad=x.createRadialGradient(lightX,lightY,pr*0.1,n.x,n.y,pr);

  if(isS){
    planetGrad.addColorStop(0,`rgba(${Math.min(255,hr+100)},${Math.min(255,hg+100)},${Math.min(255,hb+100)},${alpha})`);
    planetGrad.addColorStop(0.4,`rgba(${hr},${hg},${hb},${alpha})`);
    planetGrad.addColorStop(1,`rgba(${Math.floor(hr*0.3)},${Math.floor(hg*0.3)},${Math.floor(hb*0.3)},${alpha})`);
    x.shadowColor=col;x.shadowBlur=30;
  }else if(isH){
    planetGrad.addColorStop(0,`rgba(${Math.min(255,hr+80)},${Math.min(255,hg+80)},${Math.min(255,hb+80)},${alpha*0.9})`);
    planetGrad.addColorStop(0.4,`rgba(${hr},${hg},${hb},${alpha*0.85})`);
    planetGrad.addColorStop(1,`rgba(${Math.floor(hr*0.25)},${Math.floor(hg*0.25)},${Math.floor(hb*0.25)},${alpha*0.8})`);
    x.shadowColor=col;x.shadowBlur=20;
  }else{
    planetGrad.addColorStop(0,`rgba(${Math.min(255,hr+60)},${Math.min(255,hg+60)},${Math.min(255,hb+60)},${alpha*0.7})`);
    planetGrad.addColorStop(0.5,`rgba(${hr},${hg},${hb},${alpha*0.5})`);
    planetGrad.addColorStop(1,`rgba(${Math.floor(hr*0.2)},${Math.floor(hg*0.2)},${Math.floor(hb*0.2)},${alpha*0.4})`);
    x.shadowBlur=0;
  }

  x.beginPath();x.arc(n.x,n.y,pr,0,Math.PI*2);
  x.fillStyle=planetGrad;x.fill();
  x.shadowBlur=0;

  // Atmosphere ring
  if(!filtered&&pr>12){
    const atmo=x.createRadialGradient(n.x,n.y,pr*0.9,n.x,n.y,pr*1.15);
    atmo.addColorStop(0,'transparent');
    atmo.addColorStop(0.5,`rgba(${hr},${hg},${hb},0.08)`);
    atmo.addColorStop(1,'transparent');
    x.beginPath();x.arc(n.x,n.y,pr*1.15,0,Math.PI*2);x.fillStyle=atmo;x.fill();
  }

  // Specular highlight (small bright spot)
  if(!filtered){
    const specGrad=x.createRadialGradient(lightX,lightY,0,lightX,lightY,pr*0.35);
    specGrad.addColorStop(0,`rgba(255,255,255,${alpha*0.25})`);
    specGrad.addColorStop(1,'transparent');
    x.beginPath();x.arc(lightX,lightY,pr*0.35,0,Math.PI*2);x.fillStyle=specGrad;x.fill();
  }

  // EQS arc (analyze mode)
  if(!filtered&&pr>10&&currentMode==='analyze'){const ec=n.eqs>=70?'#4ade80':n.eqs>=50?'#fbbf24':'#f87171';x.beginPath();x.arc(n.x,n.y,pr+5,-(Math.PI/2),-(Math.PI/2)+(Math.PI*2*n.eqs/100));x.strokeStyle=ec+'88';x.lineWidth=2;x.stroke();}

  // Mode-specific labels
  if(currentMode==='timemachine'&&n.tm&&!filtered){x.fillStyle='rgba(124,108,240,0.9)';x.font='bold 9px -apple-system,sans-serif';x.textAlign='center';x.fillText('⏰ 타임머신',n.x,n.y-pr-10);}
  if(n.glow>0.3&&n.n!==alertSrc&&!filtered&&currentMode==='disclosure'){const imp=edges.some(e=>(e.a.n===alertSrc&&e.b.n===n.n&&(e.type==='공급'||e.type==='종속'||e.type==='피인수'))||(e.b.n===alertSrc&&e.a.n===n.n&&(e.type==='공급'||e.type==='종속'||e.type==='피인수')))?'↑ 수혜 예상':edges.some(e=>(e.a.n===alertSrc&&e.b.n===n.n&&e.type==='경쟁')||(e.b.n===alertSrc&&e.a.n===n.n&&e.type==='경쟁'))?'↓ 경쟁 압박':'● 영향권';x.fillStyle=imp.includes('수혜')?'rgba(74,222,128,0.9)':imp.includes('경쟁')?'rgba(248,113,113,0.9)':'rgba(77,166,255,0.9)';x.font='bold 9px -apple-system,sans-serif';x.textAlign='center';x.fillText(imp,n.x,n.y-pr-10);}

  // Name label
  if(!filtered||isH){x.fillStyle=`rgba(255,255,255,${filtered?0.2:0.85})`;x.font=`${n.sz>2?'12':'10'}px -apple-system,sans-serif`;x.textAlign='center';x.fillText(n.n,n.x,n.y+pr+16);}
});

// === MASCOT EMOJI ===
if(mascot.targetNode===null||mascot.progress>=1){mascot.waitTimer+=0.016;if(mascot.waitTimer>2){mascot.waitTimer=0;pickNextNode();}}
if(mascot.targetNode&&mascot.progress<1){
  mascot.progress=Math.min(1,mascot.progress+0.012);
  const t=mascot.progress;
  const ease=t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const prevNode=mascot.prevNode||mascot.targetNode;
  mascot.x=prevNode.x+(mascot.targetNode.x-prevNode.x)*ease;
  mascot.y=prevNode.y+(mascot.targetNode.y-prevNode.y)*ease;
  mascot.bounceY=Math.abs(Math.sin(t*Math.PI))*40;
  mascot.scale=1+Math.sin(t*Math.PI)*0.15;
  // trail
  if(Math.random()<0.3)mascot.trail.push({x:mascot.x,y:mascot.y-mascot.bounceY,alpha:0.4,s:6+Math.random()*4});
}else if(mascot.targetNode){
  mascot.x=mascot.targetNode.x;mascot.y=mascot.targetNode.y;
  mascot.bouncePhase+=0.05;
  mascot.bounceY=Math.abs(Math.sin(mascot.bouncePhase))*8;
  mascot.scale=1+Math.sin(mascot.bouncePhase*2)*0.05;
}
// draw trail
mascot.trail=mascot.trail.filter(p=>{p.alpha-=0.015;p.s*=0.97;if(p.alpha<=0)return false;x.beginPath();x.arc(p.x,p.y,p.s,0,Math.PI*2);x.fillStyle=`rgba(255,220,100,${p.alpha*0.3})`;x.fill();return true;});
// draw mascot shadow
const mSize=22*mascot.scale/zm;
x.beginPath();x.ellipse(mascot.x,mascot.y+8/zm,mSize*0.6,mSize*0.2,0,0,Math.PI*2);x.fillStyle='rgba(0,0,0,0.2)';x.fill();
// draw mascot
x.font=`${Math.round(mSize*2)}px serif`;x.textAlign='center';x.textBaseline='middle';
x.fillText(mascot.emoji,mascot.x,mascot.y-mascot.bounceY/zm);

// Update prevNode for next hop
if(mascot.progress>=1&&mascot.targetNode){mascot.prevNode=mascot.targetNode;}

x.restore();physics();requestAnimationFrame(draw);}

// ===== INTERACTION =====
c.addEventListener('mousemove',e=>{if(drag){camX=cs.x+(e.clientX-ds.x);camY=cs.y+(e.clientY-ds.y);return;}const mx=(e.clientX-camX)/zm,my=(e.clientY-camY)/zm;hov=null;nodes.forEach(n=>{const dx=n.x-mx,dy=n.y-my;if(Math.sqrt(dx*dx+dy*dy)<n.sz*22){hov=n;c.style.cursor='pointer';}});if(!hov)c.style.cursor='grab';});
c.addEventListener('mousedown',e=>{const mx=(e.clientX-camX)/zm,my=(e.clientY-camY)/zm;let clicked=null;nodes.forEach(n=>{const dx=n.x-mx,dy=n.y-my;if(Math.sqrt(dx*dx+dy*dy)<n.sz*22)clicked=n;});if(clicked){sel=clicked;if(currentMode==='analyze')showAnalyze(clicked);else if(currentMode==='disclosure')showDisclosure(clicked);else showTimemachine(clicked);}else{drag=true;ds={x:e.clientX,y:e.clientY};cs={x:camX,y:camY};c.style.cursor='grabbing';}});
c.addEventListener('mouseup',()=>{drag=false;c.style.cursor='grab';});
c.addEventListener('wheel',e=>{const d=e.deltaY>0?0.9:1.1;const mx=e.clientX,my=e.clientY;const wx=(mx-camX)/zm,wy=(my-camY)/zm;zm=Math.max(0.2,Math.min(4,zm*d));camX=mx-wx*zm;camY=my-wy*zm;e.preventDefault();},{passive:false});

function closePanel(){document.getElementById('panel').classList.remove('open');sel=null;}
function filter(f,btn){flt=f;document.querySelectorAll('.hud-sub button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');}

  const eqsExplain=n.eqs>=70?`이익 품질 <strong style="color:#4ade80">양호</strong>. 재무제표를 상당 부분 신뢰 가능.`:n.eqs>=50?`이익 품질 <strong style="color:#fbbf24">주의</strong> 필요. 일부 경고 신호 감지.`:`이익 품질 <strong style="color:#f87171">경고</strong>. 보고된 이익의 질에 의문. 추가 확인 필요.`;

  document.getElementById('panelInner').innerHTML=`

    ${!isFinancial?`
    <div class="fin-card"><div class="card-title">💰 돈을 잘 벌고 있나?<span class="src">손익계산서</span></div>
      <div class="fin-row"><span class="label">매출액</span><div class="fin-bar-wrap"><div class="fin-bar" style="width:100%;background:#4da6ff"></div></div><span class="value">${n.rv}조</span><span class="fin-change ${n.rv_chg>=0?'up':'down'}">${n.rv_chg>=0?'+':''}${n.rv_chg}%</span></div>
      <div class="fin-row"><span class="label">영업이익</span><div class="fin-bar-wrap"><div class="fin-bar" style="width:${Math.min(100,Math.abs(parseFloat(n.oi)/parseFloat(n.rv)*100*3))}%;background:${oiSign?'#f87171':'#4ade80'}"></div></div><span class="value" style="color:${oiSign?'#f87171':'#4ade80'}">${n.oi}조</span><span class="fin-change ${n.oi_chg>=0?'up':'down'}">${Math.abs(n.oi_chg)>500?(n.oi_chg>0?'흑전':'적전'):(n.oi_chg>=0?'+':'')+n.oi_chg+'%'}</span></div>
      <div class="fin-insight">"${margin100}"</div></div>
    <div class="fin-card"><div class="card-title">🏦 곳간은 튼튼한가?<span class="src">재무상태표</span></div>
      <div class="fin-row"><span class="label">자산</span><div class="fin-bar-wrap"><div class="fin-bar" style="width:100%;background:#4da6ff"></div></div><span class="value">${n.ta}조</span></div>
      <div class="fin-row"><span class="label">부채</span><div class="fin-bar-wrap"><div class="fin-bar" style="width:${Math.min(100,parseFloat(n.tl)/parseFloat(n.ta)*100)}%;background:#f87171"></div></div><span class="value">${n.tl}조</span></div>
      <div class="fin-insight">"부채비율 ${n.dr}%" — ${n.dr<100?'양호 ✅':n.dr<200?'보통 ⚠':'높음 🔴'}</div></div>
    <div class="fin-card"><div class="card-title">💵 현금이 진짜 들어오나?<span class="src">현금흐름표</span></div>
      <div class="fin-row"><span class="label">영업활동</span><span class="value" style="color:${String(n.ocf).startsWith('-')?'#f87171':'#4ade80'}">${n.ocf}조 ${String(n.ocf).startsWith('-')?'🔴':'🟢'}</span></div>
      <div class="fin-row"><span class="label">투자활동</span><span class="value" style="color:#4da6ff">${n.icf}조</span></div>
      <div class="fin-row"><span class="label">재무활동</span><span class="value" style="color:#fbbf24">${n.fcf}조</span></div></div>
    `:`<div class="fin-card"><div class="card-title">🏦 금융업 재무 요약</div><div class="fin-row"><span class="label">영업수익</span><span class="value">${n.rv}조</span></div><div class="fin-row"><span class="label">영업이익</span><span class="value" style="color:#4ade80">${n.oi}조</span></div><div class="fin-insight">금융업은 별도 분석 기준 적용</div></div>`}
    <div class="section-title" style="color:#fbbf24">⚡ 주목 포인트</div>${cpHtml}
    <div class="section-title" style="color:#4da6ff">🔬 이익 해부 (EQS)</div>
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px"><span style="font-size:32px;font-weight:700;color:${eqsCol}">${n.eqs}</span><span style="font-size:13px;padding:3px 8px;border-radius:5px;background:${eqsCol}15;color:${eqsCol};font-weight:600">${n.gr}등급</span></div>
    <div class="eqs-what">${eqsExplain}<br><br>⚕️ EQS는 "이 기업의 이익을 믿어도 되는 정도"를 진단합니다. 주가 예측이 아닌 재무 건강 진단.</div>
    ${modsHtml}
    <div class="section-title" style="color:#888">🔗 관계 (${rels.length}개)</div>${relHtml||'없음'}`;
  p.classList.add('open');
}

// ===== PANEL: DISCLOSURE =====
function showDisclosure(n) {
  const p=document.getElementById('panel');
  const disc=n.disc&&n.disc.length?n.disc[0]:null;
  const rels=edges.filter(e=>e.a.n===n.n||e.b.n===n.n);
  let impactsHtml='';
  if(disc){impactsHtml=disc.impacts.map(imp=>`<div class="disc-impact" style="background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06)"><span class="company">${imp.n} <span style="color:#666;font-size:10px">(${imp.type})</span></span><span class="badge" style="background:${imp.badge_col}18;color:${imp.badge_col};border:1px solid ${imp.badge_col}33">${imp.badge} ${imp.conf}%</span></div>`).join('');}
  document.getElementById('panelInner').innerHTML=`
    <h2 style="color:#fbbf24;font-size:18px">📡 ${n.n} 공시</h2>
    <div style="color:#666;font-size:12px;margin-bottom:16px">${n.t} | ${n.s}</div>
    ${disc?`
    <div style="background:rgba(77,166,255,0.05);border:1px solid rgba(77,166,255,0.12);border-radius:10px;padding:14px;margin-bottom:14px">
      <div style="font-size:10px;color:#4da6ff;margin-bottom:4px">최근 주요 공시</div>
      <div style="font-size:14px;font-weight:600;color:#fff">${disc.title}</div>
    </div>
    <div class="section-title" style="color:#fbbf24">📊 영향 분석 (CatBoost + Calibration)</div>
    ${impactsHtml}
    <div style="font-size:10px;color:#555;margin-top:8px;line-height:1.5">* 신뢰도 60% 미만은 "판단 유보"로 표시<br>* 과거 유사 패턴 기반 분류 (예측이 아닌 통계 참고)</div>
    `:`<div style="color:#555;font-size:12px;padding:30px 0;text-align:center">최근 주요 공시 데이터 없음<br><br>공시 시뮬레이션 버튼을 눌러<br>삼성전자의 공시 영향 분석을 체험해보세요</div>`}
    <div class="section-title" style="color:#888">🔗 관계 네트워크</div>
    ${rels.map(e=>{const o=e.a.n===n.n?e.b:e.a;return `<span class="tag">${e.type} ${o.n}</span>`;}).join('')||'없음'}`;
  p.classList.add('open');
}

// ===== PANEL: TIMEMACHINE =====
function showTimemachine(n) {
  const p=document.getElementById('panel');
  if(!n.tm){
    document.getElementById('panelInner').innerHTML=`
      <h2 style="color:#7c6cf0;font-size:18px">🕰 타임머신</h2>
      <div style="color:#666;font-size:12px;margin-bottom:20px">${n.n}</div>
      <div style="text-align:center;padding:40px 0;color:#555">
        <div style="font-size:40px;margin-bottom:12px">🔒</div>
        <div style="font-size:13px">이 기업의 타임머신 시나리오는<br>아직 준비되지 않았습니다</div>
        <div style="font-size:11px;color:#444;margin-top:12px">삼성전자, SK하이닉스, LG디스플레이,<br>에코프로비엠에서 체험 가능합니다</div>
      </div>`;
    p.classList.add('open');return;
  }
  const tm=n.tm;
  const newsHtml=tm.news.map(nw=>`<div class="tm-news-item"><span class="src">${nw.src}</span><span class="headline">${nw.h}</span></div>`).join('');
  const supplyHtml=tm.answer.supply.map(s=>`<div class="tm-result-row"><span style="color:#888">${s.n}</span><span style="color:${s.chg.startsWith('+')?'#4ade80':'#f87171'};font-weight:500">${s.chg}</span></div>`).join('');
  
  document.getElementById('panelInner').innerHTML=`
    <div class="tm-scene">
      <div class="tm-header">
        <div style="font-size:11px;color:#7c6cf0;letter-spacing:2px">TIME MACHINE</div>
        <div class="tm-date">${tm.date}</div>
        <div class="tm-sub">당신은 이 시점으로 돌아왔습니다</div>
      </div>
      <div class="tm-disclosure">
        <div class="tm-label">📡 방금 공시가 떴습니다</div>
        <div class="tm-title">${n.n} — ${tm.disclosure}</div>
      </div>
      <div style="font-size:11px;color:#fbbf24;font-weight:500;margin-bottom:6px">📰 그때 뉴스 반응</div>
      <div class="tm-news">${newsHtml}</div>
      <div style="text-align:center;font-size:13px;color:#999;margin:16px 0 8px">당신의 선택은?</div>
      <div class="tm-choices" id="tmChoices">
        <div class="tm-choice buy" onclick="revealTM(this,'매수')">🟢<br>매수</div>
        <div class="tm-choice hold" onclick="revealTM(this,'관망')">⚪<br>관망</div>
        <div class="tm-choice sell" onclick="revealTM(this,'매도')">🔴<br>매도</div>
      </div>
      <div class="tm-result" id="tmResult">
        <div class="tm-result-card">
          <div style="font-size:11px;color:#888;margin-bottom:6px;text-align:center">이후 실제 결과</div>
          <div class="big-num" style="color:${tm.answer.stock_chg.startsWith('+')?'#4ade80':'#f87171'}">${n.n} ${tm.answer.stock_chg}</div>
          ${supplyHtml?`<div style="margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.05)"><div style="font-size:10px;color:#666;margin-bottom:4px">관련 기업</div>${supplyHtml}</div>`:''}
        </div>
        <div class="tm-lesson">
          <div class="lesson-title">💡 이 공시에서 배울 점</div>
          <div class="lesson-body">${tm.answer.lesson.replace(/\n/g,'<br>')}</div>
        </div>
        <div class="tm-eqs-hint">
          <div style="font-weight:600;margin-bottom:4px">🔬 그때 EQS가 말해줬을 것</div>
          ${tm.answer.eqs_hint.replace(/\n/g,'<br>')}
        </div>
      </div>
    </div>`;
  p.classList.add('open');
}

function revealTM(el, choice) {
  document.getElementById('tmChoices').querySelectorAll('.tm-choice').forEach(c=>{c.style.opacity='0.3';c.style.pointerEvents='none';});
  el.style.opacity='1';el.style.border='2px solid #fff';
  document.getElementById('tmResult').style.display='block';
}

// INIT — Phase 2f: fetch로 data/graph_top50.json 로드 후 init/draw
fetch('../data/graph_top50.json')
  .then(r => { if (!r.ok) throw new Error('graph_top50.json 로드 실패 — `python -m modules.relation export` 먼저 실행'); return r.json(); })
  .then(data => {
    raw = data;
    init();
    draw();
    setMode('analyze', document.querySelector('[data-mode="analyze"]'));
    console.log(`[viewer] 노드 ${nodes.length}, 엣지 ${edges.length} 로드 완료`);
  })
  .catch(err => {
    console.error(err);
    document.body.innerHTML = `<pre style="color:#fbbf24;padding:40px;font-family:monospace">
[viewer 로드 에러]
${err.message}

해결:
  1. python -m modules.relation run  (전체 파이프라인 실행)
  2. 또는 python -m modules.relation export  (graph_top50.json 생성)
  3. 로컬 서버가 modules/relation/data/ 경로를 서빙하는지 확인

상세 로그는 개발자 콘솔(F12)에 있습니다.
</pre>`;
  });
</script>
